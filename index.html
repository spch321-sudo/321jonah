<script id="DATA" type="application/json">{"ch":[{"n":1,"t":"你起來往尼尼微大城去","sub":"逃・下・魚","lv":"A","arc":"逃","sec":[["1:1--2","神的差遣：起來往尼尼微大城去，向其中的居民呼喊"],["1:3--3","約拿逃往他施：下到約帕，躲避耶和華"],["1:4--6","大風與沉睡的先知：船主說「起來，求告你的神」"],["1:7--10","掣籤與承認：我敬畏耶和華，天上的神"],["1:11--16","拋在海中：水手求告，海就平息，他們大大敬畏"],["1:17--17","耶和華安排一條大魚"]],"serm":{"pts":[["神的差遣","1:1--3","你起來往尼尼微大城去"],["沉睡的先知","1:4--10","你這沉睡的人哪，為何這樣呢"],["拋下與接住","1:11--17","耶和華安排一條大魚吞了約拿"]]},"q":"你有沒有過這樣的經驗：心裡清楚知道有一件事該去做，卻先去訂了一張往反方向的車票？不是吵架，也不是翻臉，只是很安靜地轉過身。約拿書第一章，從一位先知的轉身開始。這一章要問：當神的話臨到我，我是起來去，還是起來逃？","truth":"神的話臨到約拿，差他往尼尼微大城去呼喊；他起來，卻往相反的方向逃，一路向下；神擲出大風、安排大魚，不是要毀滅他，是要把他追回來；而一船不認識神的人，因此先敬畏了耶和華。","mv":{"t":"你起來往尼尼微大城去，向其中的居民呼喊","r":"拿1:2"},"card":["耶和華的話臨到亞米太的兒子約拿，叫他起來，往尼尼微大城去，向其中的居民呼喊，因為他們的惡達到神面前。約拿卻起來，逃往他施去躲避耶和華；他下到約帕，給了船價，上了船。神使海中起大風，船幾乎破壞；水手各人哀求自己的神，約拿卻下到底艙沉睡。船主叫醒他，水手掣籤，掣出約拿；他說自己是敬畏創造滄海旱地之神的希伯來人，並說：把我抬起來拋在海中，海就平靜了。水手竭力盪槳不成，求告耶和華，才把他拋下；海就平息，他們大大敬畏耶和華，獻祭許願。耶和華安排一條大魚吞了約拿，他在魚腹中三日三夜。","「你起來往尼尼微大城去」：神的話先於人的路。「起來」（qum）是神的命令，也是約拿的動作；同一個動詞，方向相反。「大城」的「大」，是神看這座城的字（全卷出現 14 次，最後落在 4:11）。「面前」在本章出現四次：惡上到神的面前，約拿要離開神的面前。","耶穌說過「約拿的神蹟」（太12:39–41），又說「在這裡有一人比約拿更大」。祂也曾在船上遇見風浪：約拿睡在底艙，耶穌睡在船尾；約拿是逃跑的人睡了，耶穌是安靠父的人睡了；約拿被拋進海裡，風浪才止息，耶穌站起來，一斥責，風浪就止息（可4:35–41）。那位更大的，不是逃，是自己走進風浪。","無己是承認：我不是那個決定「去不去」的人。我放下「我覺得不合理」「我比較懂」「我不想見那些人」這些理由，回到本位，讓神作神，讓人作人。一個人逃得越遠，越看得出他心裡仍想作自己的主。","「你起來往尼尼微大城去，向其中的居民呼喊」","這個星期，找出一件你心裡早就知道神要你做、卻一直往反方向走的事，寫下來，對神說：主，我先起來，一步就好；再找一個你信得過的人，告訴他這一步。","最終整合：\n神的話臨到約拿，叫他起來往大城去。\n約拿起來了，卻是往他施逃；一路向下，到約帕，到船裡，到底艙。\n神擲出大風，安排大魚，是追他，不是丟棄他。\n一船不認識神的人，先敬畏了耶和華。\n約拿一句「我知道是因我」，是這章最誠實的話。\n讓耶穌作王，在我裡面，起來，去。"],"self":"聽見差遣的定義：我不再用「合不合理」「我願不願意」去審查神的話；我承認自己會轉身、會逃、會沉睡，也承認神不放手；我願意先起來，走一步。","t321":{"k":"耶穌在風浪中站起來斥責風，也走向十字架，沒有一次轉身；祂不是不怕，而是把自己交在父手裡（拿1:3；可4:39；路22:42）。","g":"讓耶穌作王，就是讓祂的話比我的理由大、比我的恐懼大；我不再替神決定誰值得被差去、誰不值得被愛（拿1:2、3、12）。","p":"屬神的體系，是一群聽見差遣、肯起來的人；逃的時候有人叫醒，沉睡的時候有人陪伴，誠實的時候有人接住（拿1:6、12、14）。"},"grp":["【一、破冰】你有沒有過這樣的經驗：明知道該做某件事，卻先去做了別的事，躲開它？當時的心裡，是什麼滋味？","【二、扎心】1:3 約拿起來，卻逃往他施。你生命裡，有沒有一個「神的話」，你一直繞過去？是什麼？不必說細節。","【三、經文】1:5–6 約拿在底艙沉睡，船主叫醒他。你曾經被誰「叫醒」？那個人有沒有說對什麼？","【四、福音】耶穌在船尾睡了，也站起來斥責風浪（可4:38–39）。這怎樣改變你面對「風浪」與「逃」的方式？","【五、行動】1:12 約拿說：「我知道你們遭這大風是因我的緣故。」這個星期，你要向誰說出一句誠實的話？是什麼、怎麼說、告訴誰？"],"prac":{"main":"聽見差遣，起來一步，誠實說出口","items":["對神：每天三分鐘，安靜地說：主，若有一件事是我一直往反方向走的，求祢指給我；我先起來一步。","對自己：寫下一件你「知道該做，卻一直躲開」的事，問：我怕的是什麼？是事，還是人？","對人：找一位你信得過的人，說出這一件事，請他一個星期後問你：走了嗎？","對生活：這個星期，有一件你一直在拖的小事（一通電話、一次探望、一句道歉），挑一個時間，做完它。","對使命：留意身邊「沉睡」的人，不批評他，只說：我陪你，我們一起起來，求告神。"]},"safe":["① 錯誤講法：把約拿逃往他施，講成「約拿是壞人」「約拿是叛徒」，並拿他來嘲笑不順服的人","正確理解：約拿是被神差遣的先知，也是後來被神挽回的人；他為什麼逃，4:2 才揭曉。這卷書不是在羞辱一個人，是在顯出神的不放手。","檢驗標準：會眾是更看見神的追趕，還是更熱衷於批評約拿？","② 錯誤講法：把尼尼微的「惡」，講成今日某個國家、民族或政權的名字","正確理解：尼尼微是亞述的重要大城，經文說的是「他們的惡達到我面前」（1:2）；本講義不把它等同今日任何族群，也不以此替任何仇恨背書。","檢驗標準：會眾是更看見神對一座城的眼光，還是更熱衷於點名別人？","③ 錯誤講法：把大風、大魚講成「不順服就被神懲罰」的固定公式，叫在風浪中的人懷疑自己做錯了什麼","正確理解：本章的風是神擲的，為的是追約拿；但經文沒有說每一場風浪都是懲罰。耶穌的門徒順服也遇過風浪（可4:35–41）；約伯、保羅也有風浪。","檢驗標準：在苦難中的人，聽了之後是更靠近神，還是更自責、更怕？","④ 錯誤講法：把約拿在底艙「沉睡」講成懶惰、屬靈麻木，叫疲憊、憂鬱的人自責","正確理解：本章寫的是「離開差遣的人」的沉睡，不是一般的睡眠；身心疲憊、失眠、憂鬱，是需要被陪伴與醫治的事，不是罪的記號。","檢驗標準：疲倦的人是被安慰，還是被定罪？","⑤ 錯誤講法：把 1:7 掣籤講成教會可以用抽籤決定神旨意的根據","正確理解：掣籤是外邦水手的做法，神使用了；舊約也有用籤的例子，但本章沒有叫教會這樣做決定。我們靠聖經、聖靈的引導與眾聖徒的印證。","檢驗標準：會眾是更依靠神的話與同行的人，還是更想靠一個記號？","⑥ 錯誤講法：把 1:12 約拿叫人「把我拋下海」，講成英雄式的犧牲，或求死的正當理由","正確理解：約拿在這裡承認「是因我」，是誠實；經文沒有稱讚他求死。本講義不鼓勵任何人傷害自己；若有人心裡有「不如消失」的念頭，請陪伴他，並協助尋求專業的幫助。","檢驗標準：聽的人是更敢說出誠實的話，還是更覺得自己該消失？","⑦ 錯誤講法：把 1:16 水手「大大敬畏耶和華，獻祭許願」，直接講成「他們已經得救」或「外邦人比以色列人好」","正確理解：經文只記下他們的敬畏、獻祭與許願；他們後來如何，經文沒有說。本講義不替經文下結論，也不用外邦人去羞辱神的百姓。","檢驗標準：會眾是更看見神的名被認識，還是更熱衷於比較誰比誰屬靈？","⑧ 錯誤講法：用「大魚」的科學可能性，爭辯、羞辱持不同文體觀點的弟兄姊妹","正確理解：1:17 的重點是「耶和華安排」；經文沒有指明魚的種類。無論讀者怎樣看這卷書的文體，耶穌自己提到約拿（太12:39–41），這個重量不變。","檢驗標準：討論之後，大家是更靠近神的話，還是更靠近自己的立場？","⑨ 錯誤講法：把 1:9「我敬畏耶和華」講成「約拿的信仰沒問題，行為不重要」","正確理解：約拿說出了正確的告白，卻逃往海上；知道與住在所知道的裡面，是兩回事。這不是要定他的罪，是要我們看見自己也是這樣。","檢驗標準：會眾是更看見自己的口與腳之間的距離，還是只更熟練地背信仰告白？","⑩ 錯誤講法：把「躲避耶和華的面」講成人真的可以離開神","正確理解：約拿自己知道神是造海的神（1:9）；逃離的是「差遣」與「面前的關係」，不是神的同在（參詩139:7–10）。","檢驗標準：逃跑的人，是更知道神追得上，還是更相信自己躲得過？","⑪ 錯誤講法：用 1:17「三日三夜」去算日子，或拿來推算任何事件的時間","正確理解：三日三夜是一段在黑暗裡的時間；耶穌引用時，指向祂自己的死與復活（太12:40）。本講義不算日子，不排時間表。","檢驗標準：會眾是更仰望復活的主，還是更熱衷於算數字？","⑫ 錯誤講法：把「神的差遣」講成「叫人做自己最不願意的事，才是神的旨意」，或把一切痛苦都說成神的呼召","正確理解：神差約拿，是為了尼尼微的生命；不是為了折磨約拿。順服不等於自我摧毀；受傷的人需要被保護，不是被「差去」面對傷害他的人。","檢驗標準：被差遣的人，是更確定被愛，還是更覺得自己被利用？"]},{"n":2,"t":"救恩出於耶和華","sub":"深・禱・救","lv":"A","arc":"禱","sec":[["2:1--2","魚腹中的禱告：我遭遇患難求告耶和華"],["2:3--6","深淵與山根：你卻將我的性命從坑中救出來"],["2:7--7","想念耶和華：我的禱告進入你的聖殿"],["2:8--9","虛無之神與感謝的聲音：救恩出於耶和華"],["2:10--10","魚把約拿吐在旱地上"]],"serm":{"pts":[["在深處求告","2:1--3","我遭遇患難求告耶和華，你就應允我"],["下到山根","2:4--6","你卻將我的性命從坑中救出來"],["救恩出於耶和華","2:7--10","救恩出於耶和華"]]},"q":"你有沒有過一個夜晚，心裡很想禱告，卻覺得自己沒有資格開口？不是不知道神在哪裡，而是知道自己逃過、拖過、睡過。約拿書第二章，是一位逃跑的先知，在魚腹中第一次開口。這一章要問：當我什麼都做不到的時候，我還能對神說什麼？","truth":"約拿在魚腹中第一次禱告：他說神已經聽見，說是神把他投進深淵，說自己下到山根，卻說神把他的性命從坑中救出來；他的禱告進入神的聖殿，他要用感謝的聲音獻祭；全章的結論是：救恩出於耶和華；耶和華一吩咐，魚就把他吐在旱地上。","mv":{"t":"救恩出於耶和華","r":"拿2:9"},"card":["約拿在魚腹中禱告耶和華他的神。他說：我遭遇患難求告耶和華，你就應允我；從陰間的深處呼求，你就俯聽我的聲音。他說是神將他投下深淵，波浪洪濤都漫過他；他從神眼前被驅逐，仍要仰望神的聖殿。水環繞他，海草纏他的頭，他下到山根，地的門將他永遠關住；耶和華卻將他的性命從坑中救出來。他的心發昏的時候，他想念耶和華，他的禱告達到神的聖殿。他說信奉虛無之神的人離棄慈愛，他自己卻要用感謝的聲音獻祭，償還所許的願，因為救恩出於耶和華。耶和華吩咐魚，魚就把約拿吐在旱地上。","「救恩出於耶和華」：「救恩」（yeshu'ah）與「耶穌」的名同一個字根，意思是「救恩屬於耶和華」。「下到山根」的「下」（yarad），是全卷「下去」的最後一次；神把他「救出來」用的動詞 alah，是「上去、帶上來」，與 1:2 惡「上」到神面前同一個字。「慈愛」（chesed）全卷只出現兩次：2:8 與 4:2。","耶穌說：「約拿三日三夜在大魚肚腹中，人子也要這樣三日三夜在地裡頭」（太12:40）。約拿是逃跑被拋進深處，耶穌是甘心為我們下去；約拿被魚吐在旱地上，耶穌從死裡復活。約拿在深處說「救恩出於耶和華」，耶穌就是那位把救恩成全的人。那把約拿帶上來的神，也把祂的兒子從死裡帶上來。","無己是承認：連我的禱告，也不是我的功勞。約拿在深處不再說「我配」，只說「救恩出於耶和華」。無己的人，禱告不是為了證明自己夠誠懇，而是回到本位：我不是救自己的人，神才是；我放下自己的力氣，神就在深處把我帶上來。","「救恩出於耶和華」","這個星期，找一個安靜的時間，用約拿的方式禱告：先說「主，我在這裡」，再說「祢已經聽見」，最後說一件你要感謝的事；不必求出一個漂亮的句子，一句真話就夠。","最終整合：\n約拿在魚腹中，第一次開口禱告。\n他說，是神聽見了；是神把他投下深淵，也是神把他的性命從坑中救出來。\n他下到山根，神把他帶上來。\n他在最軟弱的時候想念耶和華，他的禱告到了聖殿。\n救恩出於耶和華，不是出於約拿。\n讓耶穌作王，我不必自己爬上來。"],"self":"承認深處的真實：我不假裝自己沒有下去，也不逼自己快點爬出來；我承認自己下過山根，也承認把我帶上來的是神；我願意在最軟弱的地方，先說一句真話。","t321":{"k":"耶穌也下到地的深處，祂不是因為逃，而是為了我們；祂在死亡的門裡說「父啊！我將我的靈魂交在你手裡」，也在第三天被父神帶上來（拿2:6；太12:40；路23:46）。","g":"讓耶穌作王，就是承認救恩屬於耶和華：我不決定自己配不配被救，我也不決定別人配不配；救的權柄，全在祂（拿2:9）。","p":"屬神的體系，是一群在深處仍然把臉轉向聖殿的人；有人下去了，有人陪他禱告；每個人都記得：救恩出於耶和華，不是出於我們（拿2:4、7、9）。"},"grp":["【一、破冰】你有沒有過一個夜晚，想禱告卻不知道怎麼開口？那一刻，你最想對神說的是什麼？","【二、扎心】2:6 約拿說「我下到山根」。你生命裡，有沒有一個「最深的地方」？你當時怎樣向神說話？不必說細節。","【三、經文】2:7 約拿說：「我心在我裡面發昏的時候，我就想念耶和華。」你曾在什麼時候，只剩「想念」的力氣？那一刻發生了什麼？","【四、福音】耶穌說，人子也要在地裡三日三夜（太12:40）。祂為我們下到深處，這怎樣改變你對自己的「深處」的看法？","【五、行動】2:9 約拿說「我必用感謝的聲音獻祭」。這個星期，你要為哪一件事，用感謝的話向神、也向一個人說出口？是什麼、怎麼說、告訴誰？"],"prac":{"main":"在深處說一句真話，感謝，承認救恩出於耶和華","items":["對神：每天安靜三分鐘，說：主，我在這裡；祢已經聽見；救恩出於祢。","對自己：寫下你生命裡的一個「山根」，並寫下一件神曾經把你帶上來的事，哪怕很小。","對人：找一位你信得過的人，告訴他你的一個「深處」，請他陪你禱告一次，不必給答案。","對生活：這個星期，為一件你得到卻習以為常的事，寫下感謝，並對一個人說出口。","對使命：留意身邊正在「魚腹」裡的人，不急著教他，只說：我陪你，我們一起禱告。"]},"safe":["① 錯誤講法：把約拿的禱告講成「人要落到谷底，神才肯聽禱告」","正確理解：約拿在深處禱告，神聽見了；但經文沒有說人必須先落到絕境，神才聽。神隨時垂聽，包括平安的日子。","檢驗標準：會眾是更願意隨時來到神面前，還是覺得必須先受苦才有資格禱告？","② 錯誤講法：把 2:1–9 講成「約拿已經完全悔改」的證明，或反過來說「他的禱告是假的」","正確理解：這篇禱告是感謝詩，有感謝、有許願，也有信心的告白；其中沒有明說認罪。本講義不替約拿的內心下結論，只讀經文說了什麼（詳見議題）。","檢驗標準：會眾是更認真看自己的禱告，還是更熱衷於審判約拿的心？","③ 錯誤講法：用「三日三夜」推算任何日期或事件的時間表","正確理解：三日三夜是一段在黑暗中的時間；耶穌引用它，是指向自己的死與復活（太12:40）。本講義不算日子，不排時間表。","檢驗標準：會眾是更仰望復活的主，還是更熱衷於算數字？","④ 錯誤講法：把「陰間的深處」「地的門」，當作死後世界或地理位置的詳細說明","正確理解：這是詩歌語言，用「陰間」「山根」「門閂」描寫一個人幾乎被死亡吞沒的處境。我們不從這幾節建立一套死後世界的地圖。","檢驗標準：會眾是更看見神把人救出深處，還是更想知道深處的位置？","⑤ 錯誤講法：把 2:3「你將我投下深淵」講成「所有的苦難，都是神親手降下的懲罰」","正確理解：約拿在詩歌中看見神的手在水手之上；但經文沒有說每個人的苦難，都是神的懲罰。受害者尤其不應被告知「這是你的錯」。","檢驗標準：受苦的人聽了之後，是更知道神在，還是更覺得神恨他？","⑥ 錯誤講法：把 2:8「信奉虛無之神的人」，講成可以嘲笑、輕看別的宗教信徒的根據","正確理解：這句話是約拿向神的告白，說的是偶像的虛無，不是叫我們羞辱鄰舍。耶穌教我們愛人如己，連仇敵也要愛。","檢驗標準：會眾是更看見神的慈愛，還是更熱衷於貶低別人的信仰？","⑦ 錯誤講法：把 2:9「我所許的願，我必償還」，講成人可以隨便向神許願，或把許願當作和神交易的方法","正確理解：約拿的許願，出現在感謝的禱告中，是對神作為的回應；舊約也警告人不要輕率許願（傳5:4–5）。許願不能買到救恩。","檢驗標準：會眾是更認真看待自己的話，還是更習慣用許願跟神討價還價？","⑧ 錯誤講法：把「救恩出於耶和華」講成「人不需要回應，也不需要改變」","正確理解：救恩屬於神，是恩典；約拿的下一步，是「起來，去」。恩典不是放縱，是叫我們有力量起來。","檢驗標準：會眾是更被恩典感動而願意順服，還是更覺得不需要改變？","⑨ 錯誤講法：把約拿的禱告講成一套公式，好像照這個格式禱告，就一定馬上被救","正確理解：約拿被魚吐出，是神的吩咐，不是禱告格式的效果。有人禱告很久仍在等候，那不是他們禱告得不夠好。","檢驗標準：等候中的人，是更被安慰，還是更覺得自己禱告得不夠？","⑩ 錯誤講法：把 2:10 魚把約拿吐出來，講成「神厭棄約拿」或「事情已經圓滿結束」","正確理解：「吐」是神吩咐的動作；約拿得救了，卻還沒有起來去尼尼微。恩典不是終點，是下一步的開始。","檢驗標準：會眾是更知道自己被神接住，還是以為得救就等於完成使命？","⑪ 錯誤講法：對正在憂鬱、長期痛苦的人說：「你看約拿，禱告就出來了，你要有信心。」","正確理解：約拿的故事還沒完（第四章他再次說想死）；有人的「魚腹」很長，需要陪伴與專業的幫助。不對正在流淚的人說「你要有信心」。","檢驗標準：痛苦中的人聽了，是被陪伴，還是被催促？","⑫ 錯誤講法：把魚、陰間、三日三夜的每一個細節，都當成耶穌的「預言」或「預表」","正確理解：新約自己作過的連結是「約拿的神蹟」（太12:39–41）；其餘的細節，我們說「這使我們想起」，不說「這是預言」。","檢驗標準：會眾是更看見耶穌，還是更熱衷於找隱藏的密碼？"]},{"n":3,"t":"耶和華的話二次臨到","sub":"起・信・悔","lv":"A","arc":"行","sec":[["3:1--3","第二次的命令：約拿便照耶和華的話起來"],["3:4--4","一日的宣告：再等四十日"],["3:5--6","尼尼微人信服神：禁食、麻衣，王下了寶座"],["3:7--9","王與大臣的詔令：人要切切求告神"],["3:10--10","神察看他們的行為，就後悔"]],"serm":{"pts":[["第二次機會","3:1--4","耶和華的話二次臨到約拿"],["全城的回轉","3:5--8","尼尼微人信服神"],["或者……他就後悔","3:9--10","他就後悔，不把所說的災禍降與他們了"]]},"q":"你有沒有過這樣的經驗：搞砸了一件事之後，以為神不會再叫你做同樣的事？約拿書第三章，神的話第二次臨到一位逃過的先知；一位外邦的王，聽了五個詞，就從寶座上下來，坐在灰中。這一章要問：當神給我第二次機會，我要怎麼起來？","truth":"神的話第二次臨到約拿，要他去宣告神所吩咐的話；約拿這次起來，往尼尼微去，只說了「再等四十日，尼尼微必傾覆了」；尼尼微人信服神，從王到百姓，禁食披麻，離開惡道，丟棄強暴；神看見他們的行為，就後悔，不降所說的災禍。","mv":{"t":"耶和華的話二次臨到約拿","r":"拿3:1"},"card":["耶和華的話二次臨到約拿，說：起來，往尼尼微大城去，宣告我所吩咐你的話。約拿便照耶和華的話起來，往尼尼微去；他進城走了一日，宣告說：再等四十日，尼尼微必傾覆了。尼尼微人信服神，宣告禁食，從最大的到至小的，都穿麻衣。消息傳到王的耳中，他就下了寶座，脫下朝服，披上麻布，坐在灰中，又發令：人與牲畜都不可嘗什麼，都當披上麻布，人要切切求告神，各人回頭離開惡道，丟棄手中的強暴。他說：或者神轉意後悔，不發烈怒，使我們不致滅亡，也未可知。神察看他們的行為，見他們離開惡道，就後悔，不把所說的災禍降與他們了。","「二次」「起來」「誰知道」：神的話第二次臨到，約拿第二次「起來」，這次方向對了。尼尼微王也「起來」，離開寶座；全城切切「求告」（qara）；人「回頭」（shuv）離開「惡」（ra'ah），神也「後悔」（nacham）不降那「災」（ra'ah）；同一個字 ra'ah，連起人與神。「傾覆」（hafakh）可以是毀滅，也可以是翻轉。","耶穌說：「當審判的時候，尼尼微人要起來定這世代的罪，因為尼尼微人聽了約拿所傳的就悔改了。看哪，在這裡有一人比約拿更大」（太12:41）。約拿只說了五個詞，冷而無邀請；耶穌卻說：「凡勞苦擔重擔的人可以到我這裡來」（太11:28）。尼尼微人聽了五個詞就悔改，那位更大的，已經來了。","無己是承認：我沒有資格定誰配被憐憫。尼尼微人說「誰知道呢」，他們不拿自己的悔改去要求神，而把一切放在神的手裡。無己的人，悔改不是為了換取饒恕，是回到本位：我是被神憐憫的人，不是憐憫的決定者。","「或者神轉意後悔，不發烈怒，使我們不致滅亡，也未可知」","這個星期，找一件你曾經「搞砸」、以為神不會再用你的事，對神說：主，若祢再說一次，我願意起來；再找一件手中抓著不放的「強暴」（一句傷人的話、一筆不公平的帳），丟棄它。","最終整合：\n神的話第二次臨到，約拿起來了。\n五個詞的宣告，尼尼微人信服神；王離開寶座，坐在灰中。\n悔改落在手上：離開惡道，丟棄強暴。\n他們說「誰知道呢」，把一切交在神的憐憫之下。\n神看見他們的行為，就後悔，不降災。\n讓耶穌作王，我不決定誰配被憐憫。"],"self":"承認第二次的恩典：我不假裝自己從沒逃過，也不用過去的失敗，替神決定我不能再被使用；我承認悔改要落在手上，並願意先放下一件我抓著不放的事。","t321":{"k":"耶穌不是只說五個詞，祂流淚、擘餅、走十字架；祂為我們成為最大的邀請：「凡勞苦擔重擔的人可以到我這裡來」（拿3:4；太11:28；太12:41）。","g":"讓耶穌作王，就是讓祂的話第二次來時，我立刻起來；也讓祂決定誰得憐憫，我不替祂設限（拿3:2、9、10）。","p":"屬神的體系，是一群聽見神的話就「起來」的人：從最大到最小，一起謙卑、一起離開惡道、一起把「誰知道」交在神的手裡（拿3:5–9）。"},"grp":["【一、破冰】你有沒有過「第二次機會」的經驗：做錯一件事，後來有人又給你機會？那是怎樣的感覺？","【二、扎心】3:1–3 神的話二次臨到，約拿這次起來了。你生命裡，有沒有一件神「再說一次」的事？你的回應是什麼？不必說細節。","【三、經文】3:8 「丟棄手中的強暴」。你手中有沒有抓著不放的東西（一句話、一筆帳、一個怨）？你願意怎樣丟棄？","【四、福音】耶穌說，在這裡有一人比約拿更大（太12:41）。這怎樣改變你面對「第二次機會」的方式？","【五、行動】3:9 尼尼微人說「誰知道呢」。這個星期，你要把哪一件事，放在神的憐憫之下？是什麼、怎麼說、告訴誰？"],"prac":{"main":"第二次起來，丟棄手中的強暴，把一切放在神的憐憫下","items":["對神：每天三分鐘，說：主，若祢再說一次，我願意起來；我把「誰知道呢」交在祢手裡。","對自己：寫下一件你曾經逃過或搞砸的事，並寫下：神的話，現在對這件事說什麼？","對人：找一位你信得過的人，說出你手中抓著不放的一件事，請他陪你一個星期，看你有沒有丟棄。","對生活：這個星期，丟棄一件「手中的強暴」：一句傷人的話、一個不公平的做法、一次不肯放下的怨。","對使命：留意身邊「看起來不可能悔改」的人，不替神設限，為他禱告：或者神轉意，誰知道。"]},"safe":["① 錯誤講法：把「再等四十日」當作時間表，推算某個日期或事件","正確理解：四十日是神給的一段時間，也是約拿宣告的內容；本講義不用它推算任何日期，不排任何時間表。","檢驗標準：會眾是更看見神給人時間悔改，還是更熱衷於算日子？","② 錯誤講法：把尼尼微人的悔改，講成「所有人都已經得救」，或「他們的悔改保證永遠有效」","正確理解：經文記下的是這一次的悔改與神的憐憫；至於他們後來的歷史（參鴻3），經文沒有在第三章交代，我們不替經文下超出它的結論。","檢驗標準：會眾是更敬畏神的憐憫，還是更熱衷於替別人定案？","③ 錯誤講法：把「約拿只說了五個詞」講成傳福音只需要說一句話、不需要關係與愛","正確理解：約拿的講道冷而無邀請，這正是第四章要處理的問題；耶穌不是這樣，祂說：「到我這裡來」。","檢驗標準：會眾是更看見耶穌的邀請，還是以為福音只是一句警告？","④ 錯誤講法：把 3:6 尼尼微王的行為，講成「只要領袖悔改，全民就得救」，或用它要求政治人物","正確理解：本章的順序是百姓先信服，王後來聽見；經文沒有叫我們把悔改的責任推給領袖。","檢驗標準：會眾是更先看見自己，還是更熱衷於指責領袖？","⑤ 錯誤講法：把牲畜披麻布、禁食，講成一種儀式性的功德，可以換取神的憐憫","正確理解：禁食與麻衣是悔改的外在表現；神察看的是「他們的行為，見他們離開惡道」（3:10）。","檢驗標準：會眾是更認真轉回，還是更熱衷於外在的做法？","⑥ 錯誤講法：把 3:8「丟棄手中的強暴」講成只是個人心情的改變，不涉及公義與具體行為","正確理解：「強暴」是對人的暴力與不義；悔改要落在手中，落在對人的行為上。","檢驗標準：會眾是更願意改變自己對人的做法，還是只更覺得內疚？","⑦ 錯誤講法：把 3:9「誰知道呢」講成「神的憐憫不確定」，叫人不敢信靠","正確理解：這是尼尼微人的謙卑，不是神的不可靠；我們有耶穌，已經知道神的心意是憐憫。","檢驗標準：會眾是更謙卑，還是更不敢相信神的愛？","⑧ 錯誤講法：把 3:10 神「後悔」，講成神改變了本性，或神原來不知道結果","正確理解：聖經用人的語言描述神對人回轉的回應；神的本性與信實並沒有改變（民23:19；耶18:7–8）。這個難題，詳見全卷議題。","檢驗標準：會眾是更認識神的慈愛與信實，還是更陷入神學的爭辯？","⑨ 錯誤講法：用尼尼微的悔改，指責今日某個國家或族群「應該像尼尼微一樣悔改」","正確理解：本章寫的是一座古城因聽見神的話而回轉；我們不拿它比對今日任何國家或族群，也不替任何仇恨背書。","檢驗標準：會眾是更先問自己，還是更熱衷於點名別人？","⑩ 錯誤講法：把「第二次機會」講成「犯錯沒關係」，或叫人輕看第一次的後果","正確理解：約拿第一次逃跑，付了船價，也經歷了風浪與深水；第二次機會是恩典，不是對錯誤的輕忽。","檢驗標準：會眾是更珍惜恩典，還是更輕看順服？","⑪ 錯誤講法：把 3:10 講成「只要悔改，神就一定消除所有的後果」","正確理解：本章寫的是神收回所宣告的毀滅；悔改的人仍然可能面對現實的後果。我們不拿這一節給人保證。","檢驗標準：會眾是更仰望神的憐憫，還是更期待事情照自己的意思發展？","⑫ 錯誤講法：對曾犯過大錯、被教會放下的人說「神再給你第二次，你就要立刻回去服侍」","正確理解：神的第二次恩典，是不放棄人；但是人的恢復需要時間與陪伴，受傷的人不應被催促，也不應被迫回到傷害他的環境。","檢驗標準：被挽回的人，是更被愛，還是更被催促？"]},{"n":4,"t":"我豈能不愛惜呢","sub":"怒・蓖・問","lv":"A","arc":"問","sec":[["4:1--4","約拿大大不悅：我知道你是有恩典的神；神問：你這樣發怒合乎理嗎"],["4:5--5","出城坐在東邊：搭棚，要看那城如何"],["4:6--8","蓖麻、蟲子、東風：神三次安排"],["4:9--11","神的第二問與最後一問：我豈能不愛惜呢"]],"serm":{"pts":[["大大不悅","4:1--4","我知道你是有恩典、有憐憫的神"],["棚與蓖麻","4:5--8","耶和華神安排一棵蓖麻"],["最後的問句","4:9--11","我豈能不愛惜呢"]]},"q":"你有沒有過這樣的時刻：你很清楚自己是對的，講的道理一個字都沒錯，可是心裡就是不開心，甚至很生氣？約拿書第四章，是整卷書最誠實，也最沒有答案的一章。神沒有罵約拿，只問了他一個問題。這一章要問：當神的心和我的心站在不同的地方，我願意讓祂把我帶到祂的心旁邊嗎？","truth":"尼尼微得了憐憫，約拿卻大大不悅，禱告時說出他逃跑的真正原因：他知道神是有恩典、有憐憫的神；他求死，神只問：你這樣發怒合乎理嗎？神三次安排蓖麻、蟲子、東風，約拿為一棵蓖麻喜樂，也為它的枯槁發怒；神說：你尚且愛惜，何況尼尼微大城，我豈能不愛惜呢？書卷在這個問句中結束，沒有交代約拿的回答。","mv":{"t":"我豈能不愛惜呢","r":"拿4:11"},"card":["神不降災，約拿大大不悅，且甚發怒。他禱告說：我知道你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災，所以我急速逃往他施去。他求神取他的命，神只問：你這樣發怒合乎理嗎？約拿出城，坐在東邊搭棚，要看那城如何。耶和華神安排一棵蓖麻遮蔭，約拿大大喜樂；次日神安排蟲子咬死蓖麻，又安排炎熱的東風，約拿發昏，再次求死。神問：你因這棵蓖麻發怒合乎理嗎？他說：我發怒以至於死，都合乎理。神說：這蓖麻不是你栽種的，一夜發生一夜乾死，你尚且愛惜；何況尼尼微大城，其中有十二萬多不能分辨左手右手的人，並有許多牲畜，我豈能不愛惜呢？","「我豈能不愛惜呢」：「愛惜」（chus）是全卷最後一個動詞，只出現兩次：你尚且愛惜（4:10），我豈能不愛惜（4:11）。「安排」（manah）全卷四次，主詞都是神：大魚、蓖麻、蟲子、東風。「惡」（ra'ah）從尼尼微的惡，到神不降的災，落在約拿的「大惡」上（4:1），也在蓖麻「救他脫離苦楚」中（4:6）。「慈愛」（chesed）全卷兩次：2:8 與 4:2。","耶穌站在耶路撒冷城外，為那座城哭了（路19:41），說：「耶路撒冷啊，耶路撒冷啊……我多次願意聚集你的兒女」（太23:37）。約拿坐在城外，看；耶穌走進城裡，走向十字架。神問約拿的那個問題，耶穌用自己的生命，給了答案：我豈能不愛惜呢，所以祂為那些不認識祂的人，死了。","無己是承認：我不是憐憫的決定者。約拿的神學一字不差，他的心卻站在神的心外面；無己，是讓神的心，在我裡面長大，讓我放下「我是對的」，回到本位：愛惜誰，是神的權柄，不是我的。無己的人，不是沒有憤怒，而是把憤怒帶到神面前，讓祂問。","「我豈能不愛惜呢」","這個星期，找一件讓你「很有理由生氣」的事，安靜地讀四章四節，對神說：主，我生氣是這樣的理由，求祢問我；再為一個你不想為他禱告的人，禱告三十秒。","最終整合：\n尼尼微得了憐憫，約拿卻大大不悅。\n他禱告，說出他逃跑的真正原因：他知道神是有恩典的神。\n神沒有罵他，只問：你這樣發怒合乎理嗎？\n神三次安排，把他帶到「我捨不得」的地方。\n神說：你尚且愛惜，我豈能不愛惜呢？\n書卷結束在這個問句。讓耶穌作王，祂的心，比我的理由大。"],"self":"承認我的城外：我不假裝自己沒有不願意愛惜的人；我承認我的神學可以對，我的心卻可以站在神的心外面；我願意把我的怒氣帶到神面前，讓祂問我，也讓祂把我帶到祂的心旁邊。","t321":{"k":"耶穌站在城外為城哭泣，也走進城裡，走向十字架，為不認識祂的人死；約拿坐在城外看，耶穌進去愛（拿4:5、11；路19:41；太23:37）。","g":"讓耶穌作王，就是讓祂的心，比我的理由大；愛惜誰、憐憫誰，是祂的權柄，我不替祂設限（拿4:2、10、11）。","p":"屬神的體系，是一群被神問過、也願意被問的人；有人坐在城外，有人陪他靜下來，大家一起讓神的心，成為我們的心（拿4:4、9、11）。"},"grp":["【一、破冰】你有沒有過「我明明是對的，卻很不開心」的經驗？那是什麼事？當時你的心裡，是什麼滋味？","【二、扎心】4:2 約拿說：我知道你是有恩典的神，所以我逃。你生命裡，有沒有一個人，你不想讓神的恩典臨到他？不必說名字。","【三、經文】4:4 神問：你這樣發怒合乎理嗎？你曾經被誰「問」過類似的問題？你當時怎麼回答？","【四、福音】耶穌為耶路撒冷哭，又走向十字架（路19:41）。這怎樣改變你對「不配被愛惜的人」的看法？","【五、行動】4:11 神說：我豈能不愛惜呢？這個星期，你要為哪一個人或哪一處「尼尼微」，向神說一句：主，把祢的心給我？是什麼、怎麼說、告訴誰？"],"prac":{"main":"把怒氣帶到神面前，讓祂問；讓祂的心，成為我的心","items":["對神：每天三分鐘，說：主，我生氣的理由是這個；求祢問我，也求祢把祢的心給我。","對自己：寫下一個你「不想讓神愛惜」的人或處境，並寫下：我怕的是什麼？我捨不得的是什麼？","對人：找一位你信得過的人，說出你的怒氣，請他不急著勸你，只陪你一起安靜十分鐘。","對生活：這個星期，為一個你不喜歡的人，做一件小小的善事，不告訴他是你做的。","對使命：留意身邊「坐在城外」的人，不批評他，只說：我陪你，我們一起問神：祢的心是什麼。"]},"safe":["① 錯誤講法：把約拿講成反派、小人，用他來嘲笑一切心胸狹窄的人","正確理解：約拿是神的先知，也是神所愛惜、所追問的人；這卷書沒有給他結局，因為神的問題，也問我們。","檢驗標準：會眾是更看見自己的心，還是更熱衷於批評約拿？","② 錯誤講法：把 4:3、8 約拿求死，講成笑話、戲劇效果，或講成值得效法的屬靈表現","正確理解：求死是深重的痛苦。摩西、以利亞也求過死，神的回應是陪伴、飲食、休息與安靜的聲音。本講義不鼓勵任何人傷害自己；若有人心裡有「不如消失」的念頭，請陪伴他，並協助尋求專業的幫助。","檢驗標準：聽的人是更被陪伴，還是更覺得該被指責或該消失？","③ 錯誤講法：把 4:2 約拿的告白，講成「他的信仰不對」","正確理解：約拿的神學一字不差（出34:6–7）；問題是，他的心沒有站在神的心旁邊。我們不是要責備他，是要看見自己：知道與歡喜，是兩回事。","檢驗標準：會眾是更看見口與心的距離，還是只更熟練地背信仰告白？","④ 錯誤講法：把神的第一問「你這樣發怒合乎理嗎」，講成神在責備、定罪約拿","正確理解：這是一個問句，不是定罪；神在等約拿，說出他的怒氣。神的問，是慈愛的問。","檢驗標準：會眾是更願意被神問，還是更怕被神罵？","⑤ 錯誤講法：把蓖麻、蟲子、東風，講成神「用苦難折磨人」的方法","正確理解：蓖麻是來救他脫離苦楚的；三次安排，是為了把約拿帶到「我捨不得」的地方。經文沒有說，每一個損失都是神安排來教導人。","檢驗標準：失落的人聽了，是更知道神在，還是更覺得神在折磨他？","⑥ 錯誤講法：用 4:11「不能分辨左手右手的人」，推論尼尼微人都是無辜、或都是孩子，或推出某種「無知者不受審判」的教義","正確理解：這句話可以指幼童，也可以指不知道神的人；經文沒有展開。本講義不裁定，也不拿它建立超過經文的教義。","檢驗標準：會眾是更看見神對人的愛惜，還是更熱衷於推論？","⑦ 錯誤講法：把 4:11 的「許多牲畜」，講成經文沒有的意思，例如要求人必須為動物做什麼","正確理解：牲畜在這節，指出神的愛惜，及於一切被造之物；它沒有給我們一份關於動物的規條。","檢驗標準：會眾是更看見神的心寬廣，還是更陷入細節的爭辯？","⑧ 錯誤講法：替經文補上結局：說約拿後來悔改了、成了尼尼微的英雄，或說他不肯悔改","正確理解：經文沒有說。作者把這個問句，交到每一位讀者手上；我們不替約拿回答，也不替經文補結局。","檢驗標準：會眾是更面對那個問題，還是更急著知道故事的結局？","⑨ 錯誤講法：把「我豈能不愛惜呢」講成神放棄公義，不審判罪","正確理解：神的愛惜，不是放縱罪；那鴻書說明尼尼微後來的審判，神的憐憫與公義，並行不悖。","檢驗標準：會眾是更敬畏神的愛，還是更輕看罪？","⑩ 錯誤講法：用「我豈能不愛惜呢」，要求受害者立刻原諒傷害他的人，或叫他們面對加害者","正確理解：神的愛惜，是祂的心，不是對受傷者的命令。受害者不被逼著原諒、不被逼著和解；先被保護、被陪伴、被聽見，必要時尋求專業與法律上的協助。","檢驗標準：受傷的人聽了，是更感到被保護，還是更被催促？","⑪ 錯誤講法：把約拿的怒，講成所有「為公義發怒」的人都是錯的","正確理解：聖經裡有義怒；本章的問題，是約拿的怒，指向神的憐憫，而不是指向惡。我們可以問：我的怒，是為了誰？","檢驗標準：會眾是更能分辨自己的怒氣，還是更不敢為公義發聲？","⑫ 錯誤講法：用尼尼微或「十二萬人」，推論任何今日國家或族群的命運，或拿來指責某個群體","正確理解：本章寫的是神對一座古城的愛惜；本講義不把它等同今日任何國家或族群，也不為任何仇恨背書。","檢驗標準：會眾是更先問自己的心，還是更熱衷於點名別人？"]}],"txt":{"1":["耶和華的話臨到亞米太的兒子約拿，說：","「你起來往尼尼微大城去，向其中的居民呼喊，因為他們的惡達到我面前。」","約拿卻起來，逃往他施去躲避耶和華；下到約帕，遇見一隻船，要往他施去。他就給了船價，上了船，要與船上的人同往他施去躲避耶和華。","然而耶和華使海中起大風，海就狂風大作，甚至船幾乎破壞。","水手便懼怕，各人哀求自己的神。他們將船上的貨物拋在海中，為要使船輕些。約拿已下到底艙，躺臥沉睡。","船主到他那裡對他說：「你這沉睡的人哪，為何這樣呢？起來，求告你的神，或者神顧念我們，使我們不致滅亡。」","船上的人彼此說：「來吧，我們掣籤，看看這災臨到我們是因誰的緣故。」於是他們掣籤，掣出約拿來。","眾人對他說：「請你告訴我們，這災臨到我們是因誰的緣故？你以何事為業？你從哪裡來？你是哪一國？屬哪一族的人？」","他說：「我是希伯來人。我敬畏耶和華－那創造滄海旱地之天上的神。」","他們就大大懼怕，對他說：「你做的是甚麼事呢？」他們已經知道他躲避耶和華，因為他告訴了他們。","他們問他說：「我們當向你怎樣行，使海浪平靜呢？」這話是因海浪越發翻騰。","他對他們說：「你們將我抬起來，拋在海中，海就平靜了；我知道你們遭這大風是因我的緣故。」","然而那些人竭力盪槳，要把船攏岸，卻是不能，因為海浪越發向他們翻騰。","他們便求告耶和華說：「耶和華啊，我們懇求你，不要因這人的性命使我們死亡，不要使流無辜血的罪歸與我們；因為你－耶和華是隨自己的意旨行事。」","他們遂將約拿抬起，拋在海中，海的狂浪就平息了。","那些人便大大敬畏耶和華，向耶和華獻祭，並且許願。","耶和華安排一條大魚吞了約拿，他在魚腹中三日三夜。"],"2":["約拿在魚腹中禱告耶和華－他的神，","說：我遭遇患難求告耶和華，你就應允我；從陰間的深處呼求，你就俯聽我的聲音。","你將我投下深淵，就是海的深處；大水環繞我，你的波浪洪濤都漫過我身。","我說：我從你眼前雖被驅逐，我仍要仰望你的聖殿。","諸水環繞我，幾乎淹沒我；深淵圍住我；海草纏繞我的頭。","我下到山根，地的門將我永遠關住。耶和華－我的神啊，你卻將我的性命從坑中救出來。","我心在我裡面發昏的時候，我就想念耶和華。我的禱告進入你的聖殿，達到你的面前。","那信奉虛無之神的人，離棄憐愛他們的主；","但我必用感謝的聲音獻祭與你。我所許的願，我必償還。救恩出於耶和華。","耶和華吩咐魚，魚就把約拿吐在旱地上。"],"3":["耶和華的話二次臨到約拿說：","「你起來！往尼尼微大城去，向其中的居民宣告我所吩咐你的話。」","約拿便照耶和華的話起來，往尼尼微去。這尼尼微是極大的城，有三日的路程。","約拿進城走了一日，宣告說：「再等四十日，尼尼微必傾覆了！」","尼尼微人信服神，便宣告禁食，從最大的到至小的都穿麻衣。","這信息傳到尼尼微王的耳中，他就下了寶座，脫下朝服，披上麻布，坐在灰中。","他又使人遍告尼尼微通城，說：「王和大臣有令，人不可嘗甚麼，牲畜、牛羊不可吃草，也不可喝水。","人與牲畜都當披上麻布；人要切切求告神。各人回頭離開所行的惡道，丟棄手中的強暴。","或者神轉意後悔，不發烈怒，使我們不致滅亡，也未可知。」","於是神察看他們的行為，見他們離開惡道，他就後悔，不把所說的災禍降與他們了。"],"4":["這事約拿大大不悅，且甚發怒，","就禱告耶和華說：「耶和華啊，我在本國的時候豈不是這樣說嗎？我知道你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災，所以我急速逃往他施去。","耶和華啊，現在求你取我的命吧！因為我死了比活著還好。」","耶和華說：「你這樣發怒合乎理嗎？」","於是約拿出城，坐在城的東邊，在那裡為自己搭了一座棚，坐在棚的蔭下，要看看那城究竟如何。","耶和華神安排一棵蓖麻，使其發生高過約拿，影兒遮蓋他的頭，救他脫離苦楚；約拿因這棵蓖麻大大喜樂。","次日黎明，神卻安排一條蟲子咬這蓖麻，以致枯槁。","日頭出來的時候，神安排炎熱的東風，日頭曝曬約拿的頭，使他發昏，他就為自己求死，說：「我死了比活著還好！」","神對約拿說：「你因這棵蓖麻發怒合乎理嗎？」他說：「我發怒以至於死，都合乎理！」","耶和華說：「這蓖麻不是你栽種的，也不是你培養的；一夜發生，一夜乾死，你尚且愛惜；","何況這尼尼微大城，其中不能分辨左手右手的有十二萬多人，並有許多牲畜，我豈能不愛惜呢？」"]},"blk":{"1":[{"a":1,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַֽיְהִי דְּבַר יְהוָה אֶל יוֹנָה בֶן אֲמִתַּי לֵאמֹֽר׃ קוּם לֵךְ אֶל נִֽינְוֵה הָעִיר הַגְּדוֹלָה וּקְרָא עָלֶיהָ כִּֽי עָלְתָה רָעָתָם לְפָנָֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華的話臨到亞米太的兒子約拿，說：你起來往尼尼微大城去，向其中的居民呼喊，因為他們的惡達到我面前。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>耶和華的話<\/td><td>דְּבַר<\/td><td>devar<\/td><td>H1697<\/td><td>話、言語、事件<\/td><\/tr><tr><td>亞米太<\/td><td>אֲמִתַּי<\/td><td>amittai<\/td><td>H573<\/td><td>我的真實／信實（人名）<\/td><\/tr><tr><td>約拿<\/td><td>יוֹנָה<\/td><td>yonah<\/td><td>H3124<\/td><td>鴿子（人名）<\/td><\/tr><tr><td>起來<\/td><td>קוּם<\/td><td>qum<\/td><td>H6965<\/td><td>起來、起身<\/td><\/tr><tr><td>大城<\/td><td>הָעִיר<\/td><td>ir<\/td><td>H5892<\/td><td>城<\/td><\/tr><tr><td>呼喊<\/td><td>וּקְרָא<\/td><td>qara<\/td><td>H7121<\/td><td>呼喊、宣告、求告<\/td><\/tr><tr><td>惡<\/td><td>רָעָתָם<\/td><td>ra'ah<\/td><td>H7451<\/td><td>惡、災、禍<\/td><\/tr><tr><td>上達<\/td><td>עָלְתָה<\/td><td>alah<\/td><td>H5927<\/td><td>上去、上達<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>耶和華的話臨到<\/strong>：原文 vayehi devar-YHWH，是先知書常見的開頭格式，說的是「話」自己來到人身上，不是人去取得一個異象。這裡的「話」（davar）也有「事件」之意：神的話一臨到，就發生了一件事。<\/p><p><strong>亞米太<\/strong>：這個名字的字根 emet，常被解作「真實、信實」；<strong>約拿<\/strong>意為「鴿子」。王下14:25 記著，約拿是迦特希弗人，在以色列王耶羅波安二世的時代說過預言，所以他不是一個虛構的名字，而是一位已經被神使用過、也被以色列人認識的先知。<\/p><p><strong>惡達到我面前<\/strong>：原文 alah ra'atam lefanay，字面是「他們的惡<strong>上來<\/strong>到我面前」。「上」（alah）與下一節要出現的「下」（yarad）形成方向的對比：惡一路向上，達到神面前；約拿接下來卻一路向下。<\/p><p><strong>呼喊<\/strong>：qara 是全卷追蹤字（8 次）。神派他去的方式，是「向其中的居民<strong>呼喊<\/strong>」，這是先知本來的事工。<\/p>","exp":"<p>這卷書沒有先交代約拿是個怎樣的人，也沒有交代尼尼微有多少人。它只用一句話開始：<strong>耶和華的話臨到亞米太的兒子約拿。<\/strong> 神先開口，人在後面。<\/p><p>接著是三個動作：<strong>起來、去、呼喊。<\/strong> 第一個「起來」（qum）在全卷出現六次，是追蹤字之一；神用它叫人動身，第二次也用它（3:2）。神把約拿差往的地方，是<strong>尼尼微大城<\/strong>。經文只用一個形容詞介紹它：<strong>大<\/strong>。這個「大」（gadol）會一直走到全卷最後一節（4:11），是神的眼睛看這座城的字。<\/p><p>差遣的理由是：<strong>因為他們的惡達到我面前。<\/strong> 神不是在遠處發怒，是這座城的惡已經「上來」了，上到神的面前。尼尼微是亞述帝國的重要大城，後來先知那鴻稱它為「流人血的城」（鴻3:1）。<strong>我們不把尼尼微等同今日任何一個國家或族群<\/strong>；經文要我們看見的，是神對一座城的暴力有感覺，也對一座城有計畫。<\/p><p>還有一個不容易看見的細節：神差遣的方式，是<strong>叫約拿去呼喊<\/strong>，不是叫他去審判，也不是叫他去毀滅。呼喊是給人聽見的機會。這一點，要到第四章，約拿自己才說出口。<\/p>"},{"a":3,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיָּקָם יוֹנָה לִבְרֹחַ תַּרְשִׁישָׁה מִלִּפְנֵי יְהוָה וַיֵּרֶד יָפוֹ וַיִּמְצָא אָנִיָּה בָּאָה תַרְשִׁישׁ וַיִּתֵּן שְׂכָרָהּ וַיֵּרֶד בָּהּ לָבוֹא עִמָּהֶם תַּרְשִׁישָׁה מִלִּפְנֵי יְהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「約拿卻起來，逃往他施去躲避耶和華；下到約帕，遇見一隻船，要往他施去。他就給了船價，上了船，要與船上的人同往他施去躲避耶和華。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>起來<\/td><td>וַיָּקָם<\/td><td>qum<\/td><td>H6965<\/td><td>起來<\/td><\/tr><tr><td>逃<\/td><td>לִבְרֹחַ<\/td><td>barach<\/td><td>H1272<\/td><td>逃跑<\/td><\/tr><tr><td>他施<\/td><td>תַּרְשִׁישָׁה<\/td><td>tarshish<\/td><td>H8659<\/td><td>他施（地名）<\/td><\/tr><tr><td>面前<\/td><td>מִלִּפְנֵי<\/td><td>panim<\/td><td>H6440<\/td><td>面、面前<\/td><\/tr><tr><td>下到<\/td><td>וַיֵּרֶד<\/td><td>yarad<\/td><td>H3381<\/td><td>下去<\/td><\/tr><tr><td>約帕<\/td><td>יָפוֹ<\/td><td>yafo<\/td><td>H3305<\/td><td>約帕（港口）<\/td><\/tr><tr><td>船價<\/td><td>שְׂכָרָהּ<\/td><td>secharah<\/td><td>H7939<\/td><td>工價、船資<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>起來<\/strong>：約拿用的動詞，和神在 1:2 命令他的動詞，是同一個字 qum。神說「起來，去」，約拿真的起來了，卻朝另一個方向。<\/p><p><strong>躲避耶和華<\/strong>：原文是 milifnei YHWH，字面是「離開耶和華的面前」。這一句在 1:3 出現兩次（一頭一尾），在 1:10 再出現一次；加上 1:2 的「我面前」，<strong>「面前」這個字在本章出現四次<\/strong>。<\/p><p><strong>下到<\/strong>：yarad。一節裡，約拿「下到約帕」、「上了船」（原文第二個 yarad，意思是「下到船裡」）；一共三個動詞：起來、下去、下去。和合本把第二個「下去」譯成「上了船」，是順著中文的語氣；原文的方向仍是「下」。<\/p><p><strong>他施<\/strong>：多數學者認為在地中海極西之處（見賽66:19；詩72:10），確切位置並不確定；本講義只取經文的意思：那是離尼尼微最遠的方向。<\/p>","exp":"<p>全卷第一個「起來」是神的命令；第二個「起來」就是約拿的動作。<strong>同一個動詞，方向相反。<\/strong> 約拿沒有說「我不去」，他是<strong>真的起來了<\/strong>，只是起來，是為了逃。<\/p><p>這一節的語氣很冷靜，像是在記一件小事：下到約帕、遇見一隻船、給了船價、上了船。沒有爭吵，沒有哭喊。<strong>逃，不一定是狂奔；有時只是買一張船票。<\/strong> 他甚至付了錢，逃跑是要花錢的。<\/p><p>兩次「躲避耶和華」，一頭一尾夾住整節：開始和結束，都是「離開耶和華的面前」。我們在這裡先不替約拿猜動機；4:2 他自己會說。我們只看見：他認得這位神，所以他知道神的面前在哪裡，也知道要往哪裡躲。<\/p><p>還有一個方向值得記住：從這一節開始，約拿一路向<strong>下<\/strong>。下到約帕，下到船裡（1:3），下到底艙（1:5），最後下到山根（2:6）。<strong>離開本位的路，總是往下走。<\/strong><\/p>"},{"a":4,"z":6,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַֽיהוָה הֵטִיל רֽוּחַ גְּדוֹלָה אֶל הַיָּם וַיְהִי סַֽעַר גָּדוֹל בַּיָּם וְהָאֳנִיָּה חִשְּׁבָה לְהִשָּׁבֵֽר׃ וַיִּֽירְאוּ הַמַּלָּחִים וַֽיִּזְעֲקוּ אִישׁ אֶל אֱלֹהָיו וַיָּטִלוּ אֶת הַכֵּלִים אֲשֶׁר בָּֽאֳנִיָּה אֶל הַיָּם לְהָקֵל מֵֽעֲלֵיהֶם וְיוֹנָה יָרַד אֶל יַרְכְּתֵי הַסְּפִינָה וַיִּשְׁכַּב וַיֵּרָדַֽם׃ וַיִּקְרַב אֵלָיו רַב הַחֹבֵל וַיֹּאמֶר לוֹ מַה לְּךָ נִרְדָּם קוּם קְרָא אֶל אֱלֹהֶיךָ אוּלַי יִתְעַשֵּׁת הָאֱלֹהִים לָנוּ וְלֹא נֹאבֵֽד׃<\/p><\/blockquote>","lit":"<blockquote><p>「然而耶和華使海中起大風，海就狂風大作，甚至船幾乎破壞。水手便懼怕，各人哀求自己的神。他們將船上的貨物拋在海中，為要使船輕些。約拿已下到底艙，躺臥沉睡。船主到他那裡對他說：你這沉睡的人哪，為何這樣呢？起來，求告你的神，或者神顧念我們，使我們不致滅亡。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>耶和華使……起（擲）<\/td><td>הֵטִיל<\/td><td>hetil<\/td><td>H2904<\/td><td>投擲、拋<\/td><\/tr><tr><td>大風<\/td><td>רֽוּחַ<\/td><td>ruach<\/td><td>H7307<\/td><td>風、靈、氣<\/td><\/tr><tr><td>暴風<\/td><td>סַֽעַר<\/td><td>sa'ar<\/td><td>H5591<\/td><td>暴風<\/td><\/tr><tr><td>想（幾乎）破壞<\/td><td>חִשְּׁבָה<\/td><td>chashav<\/td><td>H2803<\/td><td>想、盤算<\/td><\/tr><tr><td>懼怕<\/td><td>וַיִּֽירְאוּ<\/td><td>yare<\/td><td>H3372<\/td><td>懼怕、敬畏<\/td><\/tr><tr><td>哀求<\/td><td>וַֽיִּזְעֲקוּ<\/td><td>za'aq<\/td><td>H2199<\/td><td>哀求、呼喊<\/td><\/tr><tr><td>沉睡<\/td><td>וַיֵּרָדַֽם<\/td><td>radam<\/td><td>H7290<\/td><td>沉睡<\/td><\/tr><tr><td>底艙<\/td><td>יַרְכְּתֵי<\/td><td>yarkah<\/td><td>H3411<\/td><td>深處、後方<\/td><\/tr><tr><td>船主<\/td><td>הַחֹבֵל<\/td><td>chovel<\/td><td>H2259<\/td><td>舵手、船主<\/td><\/tr><tr><td>滅亡<\/td><td>נֹאבֵֽד<\/td><td>avad<\/td><td>H6<\/td><td>滅亡、失喪<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>使起大風<\/strong>：原文 hetil ruach gedolah，hetil 的意思是「擲出、拋出」，神<strong>擲<\/strong>出一陣大風。這個動詞在本章出現四次：神擲風（1:4）、水手擲貨物（1:5）、約拿說「把我拋下」（1:12）、他們就把約拿拋下（1:15）。<\/p><p><strong>船幾乎破壞<\/strong>：原文是「船<strong>想<\/strong>要破碎」（chishvah lehishaver），用人的動詞「想」（chashav）來講一隻船，是文學的寫法，描寫風浪之大，連船都像是在盤算要散掉。<\/p><p><strong>沉睡<\/strong>：原文用 radam，是深沉的睡，不是午休。<strong>底艙<\/strong>（yarketei hasefinah）是船的最深處、最後面。約拿「下到」那裡，躺下，不再醒著。<\/p><p><strong>船主<\/strong>：原文 rav hachovel，「舵手之長」。<strong>滅亡<\/strong>（avad）是這一章的另一個關鍵字：船主說「使我們不致滅亡」，尼尼微的故事裡，王也會用同樣的字（3:9）。<\/p>","exp":"<p><strong>風是神擲出來的。<\/strong> 經文不是說風浪碰巧來了，是說耶和華擲出大風。可是神的目標，從來不是水手。風暴是在追約拿，卻讓一船不認識神的人先害怕起來。<\/p><p>水手的反應，是每個人都<strong>哀求自己的神<\/strong>，又把貨物拋進海裡，想使船輕一點。他們盡了一切力氣，也沒有人只站在旁邊看。<strong>這一船人醒著、忙著、懼怕著；唯一的先知，躺在底艙睡著。<\/strong> 這個對比不需要我們多說。<\/p><p>然後是全卷第一個有趣的反轉：<strong>船主叫醒約拿。<\/strong> 他說：你這沉睡的人哪，為何這樣呢？<strong>起來，求告你的神<\/strong>，或者神顧念我們。這幾乎是 1:2 的翻版：「起來，呼喊」，卻從一位外邦的船主嘴裡說出來。先知本來該是對別人說這句話的人。<\/p><p>我們在這裡不嘲笑約拿，也不用「他在睡覺」去責備疲倦的人。這一節只是平平地說：<strong>當一個人離開了神的差遣，連他最該警醒的時候，也可能睡著。<\/strong> 那份沉睡，不是懶惰，是逃跑的人最後找到的一個地方。<\/p>"},{"a":7,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמְרוּ אִישׁ אֶל רֵעֵהוּ לְכוּ וְנַפִּילָה גֽוֹרָלוֹת וְנֵדְעָה בְּשֶׁלְּמִי הָרָעָה הַזֹּאת לָנוּ וַיַּפִּלוּ גּֽוֹרָלוֹת וַיִּפֹּל הַגּוֹרָל עַל יוֹנָֽה׃ וַיֹּאמְרוּ אֵלָיו הַגִּידָה נָּא לָנוּ בַּאֲשֶׁר לְמִי הָרָעָה הַזֹּאת לָנוּ מַה מְּלַאכְתְּךָ וּמֵאַיִן תָּבוֹא מָה אַרְצֶךָ וְאֵֽי מִזֶּה עַם אָֽתָּה׃ וַיֹּאמֶר אֲלֵיהֶם עִבְרִי אָנֹכִי וְאֶת יְהוָה אֱלֹהֵי הַשָּׁמַיִם אֲנִי יָרֵא אֲשֶׁר עָשָׂה אֶת הַיָּם וְאֶת הַיַּבָּשָֽׁה׃ וַיִּֽירְאוּ הָֽאֲנָשִׁים יִרְאָה גְדוֹלָה וַיֹּאמְרוּ אֵלָיו מַה זֹּאת עָשִׂיתָ כִּֽי יָדְעוּ הָאֲנָשִׁים כִּֽי מִלִּפְנֵי יְהוָה הוּא בֹרֵחַ כִּי הִגִּיד לָהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「船上的人彼此說：來吧，我們掣籤，看看這災臨到我們是因誰的緣故。於是他們掣籤，掣出約拿來。眾人對他說：請你告訴我們，這災臨到我們是因誰的緣故？你以何事為業？你從哪裡來？你是哪一國？屬哪一族的人？他說：我是希伯來人。我敬畏耶和華－那創造滄海旱地之天上的神。他們就大大懼怕，對他說：你做的是甚麼事呢？他們已經知道他躲避耶和華，因為他告訴了他們。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>掣籤<\/td><td>גֽוֹרָלוֹת<\/td><td>goral<\/td><td>H1486<\/td><td>籤<\/td><\/tr><tr><td>因誰的緣故<\/td><td>בְּשֶׁלְּמִי<\/td><td>beshelmi<\/td><td>H4310<\/td><td>因著誰（的緣故）<\/td><\/tr><tr><td>希伯來人<\/td><td>עִבְרִי<\/td><td>ivri<\/td><td>H5680<\/td><td>希伯來人<\/td><\/tr><tr><td>敬畏<\/td><td>יָרֵא<\/td><td>yare<\/td><td>H3373<\/td><td>敬畏的<\/td><\/tr><tr><td>天上的神<\/td><td>הַשָּׁמַיִם<\/td><td>shamayim<\/td><td>H8064<\/td><td>天、諸天<\/td><\/tr><tr><td>造<\/td><td>עָשָׂה<\/td><td>asah<\/td><td>H6213<\/td><td>造、做<\/td><\/tr><tr><td>滄海<\/td><td>הַיָּם<\/td><td>yam<\/td><td>H3220<\/td><td>海<\/td><\/tr><tr><td>旱地<\/td><td>הַיַּבָּשָֽׁה<\/td><td>yabashah<\/td><td>H3004<\/td><td>乾地<\/td><\/tr><tr><td>大懼怕<\/td><td>וַיִּֽירְאוּ<\/td><td>yare<\/td><td>H3372<\/td><td>懼怕<\/td><\/tr><tr><td>做的是什麼事<\/td><td>עָשִׂיתָ<\/td><td>asah<\/td><td>H6213<\/td><td>做<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>因誰的緣故<\/strong>：原文 beshelmi，在 1:7、1:8 出現，下一次在 1:12，約拿說「是因我的緣故」（beshelli）。水手問「因誰」，約拿最後回答「因我」，兩個詞只差一個字母。<\/p><p><strong>掣籤<\/strong>：goral。這是外邦水手的做法；舊約也有以色列人用籤的例子（如書7；撒上14），但這一章沒有叫教會用抽籤去決定神的旨意；經文只說：<strong>籤落在約拿身上<\/strong>。<\/p><p><strong>我敬畏耶和華<\/strong>：原文是 yare anokhi，yare 這裡是形容詞「敬畏的」，與 1:10 水手的動詞「就大大懼怕」（vayire'u yirah gedolah）是同一個字根，一個說「我敬畏」，一個說「他們懼怕」。<\/p><p><strong>滄海旱地<\/strong>：約拿說他敬畏的是<strong>造了海和旱地的神<\/strong>（asah et-hayam ve'et-hayabashah）。他在逃往海中，說出一位連海都是祂所造的神。<\/p>","exp":"<p>籤落在約拿身上以後，水手問了他一連串的問題：這災是因誰的緣故？你以何事為業？你從哪裡來？你是哪一國？屬哪一族？<strong>他沒有照順序一一回答。<\/strong> 他說的是：<strong>我是希伯來人。我敬畏耶和華，那創造滄海旱地之天上的神。<\/strong><\/p><p>這是約拿全卷最正確的一句信仰告白，也是一句<strong>不能自己活出來的告白<\/strong>。他知道神是天上的神，是造海的神；他卻逃往海上。他知道逃不出神手，卻還是逃。<strong>知道，和住在知道裡面，是兩回事。<\/strong><\/p><p>水手聽了，就<strong>大大懼怕<\/strong>，說：你做的是甚麼事呢？這句話是質問，也是驚嘆：既然你說你敬畏這位創造海的神，為甚麼你要往海上逃？1:10 的後半句交代：他們已經知道他躲避耶和華，因為他告訴了他們。<\/p><p>這一段沒有人罵約拿。經文只記下兩樣東西：一個人的告白，與一群人的反應。<strong>一個背對神的人，嘴裡仍然可以說出最真的話。<\/strong> 這既是約拿的難處，也是我們的。<\/p>"},{"a":11,"z":16,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמְרוּ אֵלָיו מַה נַּעֲשֶׂה לָּךְ וְיִשְׁתֹּק הַיָּם מֵֽעָלֵינוּ כִּי הַיָּם הוֹלֵךְ וְסֹעֵֽר׃ וַיֹּאמֶר אֲלֵיהֶם שָׂאוּנִי וַהֲטִילֻנִי אֶל הַיָּם וְיִשְׁתֹּק הַיָּם מֵֽעֲלֵיכֶם כִּי יוֹדֵעַ אָנִי כִּי בְשֶׁלִּי הַסַּעַר הַגָּדוֹל הַזֶּה עֲלֵיכֶֽם׃ וַיַּחְתְּרוּ הָאֲנָשִׁים לְהָשִׁיב אֶל הַיַּבָּשָׁה וְלֹא יָכֹלוּ כִּי הַיָּם הוֹלֵךְ וְסֹעֵר עֲלֵיהֶֽם׃ וַיִּקְרְאוּ אֶל יְהוָה וַיֹּאמְרוּ אָנָּה יְהוָה אַל נָא נֹאבְדָה בְּנֶפֶשׁ הָאִישׁ הַזֶּה וְאַל תִּתֵּן עָלֵינוּ דָּם נָקִיא כִּֽי אַתָּה יְהוָה כַּאֲשֶׁר חָפַצְתָּ עָשִֽׂיתָ׃ וַיִּשְׂאוּ אֶת יוֹנָה וַיְטִלֻהוּ אֶל הַיָּם וַיַּעֲמֹד הַיָּם מִזַּעְפּֽוֹ׃ וַיִּֽירְאוּ הָאֲנָשִׁים יִרְאָה גְדוֹלָה אֶת יְהוָה וַיִּֽזְבְּחוּ זֶבַח לַֽיהוָה וַֽיִּדְּרוּ נְדָרִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「他們問他說：我們當向你怎樣行，使海浪平靜呢？這話是因海浪越發翻騰。他對他們說：你們將我抬起來，拋在海中，海就平靜了；我知道你們遭這大風是因我的緣故。然而那些人竭力盪槳，要把船攏岸，卻是不能，因為海浪越發向他們翻騰。他們便求告耶和華說：耶和華啊，我們懇求你，不要因這人的性命使我們死亡，不要使流無辜血的罪歸與我們；因為你－耶和華是隨自己的意旨行事。他們遂將約拿抬起，拋在海中，海的狂浪就平息了。那些人便大大敬畏耶和華，向耶和華獻祭，並且許願。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>平靜<\/td><td>וְיִשְׁתֹּק<\/td><td>shatak<\/td><td>H8367<\/td><td>平靜、安靜<\/td><\/tr><tr><td>抬起<\/td><td>שָׂאוּנִי<\/td><td>nasa<\/td><td>H5375<\/td><td>舉起、抬起<\/td><\/tr><tr><td>拋（擲）<\/td><td>וַהֲטִילֻנִי<\/td><td>hetil<\/td><td>H2904<\/td><td>拋、擲<\/td><\/tr><tr><td>盪槳<\/td><td>וַיַּחְתְּרוּ<\/td><td>chatar<\/td><td>H2864<\/td><td>挖、努力划<\/td><\/tr><tr><td>求告<\/td><td>וַיִּקְרְאוּ<\/td><td>qara<\/td><td>H7121<\/td><td>呼求<\/td><\/tr><tr><td>性命<\/td><td>בְּנֶפֶשׁ<\/td><td>nefesh<\/td><td>H5315<\/td><td>性命、魂<\/td><\/tr><tr><td>無辜血<\/td><td>נָקִיא<\/td><td>naqi<\/td><td>H5355<\/td><td>無辜的<\/td><\/tr><tr><td>意旨<\/td><td>חָפַצְתָּ<\/td><td>chafatz<\/td><td>H2654<\/td><td>喜悅、旨意<\/td><\/tr><tr><td>平息<\/td><td>וַיַּעֲמֹד<\/td><td>amad<\/td><td>H5975<\/td><td>站住、止住<\/td><\/tr><tr><td>敬畏<\/td><td>וַיִּֽירְאוּ<\/td><td>yare<\/td><td>H3372<\/td><td>懼怕、敬畏<\/td><\/tr><tr><td>獻祭<\/td><td>זֶבַח<\/td><td>zevach<\/td><td>H2077<\/td><td>祭<\/td><\/tr><tr><td>許願<\/td><td>נְדָרִֽים<\/td><td>neder<\/td><td>H5088<\/td><td>願<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我知道<\/strong>：1:12 約拿說 yodea ani，「我知道你們遭這大風是因我的緣故」。全卷第一次，約拿說出一句<strong>誠實的話<\/strong>，而且是對一群外邦人說的。<\/p><p><strong>把我抬起來拋在海中<\/strong>：原文 su'uni vahatilunni 兩個動詞：抬起、拋擲，第二個動詞 hetil，就是 1:4 神擲風的那個字。<\/p><p><strong>盪槳<\/strong>：原文 vayachteru，字面是「他們挖」，描寫用力划槳像挖地一樣；他們想<strong>把船攏岸<\/strong>（原文 lehashiv，「使它回去」，shuv 是追蹤字），卻是不能。<\/p><p><strong>意旨<\/strong>：原文 chafatzta，「你所喜悅的」。水手說：因為你──耶和華，是隨自己的意旨行事。這是一個外邦人說的神學。<\/p><p><strong>敬畏<\/strong>：1:16 的動詞加上同源名詞：vayire'u... yirah gedolah，「他們大大地敬畏」；這是從 1:10 的「大懼怕」轉出來的，同一個字根，從懼怕轉成敬畏。<\/p>","exp":"<p>約拿說：把我拋下去，海就平靜了。他沒有求神，也沒有說「我悔改」，他只說：<strong>這場風暴是因我。<\/strong> 這是整章裡最短、也最真實的一句。<\/p><p>水手沒有立刻照做。他們<strong>竭力盪槳<\/strong>，想把船攏岸，不要把人拋下去。這一船外邦人，比先知更不願意讓一個人死。直到實在不能，他們才<strong>求告耶和華<\/strong>，而且是第一次用祂的名字：「耶和華啊，我們懇求你，不要因這人的性命使我們死亡，不要使流無辜血的罪歸與我們。」<strong>他們怕的，是罪，不是風。<\/strong><\/p><p>然後他們把約拿拋下，海的狂浪就平息了。經文記了他們的反應：<strong>那些人便大大敬畏耶和華，向耶和華獻祭，並且許願。<\/strong> 經文只記到這裡；我們不替他們下結論，說他們已經得救或沒有得救。我們只看見：<strong>在一個逃跑的先知身邊，一群本來求自己的神的人，認識了耶和華的名。<\/strong><\/p><p>這是神的方法：祂用風暴追約拿，也用風暴帶來一船的人。約拿不知道的是，這船上的敬畏，已經是這卷書的第一個伏筆：後面，尼尼微也會有這樣的敬畏。<\/p>"},{"a":17,"z":17,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיְמַן יְהוָה דָּג גָּדוֹל לִבְלֹעַ אֶת יוֹנָה וַיְהִי יוֹנָה בִּמְעֵי הַדָּג שְׁלֹשָׁה יָמִים וּשְׁלֹשָׁה לֵילֽוֹת׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華安排一條大魚吞了約拿，他在魚腹中三日三夜。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>安排<\/td><td>וַיְמַן<\/td><td>manah<\/td><td>H4487<\/td><td>安排、指派<\/td><\/tr><tr><td>大魚<\/td><td>דָּג<\/td><td>dag<\/td><td>H1709<\/td><td>魚<\/td><\/tr><tr><td>大<\/td><td>גָּדוֹל<\/td><td>gadol<\/td><td>H1419<\/td><td>大<\/td><\/tr><tr><td>吞<\/td><td>לִבְלֹעַ<\/td><td>bala<\/td><td>H1104<\/td><td>吞<\/td><\/tr><tr><td>腹（腸）<\/td><td>בִּמְעֵי<\/td><td>me'ah<\/td><td>H4578<\/td><td>腹、內臟<\/td><\/tr><tr><td>三<\/td><td>שְׁלֹשָׁה<\/td><td>shalosh<\/td><td>H7969<\/td><td>三<\/td><\/tr><tr><td>日<\/td><td>יָמִים<\/td><td>yom<\/td><td>H3117<\/td><td>日<\/td><\/tr><tr><td>夜<\/td><td>לֵילֽוֹת<\/td><td>laylah<\/td><td>H3915<\/td><td>夜<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>安排<\/strong>：原文 vayman，動詞 manah，意思是「指派、安排、預備」。這個字全卷四次：1:17 安排魚；4:6 安排蓖麻；4:7 安排蟲子；4:8 安排東風。主詞都是神。<\/p><p><strong>大魚<\/strong>：原文 dag gadol，字面是「大的魚」，沒有指明是哪一種。太12:40 用的希臘字 kêtos，意思是「海中的大生物」。本講義不推測魚的種類，也不引用任何「某人被吞後生還」的傳聞，只讀經文自己說的：<strong>耶和華安排<\/strong>。<\/p><p><strong>魚腹<\/strong>：原文 me'ei hadag，「魚的內部」，腸腹之意。<\/p><p><strong>三日三夜<\/strong>：原文 sheloshah yamim ushelosha leilot。三日三夜在聖經裡也出現在撒上30:12；斯4:16，是一個指向「一段時間」的說法。本講義不拿這個數字去算日子（見太12:40 的議題）。<\/p>","exp":"<p>這一章最後一句，只有一句話，卻是整章的轉彎：<strong>耶和華安排一條大魚吞了約拿。<\/strong><\/p><p>我們先不要看那條魚有多大。<strong>要看的是動詞：安排。<\/strong> 神把這個動詞用在魚身上，後來又用在蓖麻、蟲子、東風身上（4:6–8）。<strong>神在這卷書裡不斷地「安排」：祂安排救人的魚，也安排使蓖麻枯槁的蟲。<\/strong> 約拿以為自己在逃，其實每一個轉角，都有一個「安排」在等他。<\/p><p>「吞了」這個字，本來是危險的。可是這一節沒有說約拿被吞了就完了；它說<strong>他在魚腹中三日三夜<\/strong>。這是一段在黑暗裡的時間。下一章你會看見：約拿在那裡，第一次禱告。<\/p><p>這一節還有一個細節：經文沒有說神責備約拿。<strong>大風是神擲的，魚是神安排的；兩者之間，只有約拿被拋入海。神接住他，不是因為他夠好，是因為這卷書要說的，從來不是約拿有多好，而是神有多不肯放手。<\/strong> 後來，耶穌自己也說過「約拿的神蹟」（太12:39–41），我們到第二章再細讀。<\/p>"}],"2":[{"a":1,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיִּתְפַּלֵּל יוֹנָה אֶל יְהוָה אֱלֹהָיו מִמְּעֵי הַדָּגָֽה׃ וַיֹּאמֶר קָרָאתִי מִצָּרָה לִי אֶל יְהוָה וַֽיַּעֲנֵנִי מִבֶּטֶן שְׁאוֹל שִׁוַּעְתִּי שָׁמַעְתָּ קוֹלִֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「約拿在魚腹中禱告耶和華－他的神，說：我遭遇患難求告耶和華，你就應允我；從陰間的深處呼求，你就俯聽我的聲音。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禱告<\/td><td>וַיִּתְפַּלֵּל<\/td><td>palal<\/td><td>H6419<\/td><td>禱告、代求<\/td><\/tr><tr><td>魚腹<\/td><td>מִמְּעֵי<\/td><td>me'ei<\/td><td>H4578<\/td><td>腹、內臟<\/td><\/tr><tr><td>患難<\/td><td>מִצָּרָה<\/td><td>tsarah<\/td><td>H6869<\/td><td>患難、狹窄<\/td><\/tr><tr><td>求告<\/td><td>קָרָאתִי<\/td><td>qara<\/td><td>H7121<\/td><td>呼喊、求告<\/td><\/tr><tr><td>應允<\/td><td>וַֽיַּעֲנֵנִי<\/td><td>anah<\/td><td>H6030<\/td><td>回答、應允<\/td><\/tr><tr><td>陰間<\/td><td>שְׁאוֹל<\/td><td>she'ol<\/td><td>H7585<\/td><td>陰間、墓穴<\/td><\/tr><tr><td>呼求<\/td><td>שִׁוַּעְתִּי<\/td><td>shava<\/td><td>H7768<\/td><td>呼救、哀求<\/td><\/tr><tr><td>俯聽<\/td><td>שָׁמַעְתָּ<\/td><td>shama<\/td><td>H8085<\/td><td>聽見、垂聽<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>禱告<\/strong>：原文 vayitpallel，第一章裡，水手「哀求」、船主「求告」，約拿一次也沒有開口求告神；直到這裡，全卷才第一次說「約拿禱告」。<strong>魚腹<\/strong>一詞，2:1 用的是陰性的 dagah，1:17 與 2:10 用的是陽性的 dag；這是原文的小差異，不需要從中推出什麼。<\/p><p><strong>我求告……你就應允我<\/strong>：動詞是過去式。約拿在魚腹中，說的不是「求你救我」，而是「我求告，你應允了」；這篇禱告從頭到尾像感恩詩，不像求救詩。<strong>求告（qara）<\/strong>是全卷追蹤字，2:2 是約拿第一次、也是唯一一次向神呼喊。<\/p><p><strong>陰間的深處<\/strong>：原文 mibeten she'ol，字面是「從陰間的肚腹」，與上一節「魚腹」同樣用「腹」字；約拿在魚的肚腹中，卻說自己是在陰間的肚腹裡呼求。<\/p>","exp":"<p>第一章，船上每個人都在求告，只有約拿在睡。第二章第一句，約拿<strong>終於禱告<\/strong>了，而且是<strong>在魚腹中<\/strong>，一個完全沒有出路的地方。<\/p><p>我們先不要評斷這篇禱告好不好。先聽它說了什麼：它稱神為「<strong>耶和華──他的神<\/strong>」（2:1），這是整卷第一次，約拿用這樣親近的說法；它承認自己是在「患難」中呼求；它說神「<strong>應允<\/strong>」、「<strong>俯聽<\/strong>」。<\/p><p>注意一個細節：<strong>神的回應，在禱告之前，先已經在了。<\/strong> 約拿沒有說「求你救我出去」，他說「你已經聽見我的聲音」。魚腹裡還是魚腹，水還是水，但他已經在說：神聽見了。有時候，禱告不是先改變環境，而是先改變人對自己所在位置的看法。<\/p>"},{"a":3,"z":3,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַתַּשְׁלִיכֵנִי מְצוּלָה בִּלְבַב יַמִּים וְנָהָר יְסֹבְבֵנִי כָּל מִשְׁבָּרֶיךָ וְגַלֶּיךָ עָלַי עָבָֽרוּ׃<\/p><\/blockquote>","lit":"<blockquote><p>「你將我投下深淵，就是海的深處；大水環繞我，你的波浪洪濤都漫過我身。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>投下<\/td><td>וַתַּשְׁלִיכֵנִי<\/td><td>hishlich<\/td><td>H7993<\/td><td>拋、投下<\/td><\/tr><tr><td>深淵<\/td><td>מְצוּלָה<\/td><td>metsulah<\/td><td>H4688<\/td><td>深處<\/td><\/tr><tr><td>海<\/td><td>יַמִּים<\/td><td>yam<\/td><td>H3220<\/td><td>海<\/td><\/tr><tr><td>環繞<\/td><td>יְסֹבְבֵנִי<\/td><td>sabab<\/td><td>H5437<\/td><td>環繞、圍住<\/td><\/tr><tr><td>波浪<\/td><td>מִשְׁבָּרֶיךָ<\/td><td>mishbar<\/td><td>H4867<\/td><td>浪、洪濤<\/td><\/tr><tr><td>洪濤<\/td><td>וְגַלֶּיךָ<\/td><td>gal<\/td><td>H1530<\/td><td>波浪<\/td><\/tr><tr><td>漫過<\/td><td>עָבָֽרוּ<\/td><td>avar<\/td><td>H5674<\/td><td>經過、漫過<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>你將我投下<\/strong>：原文 vatashlicheni，動詞是 shalak（拋、投）。第一章的「擲」是另一個字 hetil（出現四次：1:4、5、12、15）；這裡約拿換了一個詞，並且主詞是「<strong>你<\/strong>」。<\/p><p><strong>你的波浪洪濤<\/strong>：mishbarekha vegalekha，字面是「你的浪頭和你的波濤」；這句與詩篇 42:7「你的瀑布發聲，深淵就與深淵響應；你的波浪洪濤漫過我身」幾乎相同。禱告裡有許多詩篇的語言，這不是抄襲，而是一個認得詩篇的人，在最深的地方，用他所熟悉的話向神說話。<\/p><p><strong>海的深處<\/strong>：levav yammim，字面是「海的心」，「心」（levav）指正中央。<\/p>","exp":"<p>這一節有一個奇怪的轉變：在第一章，是<strong>水手<\/strong>把約拿拋下海（1:15）；在這裡，約拿說：「<strong>你<\/strong>將我投下深淵。」<\/p><p>約拿沒有說：水手把我拋下去；也沒有說：我自己跳下去。他說：是你。這不是推卸責任（他在 1:12 已經說了「是因我的緣故」），而是他在黑暗中，看見了<strong>那隻比所有人手都更大的手<\/strong>。<\/p><p>「你的波浪洪濤」也一樣：浪是海的浪，卻是「你的」。<strong>神不是在海之外，而是在浪之中。<\/strong> 這是一種不容易的信心：在一個人最想問「神在哪裡」的時刻，他說，連這片水，也屬於祢。<\/p>"},{"a":4,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַאֲנִי אָמַרְתִּי נִגְרַשְׁתִּי מִנֶּגֶד עֵינֶיךָ אַךְ אוֹסִיף לְהַבִּיט אֶל הֵיכַל קָדְשֶֽׁךָ׃ אֲפָפוּנִי מַיִם עַד נֶפֶשׁ תְּהוֹם יְסֹבְבֵנִי סוּף חָבוּשׁ לְרֹאשִֽׁי׃<\/p><\/blockquote>","lit":"<blockquote><p>「我說：我從你眼前雖被驅逐，我仍要仰望你的聖殿。諸水環繞我，幾乎淹沒我；深淵圍住我；海草纏繞我的頭。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>驅逐<\/td><td>נִגְרַשְׁתִּי<\/td><td>garash<\/td><td>H1644<\/td><td>驅逐、趕出<\/td><\/tr><tr><td>眼前<\/td><td>מִנֶּגֶד<\/td><td>neged<\/td><td>H5048<\/td><td>在……面前<\/td><\/tr><tr><td>仰望<\/td><td>לְהַבִּיט<\/td><td>nabat<\/td><td>H5027<\/td><td>注視、仰望<\/td><\/tr><tr><td>聖殿<\/td><td>הֵיכַל<\/td><td>heikhal<\/td><td>H1964<\/td><td>殿、宮殿<\/td><\/tr><tr><td>淹沒<\/td><td>אֲפָפוּנִי<\/td><td>afaf<\/td><td>H661<\/td><td>環繞、圍困<\/td><\/tr><tr><td>性命<\/td><td>נֶפֶשׁ<\/td><td>nefesh<\/td><td>H5315<\/td><td>性命、魂、喉嚨<\/td><\/tr><tr><td>深淵<\/td><td>תְּהוֹם<\/td><td>tehom<\/td><td>H8415<\/td><td>深淵、深處<\/td><\/tr><tr><td>海草<\/td><td>סוּף<\/td><td>suf<\/td><td>H5488<\/td><td>蘆葦、海草<\/td><\/tr><tr><td>纏繞<\/td><td>חָבוּשׁ<\/td><td>chavash<\/td><td>H2280<\/td><td>包紮、纏裹<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我從你眼前雖被驅逐<\/strong>：nigrashti 來自 garash（驅逐），是亞當被趕出伊甸園、該隱被趕離地面所用的同一個字（創3:24；4:14）。<strong>眼前<\/strong>（neged）與「面前」同屬一個意象：約拿原本要「躲避耶和華的面前」，現在卻說，自己是從神的眼前被趕出去的。<\/p><p><strong>我仍要仰望你的聖殿<\/strong>：原文 ach osif lehabit el-heikhal kodshekha。歷來有兩種讀法：和合本與多數譯本讀為「我仍要再仰望」（宣告），有些古譯本讀為疑問式：「我還能再仰望嗎？」；兩者都承認他在<strong>遙遠之處<\/strong>，望向聖殿。<\/p><p><strong>幾乎淹沒我<\/strong>：原文是 afafuni mayim ad-nefesh，字面是「水環繞我，直到<strong>性命<\/strong>」；nefesh 可譯為「喉嚨」「性命」，水已經漲到咽喉。<strong>海草<\/strong>（suf）與「紅海」的「紅」同一個字（yam suf，字面是蘆葦之海）。<\/p>","exp":"<p>這兩節把約拿的處境一層一層寫進去：先是<strong>被趕出神眼前<\/strong>（2:4），接著是<strong>水漲到咽喉<\/strong>（2:5），然後是<strong>海草纏頭<\/strong>。越寫越近，越寫越緊。<\/p><p>2:4 是整篇禱告的轉折點。前面是「被驅逐」，後面卻說「<strong>我仍要仰望你的聖殿<\/strong>」。這個「仍要」（ach）是約拿書最溫柔的轉身：他沒有因為被趕出去，就不再望向那位趕他的神。<\/p><p>這裡有一個提醒：聖殿在耶路撒冷，離海底何止千里；他在海的深處，<strong>望向一個他看不見的地方<\/strong>。信心，常常不是看見之後的相信，而是看不見的時候，仍然把臉轉向那個方向。<\/p>"},{"a":6,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>לְקִצְבֵי הָרִים יָרַדְתִּי הָאָרֶץ בְּרִחֶיהָ בַעֲדִי לְעוֹלָם וַתַּעַל מִשַּׁחַת חַיַּי יְהוָה אֱלֹהָֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「我下到山根，地的門將我永遠關住。耶和華－我的神啊，你卻將我的性命從坑中救出來。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>山根<\/td><td>לְקִצְבֵי<\/td><td>ketsev<\/td><td>H7095<\/td><td>根基、盡頭<\/td><\/tr><tr><td>下到<\/td><td>יָרַדְתִּי<\/td><td>yarad<\/td><td>H3381<\/td><td>下去<\/td><\/tr><tr><td>門<\/td><td>בְּרִחֶיהָ<\/td><td>be'ri<\/td><td>H1280<\/td><td>門閂、門<\/td><\/tr><tr><td>永遠<\/td><td>לְעוֹלָם<\/td><td>olam<\/td><td>H5769<\/td><td>永遠<\/td><\/tr><tr><td>救出來<\/td><td>וַתַּעַל<\/td><td>alah<\/td><td>H5927<\/td><td>上去、帶上來<\/td><\/tr><tr><td>坑<\/td><td>מִשַּׁחַת<\/td><td>shachat<\/td><td>H7845<\/td><td>坑、墓穴<\/td><\/tr><tr><td>性命<\/td><td>חַיַּי<\/td><td>chay<\/td><td>H2416<\/td><td>生命、活著<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我下到山根<\/strong>：yaradti（我下去了）是全卷「下去」的最後一次（1:3 兩次、1:5 一次、2:6 一次）；<strong>山根<\/strong>（ketsvei harim）字面是「山的底端」，指海底山脈的根基，是人所能想像最深的地方。<\/p><p><strong>地的門將我永遠關住<\/strong>：be'richeha ba'adi le'olam，字面是「地的門閂在我後面，永遠」。門閂是從外面關上的，約拿在說，自己被關在一扇不能從裡面打開的門後面。<\/p><p><strong>你卻將我的性命從坑中救出來<\/strong>：vata'al mishachat chayyai。<strong>救出來<\/strong>用的動詞是 alah（上去、帶上來），這正是 1:2 惡「<strong>上<\/strong>到」神面前的那個字：惡往上，神把人也往上帶。<strong>坑<\/strong>（shachat）是墳墓與陰間的另一個詞。<\/p>","exp":"<p>這是全卷的<strong>最低點<\/strong>，也是<strong>轉折點<\/strong>：「我下到山根」之後，緊接著的是「你卻」。<\/p><p>整卷書約拿一路向下：下到約帕，下到船裡，下到底艙，下到海裡，下到山根。<strong>一個人往下的路，是自己走的；往上的路，是神帶的。<\/strong> 他在這裡說「<strong>你將我的性命……救出來<\/strong>」，動詞是「帶上來」，主詞是神。<\/p><p>留意兩個細節。第一，這節的「<strong>卻<\/strong>」字，前面是「永遠被關住」，後面是「你卻……」。人說「永遠」的地方，神說「不」。第二，他說的是「<strong>我的神<\/strong>」（耶和華──我的神啊）。到了最深處，他說的不是「那位神」，而是「<strong>我的神<\/strong>」。<\/p>"},{"a":7,"z":7,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>בְּהִתְעַטֵּף עָלַי נַפְשִׁי אֶת יְהוָה זָכָרְתִּי וַתָּבוֹא אֵלֶיךָ תְּפִלָּתִי אֶל הֵיכַל קָדְשֶֽׁךָ׃<\/p><\/blockquote>","lit":"<blockquote><p>「我心在我裡面發昏的時候，我就想念耶和華。我的禱告進入你的聖殿，達到你的面前。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>發昏<\/td><td>בְּהִתְעַטֵּף<\/td><td>atap<\/td><td>H5848<\/td><td>衰弱、昏厥<\/td><\/tr><tr><td>想念<\/td><td>זָכָרְתִּי<\/td><td>zakhar<\/td><td>H2142<\/td><td>記念、想起<\/td><\/tr><tr><td>禱告<\/td><td>תְּפִלָּתִי<\/td><td>tefillah<\/td><td>H8605<\/td><td>禱告<\/td><\/tr><tr><td>達到<\/td><td>וַתָּבוֹא<\/td><td>bo<\/td><td>H935<\/td><td>來到、進入<\/td><\/tr><tr><td>聖殿<\/td><td>הֵיכַל<\/td><td>heikhal<\/td><td>H1964<\/td><td>殿<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>我心在我裡面發昏<\/strong>：behit'atef alai nafshi，<strong>發昏<\/strong>（atap）是衰弱、虛脫的意思；nafshi（我的性命、我的魂）是這節的主詞。<\/p><p><strong>我就想念耶和華<\/strong>：et-YHWH zakharti，zakhar 的意思是「記起」，不只是回憶，而是把一個人帶回心裡。主詞是約拿，受詞是<strong>耶和華<\/strong>；整節的重心，不是約拿記起了自己的罪，而是<strong>記起了耶和華<\/strong>。<\/p><p><strong>我的禱告進入你的聖殿<\/strong>：vatavo eleykha tefillati el-heikhal kodshekha。「聖殿」與 2:4 的「聖殿」是同一個詞，頭尾呼應：2:4 他望向聖殿，2:7 他的禱告<strong>到了<\/strong>聖殿。<\/p>","exp":"<p>這一節很短，卻是全篇的轉彎處：人的力量用盡了，<strong>才<\/strong>想起神。<\/p><p>「<strong>發昏的時候<\/strong>」，是約拿完全沒有力氣的時候。這不是一個高峰經歷，而是一個人的魂快要熄滅的時刻。<strong>就在這時，他想念耶和華。<\/strong> 我們常常以為要等自己恢復力氣才能禱告，經文說，不必；人在最軟弱的地方，一個「想念」就夠了。<\/p><p>更重要的是下半節：<strong>他的禱告到了。<\/strong> 2:4 他是「望向」一個看不見的聖殿；2:7 他的禱告，已經「進入」。沒有一句禱告，是被丟在海裡的。<\/p>"},{"a":8,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מְשַׁמְּרִים הַבְלֵי שָׁוְא חַסְדָּם יַעֲזֹֽבוּ׃ וַאֲנִי בְּקוֹל תּוֹדָה אֶזְבְּחָה לָּךְ אֲשֶׁר נָדַרְתִּי אֲשַׁלֵּמָה יְשׁוּעָתָה לַיהוָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「那信奉虛無之神的人，離棄憐愛他們的主；但我必用感謝的聲音獻祭與你。我所許的願，我必償還。救恩出於耶和華。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>虛無<\/td><td>שָׁוְא<\/td><td>shav<\/td><td>H7723<\/td><td>虛空、虛假<\/td><\/tr><tr><td>偶像<\/td><td>הַבְלֵי<\/td><td>hevel<\/td><td>H1892<\/td><td>氣息、虛空<\/td><\/tr><tr><td>離棄<\/td><td>יַעֲזֹֽבוּ<\/td><td>azav<\/td><td>H5800<\/td><td>離棄、丟下<\/td><\/tr><tr><td>慈愛<\/td><td>חַסְדָּם<\/td><td>chesed<\/td><td>H2617<\/td><td>慈愛、恩慈<\/td><\/tr><tr><td>感謝<\/td><td>תּוֹדָה<\/td><td>todah<\/td><td>H8426<\/td><td>感謝、頌讚<\/td><\/tr><tr><td>獻祭<\/td><td>אֶזְבְּחָה<\/td><td>zavach<\/td><td>H2076<\/td><td>獻祭<\/td><\/tr><tr><td>許願<\/td><td>נָדַרְתִּי<\/td><td>nadar<\/td><td>H5087<\/td><td>許願<\/td><\/tr><tr><td>償還<\/td><td>אֲשַׁלֵּמָה<\/td><td>shalem<\/td><td>H7999<\/td><td>償還、完全<\/td><\/tr><tr><td>救恩<\/td><td>יְשׁוּעָתָה<\/td><td>yeshuah<\/td><td>H3444<\/td><td>救恩、拯救<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>那信奉虛無之神的人<\/strong>：mishamerim havlei-shav，字面是「那些守著虛空的虛空的人」，hevel（氣息、虛空）與 shav（虛假）疊用，是舊約形容偶像最重的一種說法。<\/p><p><strong>離棄憐愛他們的主<\/strong>：chasdam ya'azovu，字面是「他們的<strong>慈愛<\/strong>，他們離棄」。<strong>和合本<\/strong>把 chesed 當作一位「主」（那位憐愛他們的），<strong>另有譯法<\/strong>讀成「離棄自己的慈愛」（就是他們本來可以有的慈愛）；兩種讀法都不離開一件事：離開神，就離開了慈愛。<strong>chesed<\/strong> 在全卷只出現兩次：2:8 與 4:2（「豐盛的慈愛」）。<\/p><p><strong>獻祭、許願<\/strong>：zavach 與 nadar，正是 1:16 水手所做的兩件事：「向耶和華獻祭，並且許願」。<strong>救恩出於耶和華<\/strong>：yeshu'ata l'YHWH，字面是「救恩屬於耶和華」，是動詞 yasha 的名詞，與「耶穌」（耶書亞）同一個字根。<\/p>","exp":"<p>這兩節是整篇禱告的結論，也是全卷的<strong>樞紐<\/strong>：<strong>救恩出於耶和華。<\/strong><\/p><p>先看對照。2:8 說「<strong>他們<\/strong>」：信奉虛無的人，離棄了慈愛；2:9 說「<strong>但我<\/strong>」：用感謝的聲音獻祭。約拿站在兩種人之間，選擇站在<strong>回來的一邊<\/strong>。他在 1:16 看過水手獻祭許願，現在他自己說，我也要。<\/p><p>接著是那一句：「<strong>救恩出於耶和華。<\/strong>」注意它的意思：救恩<strong>屬於<\/strong>耶和華，不屬於約拿，不屬於水手，也不屬於魚。他沒有說「我配得救」，他說的是，<strong>救的權柄，全在祢那裡<\/strong>。<\/p><p>這句話，約拿說得很好。但整卷書的下半，是神把這句話<strong>再問回給約拿一次<\/strong>：既然救恩屬於耶和華，那麼神要不要救尼尼微，是誰的事？我們先不替第四章搶話，只把這一句記住：它是約拿最正確的一句話，也是他後來最需要再聽一次的話。<\/p>"},{"a":10,"z":10,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמֶר יְהוָה לַדָּג וַיָּקֵא אֶת יוֹנָה אֶל הַיַּבָּשָֽׁה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華吩咐魚，魚就把約拿吐在旱地上。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>吩咐<\/td><td>וַיֹּאמֶר<\/td><td>amar<\/td><td>H559<\/td><td>說<\/td><\/tr><tr><td>魚<\/td><td>לַדָּג<\/td><td>dag<\/td><td>H1709<\/td><td>魚<\/td><\/tr><tr><td>吐<\/td><td>וַיָּקֵא<\/td><td>qi<\/td><td>H6958<\/td><td>吐出<\/td><\/tr><tr><td>旱地<\/td><td>הַיַּבָּשָֽׁה<\/td><td>yabbashah<\/td><td>H3004<\/td><td>旱地、乾地<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>耶和華吩咐魚<\/strong>：vayomer YHWH ladag，字面是「耶和華對魚說」。<strong>說<\/strong>（amar）是神創造時所用的動詞（創1:3）；這裡，神用「說」叫魚聽從。<\/p><p><strong>吐<\/strong>：vayaqe，是「嘔吐」的動詞，不是溫柔的放下。<strong>旱地<\/strong>（hayyabbashah）與 1:9 約拿所說「那創造海與<strong>旱地<\/strong>的」是同一個詞：一個說「神造了海與旱地」的人，現在被吐在旱地上。<\/p>","exp":"<p>最後一節，只有一句話：<strong>神對魚說話，魚就聽了。<\/strong><\/p><p>這是全卷裡，第一次有受造之物，<strong>立刻<\/strong>回應神的話。風（1:4）、籤（1:7）、海（1:15）、魚（1:17），都服從了神；現在連「吐」這個不太優雅的動作，也是出於神的吩咐。<\/p><p>我們也要誠實說一件事：到了這一節，約拿被吐在旱地上，<strong>還沒有說他會去尼尼微<\/strong>。他得救了，但他還沒有「起來」。下一章，神的話要<strong>第二次<\/strong>臨到他。這一章結束在旱地，是在提醒我們：被神救，是恩典；<strong>起來，去<\/strong>，才是接下來的事。<\/p>"}],"3":[{"a":1,"z":3,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיְהִי דְבַר יְהוָה אֶל יוֹנָה שֵׁנִית לֵאמֹֽר׃ קוּם לֵךְ אֶל נִֽינְוֵה הָעִיר הַגְּדוֹלָה וִּקְרָא אֵלֶיהָ אֶת הַקְּרִיאָה אֲשֶׁר אָנֹכִי דֹּבֵר אֵלֶֽיךָ׃ וַיָּקָם יוֹנָה וַיֵּלֶךְ אֶל נִֽינְוֶה כִּדְבַר יְהוָה וְנִֽינְוֵה הָיְתָה עִיר גְּדוֹלָה לֵֽאלֹהִים מַהֲלַךְ שְׁלֹשֶׁת יָמִֽים׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華的話二次臨到約拿說：你起來！往尼尼微大城去，向其中的居民宣告我所吩咐你的話。約拿便照耶和華的話起來，往尼尼微去。這尼尼微是極大的城，有三日的路程。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>二次<\/td><td>שֵׁנִית<\/td><td>sheni<\/td><td>H8145<\/td><td>第二、再一次<\/td><\/tr><tr><td>起來<\/td><td>קוּם<\/td><td>qum<\/td><td>H6965<\/td><td>起來<\/td><\/tr><tr><td>去<\/td><td>לֵךְ<\/td><td>halakh<\/td><td>H3212<\/td><td>去、行走<\/td><\/tr><tr><td>宣告<\/td><td>וִּקְרָא<\/td><td>qara<\/td><td>H7121<\/td><td>呼喊、宣告<\/td><\/tr><tr><td>吩咐<\/td><td>דֹּבֵר<\/td><td>dibber<\/td><td>H1696<\/td><td>說、吩咐<\/td><\/tr><tr><td>大城<\/td><td>גְּדוֹלָה<\/td><td>gadol<\/td><td>H1419<\/td><td>大<\/td><\/tr><tr><td>路程<\/td><td>מַהֲלַךְ<\/td><td>mahalakh<\/td><td>H4109<\/td><td>路程<\/td><\/tr><tr><td>三日<\/td><td>שְׁלֹשֶׁת<\/td><td>shloshet<\/td><td>H7969<\/td><td>三（陽性）<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>二次<\/strong>：shenit，「第二次」。全卷只有這一處，神的話第二次臨到約拿；第一次的開頭（1:1）是 vayehi devar-YHWH el-Yonah，這裡只在句中加了一個字 shenit，其餘一字不差。<\/p><p><strong>起來！去！宣告<\/strong>：與 1:2 幾乎相同，只有一處不同：1:2 神說去「<strong>呼喊<\/strong>」攻擊他們的惡，這裡是「<strong>宣告我所吩咐你的話<\/strong>」，也就是說，這一次，約拿要說的內容，是神<strong>當下<\/strong>要給的。qara 在這兩節都出現，是追蹤字。<\/p><p><strong>極大的城<\/strong>：ir gedolah lElohim，字面是「對神來說是一座大城」，le-Elohim 常被看作最高級（「極大」）的用法，也可以讀為「在神眼中」。<strong>三日的路程<\/strong>，不確定是指城的周長，還是走遍全城、辦事所需的時間；本講義不替它定位，只記得一件事：這座城，大到一個人要走很久。<\/p>","exp":"<p><strong>神的話，第二次臨到。<\/strong> 這句話，與 1:1 比，只多了一個字：第二次。神沒有換一個先知，也沒有換一個命令，祂把同一句話，再說一次。<\/p><p>這一次，約拿的回應只有一節：<strong>約拿便照耶和華的話起來，往尼尼微去<\/strong>（3:3）。你記得 1:3 嗎？那裡也是「約拿起來」，卻是往他施。同一個動詞 qum，同一個人，這一次，方向對了。<strong>逃的人，被神挽回，起來了。<\/strong> 這就是第三章最大的恩典：神的呼召不因約拿一次的逃而收回。<\/p><p>注意那句「<strong>宣告我所吩咐你的話<\/strong>」。第一次，神說去呼喊他們的惡；第二次，神說「我所吩咐你的話」，約拿要說的，不是他自己想說的，也不是他想像的。<strong>順服，是把嘴交給神。<\/strong><\/p>"},{"a":4,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיָּחֶל יוֹנָה לָבוֹא בָעִיר מַהֲלַךְ יוֹם אֶחָד וַיִּקְרָא וַיֹּאמַר עוֹד אַרְבָּעִים יוֹם וְנִֽינְוֵה נֶהְפָּֽכֶת׃<\/p><\/blockquote>","lit":"<blockquote><p>「約拿進城走了一日，宣告說：再等四十日，尼尼微必傾覆了！」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>進城<\/td><td>לָבוֹא<\/td><td>bo<\/td><td>H935<\/td><td>進入<\/td><\/tr><tr><td>一日<\/td><td>אֶחָד<\/td><td>echad<\/td><td>H259<\/td><td>一<\/td><\/tr><tr><td>宣告<\/td><td>וַיִּקְרָא<\/td><td>qara<\/td><td>H7121<\/td><td>呼喊<\/td><\/tr><tr><td>再等<\/td><td>עוֹד<\/td><td>od<\/td><td>H5750<\/td><td>還要、再<\/td><\/tr><tr><td>四十<\/td><td>אַרְבָּעִים<\/td><td>arba'im<\/td><td>H705<\/td><td>四十<\/td><\/tr><tr><td>傾覆<\/td><td>נֶהְפָּֽכֶת<\/td><td>hafakh<\/td><td>H2015<\/td><td>翻轉、傾覆、改變<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>進城走了一日<\/strong>：vayachel Yonah lavo ba'ir mahalach yom echad，字面是「約拿開始進城，走了一日的路」。三日的路程，他只走了一天，就開口了。<\/p><p><strong>再等四十日<\/strong>：od arba'im yom。「四十」在聖經是一段考驗的時間（創7:12；出24:18；太4:2），本講義不用它推算任何日期，只看這四十天是<strong>一個空間<\/strong>：神給了時間。<\/p><p><strong>傾覆<\/strong>：nehpakhet，來自 hafakh（翻轉、倒轉）。這個字，可以指毀滅式的傾覆（創19:25，所多瑪被傾覆），也可以指「翻轉、改變」（出7:17、20，河水變為血；詩30:11，「你將我的哀哭變為跳舞」）。約拿的宣告只有五個詞，這個動詞留下了雙重的意思。<\/p>","exp":"<p>全章的宣告，只有一節，而且只有幾個字：<strong>再等四十日，尼尼微必傾覆了。<\/strong> 沒有「你們要悔改」，沒有「或者神會憐憫」，沒有任何出路的暗示。這是約拿全書唯一一次的講道，<strong>短，冷，不帶任何邀請。<\/strong><\/p><p>這裡有兩件事值得慢慢看。第一，「再等四十日」，是<strong>一段時間<\/strong>。不是「今天」，不是「馬上」，神給了時間。第二，「傾覆」這個字，既可以是「毀滅」，也可以是「翻轉」。尼尼微後來真的被「翻轉」了：不是被火與硫磺翻轉，而是人心翻轉，<strong>回轉<\/strong>了。同一個字，兩個結局。<\/p><p>我們也要提醒一件事：<strong>我們不用「四十日」推算任何日期。<\/strong> 這一節的重點，不是數字，而是神在宣告裡，留下了空間。<\/p>"},{"a":5,"z":6,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַֽיַּאֲמִינוּ אַנְשֵׁי נִֽינְוֵה בֵּֽאלֹהִים וַיִּקְרְאוּ צוֹם וַיִּלְבְּשׁוּ שַׂקִּים מִגְּדוֹלָם וְעַד קְטַנָּֽם׃ וַיִּגַּע הַדָּבָר אֶל מֶלֶך נִֽינְוֵה וַיָּקָם מִכִּסְאוֹ וַיַּעֲבֵר אַדַּרְתּוֹ מֵֽעָלָיו וַיְכַס שַׂק וַיֵּשֶׁב עַל הָאֵֽפֶר׃<\/p><\/blockquote>","lit":"<blockquote><p>「尼尼微人信服神，便宣告禁食，從最大的到至小的都穿麻衣。這信息傳到尼尼微王的耳中，他就下了寶座，脫下朝服，披上麻布，坐在灰中。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>信服<\/td><td>וַֽיַּאֲמִינוּ<\/td><td>'aman<\/td><td>H539<\/td><td>相信、信靠<\/td><\/tr><tr><td>禁食<\/td><td>צוֹם<\/td><td>tsom<\/td><td>H6685<\/td><td>禁食<\/td><\/tr><tr><td>麻衣<\/td><td>שַׂקִּים<\/td><td>saq<\/td><td>H8242<\/td><td>麻布<\/td><\/tr><tr><td>最大的<\/td><td>מִגְּדוֹלָם<\/td><td>gadol<\/td><td>H1419<\/td><td>大<\/td><\/tr><tr><td>至小的<\/td><td>קְטַנָּֽם<\/td><td>qatan<\/td><td>H6996<\/td><td>小<\/td><\/tr><tr><td>傳到<\/td><td>וַיִּגַּע<\/td><td>naga<\/td><td>H5060<\/td><td>觸及、傳到<\/td><\/tr><tr><td>寶座<\/td><td>מִכִּסְאוֹ<\/td><td>kisse<\/td><td>H3678<\/td><td>寶座<\/td><\/tr><tr><td>下了<\/td><td>וַיָּקָם<\/td><td>qum<\/td><td>H6965<\/td><td>起來<\/td><\/tr><tr><td>灰<\/td><td>הָאֵֽפֶר<\/td><td>efer<\/td><td>H665<\/td><td>灰<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>信服神<\/strong>：vaya'aminu... b'Elohim，「<strong>信<\/strong>（'aman）」與「亞們」同一個字根，是「站穩、可靠」的意思；他們相信的，是 <strong>Elohim<\/strong>（神）。注意：第三章裡，尼尼微人和作者都用 Elohim，不是耶和華（YHWH）這個立約的名；直到 4:2 約拿禱告時才再用「耶和華」。<\/p><p><strong>從最大的到至小的<\/strong>：mi-gedolam ve-ad qetannam。「大」（gadol）是追蹤字，這裡指<strong>地位<\/strong>的大，不是城的大。尼尼微人從最大到最小，都穿麻衣。<\/p><p><strong>下了寶座<\/strong>：vayaqom mikisso，字面是「他<strong>起來<\/strong>，離開他的寶座」。除了約拿，這是全卷第一個以行動「起來」的人，是一位外邦王，而且他「起來」的方向，是<strong>往下<\/strong>：離開寶座，坐在灰中。<\/p>","exp":"<p>第五節，只用了一個字，就概括整座城的轉變：<strong>信服<\/strong>。他們沒有先聽到一篇有條理的講章，沒有看見神蹟，只聽見了五個詞：「再等四十日，尼尼微必傾覆了。」就信了。<\/p><p>這一段的順序，是整章最值得慢慢看的：<strong>先是百姓<\/strong>（從最大到最小），<strong>後是王<\/strong>（3:6）。消息傳到王的耳中，他做了四件事：<strong>離開寶座，脫下朝服，披上麻布，坐在灰中。<\/strong> 注意那個動詞：「他起來，離開他的寶座。」<\/p><p>這是一個奇妙的畫面：<strong>一位先知，第一次「起來」，往他施逃；一位王，第一次「起來」，往灰中坐。<\/strong> 約拿的「起來」，要花一整章（兩次）才對；尼尼微王的「起來」，一次，就對了。這不是要羞辱約拿，而是要我們看見：<strong>神的話落在誰的心上，誰就起來。<\/strong><\/p>"},{"a":7,"z":8,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיַּזְעֵק וַיֹּאמֶר בְּנִֽינְוֵה מִטַּעַם הַמֶּלֶךְ וּגְדֹלָיו לֵאמֹר הָאָדָם וְהַבְּהֵמָה הַבָּקָר וְהַצֹּאן אַֽל יִטְעֲמוּ מְאוּמָה אַל יִרְעוּ וּמַיִם אַל יִשְׁתּֽוּ׃ וְיִתְכַּסּוּ שַׂקִּים הָֽאָדָם וְהַבְּהֵמָה וְיִקְרְאוּ אֶל אֱלֹהִים בְּחָזְקָה וְיָשֻׁבוּ אִישׁ מִדַּרְכּוֹ הָֽרָעָה וּמִן הֶחָמָס אֲשֶׁר בְּכַפֵּיהֶֽם׃<\/p><\/blockquote>","lit":"<blockquote><p>「他又使人遍告尼尼微通城，說：王和大臣有令，人不可嘗甚麼，牲畜、牛羊不可吃草，也不可喝水。人與牲畜都當披上麻布；人要切切求告神。各人回頭離開所行的惡道，丟棄手中的強暴。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>遍告<\/td><td>וַיַּזְעֵק<\/td><td>za'aq<\/td><td>H2199<\/td><td>呼喊、宣告<\/td><\/tr><tr><td>令<\/td><td>מִטַּעַם<\/td><td>ta'am<\/td><td>H2940<\/td><td>命令、旨意（原意：味道）<\/td><\/tr><tr><td>嘗<\/td><td>יִטְעֲמוּ<\/td><td>ta'am<\/td><td>H2938<\/td><td>嘗、品嘗<\/td><\/tr><tr><td>披上<\/td><td>וְיִתְכַּסּוּ<\/td><td>kasah<\/td><td>H3680<\/td><td>覆蓋、遮蓋<\/td><\/tr><tr><td>切切<\/td><td>בְּחָזְקָה<\/td><td>chozqah<\/td><td>H2394<\/td><td>強力、迫切<\/td><\/tr><tr><td>回頭<\/td><td>וְיָשֻׁבוּ<\/td><td>shuv<\/td><td>H7725<\/td><td>轉回<\/td><\/tr><tr><td>惡道<\/td><td>הָֽרָעָה<\/td><td>ra'<\/td><td>H7451<\/td><td>惡、災禍<\/td><\/tr><tr><td>強暴<\/td><td>הֶחָמָס<\/td><td>chamas<\/td><td>H2555<\/td><td>強暴、暴力<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>令<\/strong>：ta'am，在亞蘭／亞述語境裡是「法令、命令」，在希伯來文裡本來的意思是「味道」。同一節裡，「<strong>不可嘗<\/strong>」（yit'amu）用的是動詞 ta'am「嘗」，名詞與動詞一前一後。<\/p><p><strong>切切求告<\/strong>：yiqre'u el-Elohim bechazqah，字面是「<strong>用力<\/strong>呼求神」。qara（呼求）再次出現，是追蹤字：在這個故事裡，呼求神的，先是船主與水手（1:6、14），約拿（2:2），現在是<strong>整座尼尼微城<\/strong>。<\/p><p><strong>回頭離開惡道<\/strong>：yashuvu ish mi-darko hara'ah，<strong>shuv<\/strong>（回轉）是舊約悔改的主要動詞；<strong>ra'ah<\/strong>（惡）在這節出現，3:10 再出現兩次。<strong>強暴<\/strong>（chamas）指暴力與不義，是洪水前世代的罪（創6:11）。<\/p>","exp":"<p>王和大臣的令，有三個部分：<strong>禁食，披麻，切切求告神。<\/strong> 而且連牲畜，也要披上麻布。這是一個很特別的細節：人與牲畜，一起在神面前謙卑下來。<\/p><p>最重要的是第八節下半：<strong>各人回頭離開所行的惡道，丟棄手中的強暴。<\/strong> 注意，這裡的「悔改」，不是只在內心感覺難過，而是<strong>具體的轉回<\/strong>：回頭，離開惡道；丟棄，手中的強暴。<strong>是手，不是只是心。<\/strong> 悔改，要落在手上，落在行為上。<\/p><p>這裡有一個細節：這道令，是「王和大臣」頒的，但它的<strong>內容<\/strong>，與約拿所說的話，並不完全相同。約拿只說了「傾覆」，沒有說「回頭」。那麼，「回頭離開惡道」，是從哪裡來的？經文沒有說。我們只能說：<strong>神的話落在人的心上，人就知道該怎麼回應。<\/strong> 我們不替經文補上它沒有說的事。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>מִֽי יוֹדֵעַ יָשׁוּב וְנִחַם הָאֱלֹהִים וְשָׁב מֵחֲרוֹן אַפּוֹ וְלֹא נֹאבֵֽד׃<\/p><\/blockquote>","lit":"<blockquote><p>「或者神轉意後悔，不發烈怒，使我們不致滅亡，也未可知。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>知道<\/td><td>יוֹדֵעַ<\/td><td>yada<\/td><td>H3045<\/td><td>知道<\/td><\/tr><tr><td>轉意<\/td><td>יָשׁוּב<\/td><td>shuv<\/td><td>H7725<\/td><td>轉回<\/td><\/tr><tr><td>後悔<\/td><td>וְנִחַם<\/td><td>nacham<\/td><td>H5162<\/td><td>後悔、安慰、轉意<\/td><\/tr><tr><td>烈怒<\/td><td>מֵחֲרוֹן<\/td><td>charon<\/td><td>H2740<\/td><td>烈怒<\/td><\/tr><tr><td>怒<\/td><td>אַפּוֹ<\/td><td>af<\/td><td>H639<\/td><td>鼻、怒<\/td><\/tr><tr><td>滅亡<\/td><td>נֹאבֵֽד<\/td><td>avad<\/td><td>H6<\/td><td>滅亡<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>或者……也未可知<\/strong>：mi yode'a，字面是「誰知道呢？」。這四個字，是整座尼尼微城的神學：<strong>他們不知道神會不會憐憫，也不把憐憫當作權利。<\/strong> 在約珥書 2:14，同樣的四個字也出現。<\/p><p><strong>轉意後悔<\/strong>：yashuv venicham。<strong>shuv<\/strong>（轉回）與 <strong>nacham<\/strong>（後悔、轉意）連用，是神的行動：神「轉回」，神「後悔」。同一個動詞 shuv，3:8 是人回頭，這裡是神轉意；人轉，神也轉。<\/p><p><strong>烈怒<\/strong>：charon af，字面是「鼻子的熾熱」，是舊約描寫神怒的常用詞。<strong>滅亡<\/strong>（avad）在 1:6 船主也用過：「或者神顧念我們，使我們不致滅亡。」<\/p>","exp":"<p>這一節很短，卻是第三章最重要的一個問句：<strong>誰知道呢？<\/strong> 「或者神轉意後悔，不發烈怒，使我們不致滅亡，也未可知。」<\/p><p>注意尼尼微人的態度：他們<strong>沒有<\/strong>說「神一定會饒恕我們」。他們說：誰知道。<strong>他們把自己放在神的憐憫之下，而不是放在神的債務人之上。<\/strong> 這是真悔改的另一個記號：我不拿「我已經悔改了」，去要求神必須饒恕我；我把一切，交在神的手裡。<\/p><p>你也許記得，第一章，船主對約拿說了幾乎一樣的話：「或者神顧念我們，使我們不致滅亡。」（1:6）一位外邦的船主、一座外邦的城，都用「或者……」與神說話。而被差遣的先知，反而要到第四章，才說出他其實一開始就知道：神是有恩典、有憐憫的神（4:2）。<\/p>"},{"a":10,"z":10,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיַּרְא הָֽאֱלֹהִים אֶֽת מַעֲשֵׂיהֶם כִּי שָׁבוּ מִדַּרְכָּם הָרָעָה וַיִּנָּחֶם הָאֱלֹהִים עַל הָרָעָה אֲשֶׁר דִּבֶּר לַעֲשׂוֹת לָהֶם וְלֹא עָשָֽׂה׃<\/p><\/blockquote>","lit":"<blockquote><p>「於是神察看他們的行為，見他們離開惡道，他就後悔，不把所說的災禍降與他們了。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>察看<\/td><td>וַיַּרְא<\/td><td>ra'ah<\/td><td>H7200<\/td><td>看見<\/td><\/tr><tr><td>行為<\/td><td>מַעֲשֵׂיהֶם<\/td><td>ma'aseh<\/td><td>H4639<\/td><td>行為、作為<\/td><\/tr><tr><td>離開<\/td><td>שָׁבוּ<\/td><td>shuv<\/td><td>H7725<\/td><td>轉回<\/td><\/tr><tr><td>惡道<\/td><td>הָרָעָה<\/td><td>ra'ah<\/td><td>H7451<\/td><td>惡<\/td><\/tr><tr><td>後悔<\/td><td>וַיִּנָּחֶם<\/td><td>nacham<\/td><td>H5162<\/td><td>後悔<\/td><\/tr><tr><td>災禍<\/td><td>הָרָעָה<\/td><td>ra'ah<\/td><td>H7451<\/td><td>災禍、惡<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>神察看他們的行為<\/strong>：vayar ha'Elohim et-ma'asehem，「看見」（ra'ah）的受詞是 <strong>ma'aseh<\/strong>（作為、行為）。神看見的，不是禁食與麻衣本身，是「他們離開惡道」（shavu mi-darkam hara'ah）。<\/p><p><strong>惡<\/strong>：hara'ah，這節出現<strong>兩次<\/strong>，同一個字：人離開「惡道」，神後悔「<strong>所說的災禍<\/strong>」。字形完全一樣：他們離開他們的惡，神離開（對他們）的災。在這卷書裡，ra'ah 是追蹤字（1:2、7、8；3:8、10；4:1、2、6）。<\/p><p><strong>後悔<\/strong>：vayinnachem，與 3:9 同一個字根 nacham；同一個動詞，也是約拿在 4:2 引用神的屬性：「並且後悔不降所說的災。」<\/p>","exp":"<p><strong>這是整章的高潮，也是整卷書的樞紐：神就後悔，不把所說的災禍降與他們了。<\/strong> 一個先知所宣告的審判，被收回了。<\/p><p>這裡有兩個要點。第一，<strong>神看見的，是他們的行為<\/strong>，不是他們禁食的時間，也不是麻衣的粗糙。神看見的是：「離開惡道」。第二，<strong>同一個字 ra'ah<\/strong>：他們離開「惡」，神也轉離這個「災」。這個雙關，是希伯來文的設計：<strong>人離開惡，神就不降災；災與惡，是同一個字。<\/strong><\/p><p>但請留意，這一節是<strong>第四章的門口<\/strong>。下一節（4:1），經文只用一句話：「約拿大大不悅，並且發怒。」同一個字 ra'ah，這次落在約拿身上：<strong>他覺得，這是一件大惡事。<\/strong> 一個字，從尼尼微的惡，到神的災，到約拿心裡的不悅：這個字，貫穿全卷。<\/p>"}],"4":[{"a":1,"z":1,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֵּרַע אֶל יוֹנָה רָעָה גְדוֹלָה וַיִּחַר לֽוֹ׃<\/p><\/blockquote>","lit":"<blockquote><p>「這事約拿大大不悅，且甚發怒，」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>不悅<\/td><td>וַיֵּרַע<\/td><td>ra'a<\/td><td>H7489<\/td><td>惡、不好、不悅<\/td><\/tr><tr><td>惡<\/td><td>רָעָה<\/td><td>ra'ah<\/td><td>H7451<\/td><td>惡、災禍<\/td><\/tr><tr><td>大<\/td><td>גְדוֹלָה<\/td><td>gadol<\/td><td>H1419<\/td><td>大<\/td><\/tr><tr><td>發怒<\/td><td>וַיִּחַר<\/td><td>charah<\/td><td>H2734<\/td><td>發熱、發怒<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>約拿大大不悅<\/strong>：vayera el-Yonah ra'ah gedolah，字面是「這事對約拿是一件<strong>大惡事<\/strong>」。動詞 ra'a 與名詞 ra'ah 同字根：這事在約拿眼中是「惡」。ra'ah 是追蹤字，它在 1:2 是尼尼微的惡，在 3:8、10 是人離開的惡與神不降的災，到這裡，落在約拿身上。<\/p><p><strong>甚發怒<\/strong>：vayichar lo，字面是「他就發熱」，charah 是怒氣燒起來。前一句的「大」（gedolah）也是追蹤字：1:4 大風，1:10 大懼怕，1:16 大敬畏；現在是大惡、大不悅；4:6 是大喜樂；4:11 是大城。<\/p>","exp":"<p>全卷最短，也最重的一節：<strong>神不降災，約拿卻覺得這是一件大惡事。<\/strong> 同一個字，ra'ah。三章十節，神離開那個「災」；四章一節，約拿心裡出現了一個「惡」。尼尼微的惡，轉為神不降的災，神的不降災，卻成了約拿眼中的大惡。<\/p><p>你注意，經文沒有先說原因。它先讓我們看見：約拿<strong>生氣了<\/strong>。而且氣得很大。這個轉折，常常使第一次讀的人嚇一跳：一位剛剛被神救出魚腹的先知，一位剛剛見證了一座城回轉的先知，竟然在這個時候發怒。我們先不替約拿說話，也不急著責備他。這一節只做一件事：把第三章的歡喜，打斷了。<\/p>"},{"a":2,"z":2,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיִּתְפַּלֵּל אֶל יְהוָה וַיֹּאמַר אָנָּה יְהוָה הֲלוֹא זֶה דְבָרִי עַד הֱיוֹתִי עַל אַדְמָתִי עַל כֵּן קִדַּמְתִּי לִבְרֹחַ תַּרְשִׁישָׁה כִּי יָדַעְתִּי כִּי אַתָּה אֵֽל חַנּוּן וְרַחוּם אֶרֶךְ אַפַּיִם וְרַב חֶסֶד וְנִחָם עַל הָרָעָֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「就禱告耶和華說：耶和華啊，我在本國的時候豈不是這樣說嗎？我知道你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災，所以我急速逃往他施去。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>禱告<\/td><td>וַיִּתְפַּלֵּל<\/td><td>palal<\/td><td>H6419<\/td><td>禱告<\/td><\/tr><tr><td>知道<\/td><td>יָדַעְתִּי<\/td><td>yada<\/td><td>H3045<\/td><td>知道<\/td><\/tr><tr><td>有恩典<\/td><td>חַנּוּן<\/td><td>channun<\/td><td>H2587<\/td><td>有恩典的<\/td><\/tr><tr><td>有憐憫<\/td><td>וְרַחוּם<\/td><td>rachum<\/td><td>H7349<\/td><td>有憐憫的<\/td><\/tr><tr><td>不輕易發怒<\/td><td>אֶרֶךְ<\/td><td>erekh<\/td><td>H750<\/td><td>長<\/td><\/tr><tr><td>豐盛<\/td><td>וְרַב<\/td><td>rav<\/td><td>H7227<\/td><td>多、豐盛<\/td><\/tr><tr><td>慈愛<\/td><td>חֶסֶד<\/td><td>chesed<\/td><td>H2617<\/td><td>慈愛<\/td><\/tr><tr><td>後悔<\/td><td>וְנִחָם<\/td><td>nacham<\/td><td>H5162<\/td><td>後悔、轉意<\/td><\/tr><tr><td>急速<\/td><td>קִדַּמְתִּי<\/td><td>qiddam<\/td><td>H6923<\/td><td>搶先、預先<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>就禱告耶和華說<\/strong>：約拿書的第二次禱告（第一次是 2:1）。這次的稱呼是 <strong>annah YHWH<\/strong>（「耶和華啊，求你」），開口就是質問。<\/p><p><strong>有恩典、有憐憫、不輕易發怒、有豐盛的慈愛，並且後悔不降所說的災<\/strong>：這是出埃及記 34:6–7 神自己宣告的屬性，也是舊約反覆引用的信仰告白（民14:18；尼9:17；詩86:15；103:8；珥2:13）。約拿幾乎逐字引用：chanun verachum erekh appayim verav-chesed，最後加上 venicham al-hara'ah，「並且後悔不降災」。其中 <strong>chesed<\/strong>（慈愛）全卷只出現兩次：2:8 與這裡；<strong>nacham<\/strong>（後悔）是 3:9、10 的字，現在由約拿的口說出來。<\/p><p><strong>我急速逃往他施去<\/strong>：qiddamti livroach，qadam 的本意是「搶先、預先」：我是<strong>搶在前面<\/strong>，去逃。<\/p>","exp":"<p>這一節，終於揭開了第一章的謎。為什麼約拿逃？<strong>不是因為怕尼尼微人，而是因為他認識神。<\/strong> 他說：我知道你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災。所以我搶先，逃往他施。<\/p><p>請你留意這個畫面：約拿引用的，是以色列人最寶貴的信仰告白，是出埃及記 34 章，神在西奈山上向摩西宣告的自己的名字。這句話，是以色列人在悔改時最常用來向神求恩的話。可是在約拿口中，這句話變成了<strong>抱怨<\/strong>：我知道你會這樣，所以我才不想去。<\/p><p>這裡有一個深刻的提醒：<strong>一個人可以非常準確地認識神，卻不歡喜神的心。<\/strong> 約拿的神學，一個字都不錯；他的心，卻在這個告白裡，和神的心站在不同的地方。這一節不是只在說約拿，它也在問我們：我所相信的神的慈愛，我是不是也願意，讓它臨到我所不喜歡的人？<\/p>"},{"a":3,"z":4,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וְעַתָּה יְהוָה קַח נָא אֶת נַפְשִׁי מִמֶּנִּי כִּי טוֹב מוֹתִי מֵחַיָּֽי׃ וַיֹּאמֶר יְהוָה הַהֵיטֵב חָרָה לָֽךְ׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華啊，現在求你取我的命吧！因為我死了比活著還好。耶和華說：你這樣發怒合乎理嗎？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>取<\/td><td>קַח<\/td><td>laqach<\/td><td>H3947<\/td><td>取、拿去<\/td><\/tr><tr><td>性命<\/td><td>נַפְשִׁי<\/td><td>nefesh<\/td><td>H5315<\/td><td>性命、魂<\/td><\/tr><tr><td>好<\/td><td>טוֹב<\/td><td>tov<\/td><td>H2896<\/td><td>好<\/td><\/tr><tr><td>死<\/td><td>מוֹתִי<\/td><td>mavet<\/td><td>H4194<\/td><td>死<\/td><\/tr><tr><td>合乎理<\/td><td>הַהֵיטֵב<\/td><td>yatav<\/td><td>H3190<\/td><td>好、合宜<\/td><\/tr><tr><td>發怒<\/td><td>חָרָה<\/td><td>charah<\/td><td>H2734<\/td><td>發怒、發熱<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>求你取我的命吧<\/strong>：qach-na et-nafshi mimmeni，字面是「求你把我的性命，從我這裡取走」。nafshi（我的性命、我的魂）在 2:7 是「我心」；那時約拿的魂在發昏，他想念耶和華，如今他請神取走它。<\/p><p><strong>我死了比活著還好<\/strong>：tov moti mechayyai，這句話在 4:8 與 4:9 的「以致於死」再出現；摩西（民11:15）與以利亞（王上19:4）在重壓之下，也曾向神求死。<\/p><p><strong>合乎理嗎<\/strong>：hahetev charah lakh，字面是「發怒對你是好的嗎？」yatav（好、合宜）是動詞「好」的一種形式，也可以譯為「這樣發怒，是對的嗎」。神問的是一個問句，<strong>沒有責備，也沒有答案<\/strong>。<\/p>","exp":"<p>約拿的第一個反應，是求死：<strong>求你取我的命吧<\/strong>。這一句，我們要特別小心地聽。<\/p><p>它不是一個玩笑，也不是一個榜樣。<strong>在聖經裡，摩西求過死（民11:15），以利亞也求過死（王上19:4）<\/strong>，兩個人都在疲憊、失望與重壓裡。神對他們的回應，不是責備，而是：給他們餅與水，給他們睡覺，給他們一個安靜的聲音。這一節的重點，不是約拿「配不配」求死，而是：<strong>神怎樣回應一個求死的人。<\/strong><\/p><p>神的回應，只有一個問句：<strong>你這樣發怒合乎理嗎？<\/strong> 注意，這不是一個定罪的問句，也不是一個答案。這是一個邀請，邀請約拿自己，把他的怒氣看一看。約拿沒有回答。經文接下來說：他出城去了。<strong>神的問，是慈愛的問，它沒有逼迫，它等待。<\/strong><\/p>"},{"a":5,"z":5,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֵּצֵא יוֹנָה מִן הָעִיר וַיֵּשֶׁב מִקֶּדֶם לָעִיר וַיַּעַשׂ לוֹ שָׁם סֻכָּה וַיֵּשֶׁב תַּחְתֶּיהָ בַּצֵּל עַד אֲשֶׁר יִרְאֶה מַה יִּהְיֶה בָּעִֽיר׃<\/p><\/blockquote>","lit":"<blockquote><p>「於是約拿出城，坐在城的東邊，在那裡為自己搭了一座棚，坐在棚的蔭下，要看看那城究竟如何。」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>出<\/td><td>וַיֵּצֵא<\/td><td>yatsa<\/td><td>H3318<\/td><td>出去<\/td><\/tr><tr><td>坐<\/td><td>וַיֵּשֶׁב<\/td><td>yashav<\/td><td>H3427<\/td><td>坐、居住<\/td><\/tr><tr><td>東邊<\/td><td>מִקֶּדֶם<\/td><td>qedem<\/td><td>H6924<\/td><td>東、前面<\/td><\/tr><tr><td>棚<\/td><td>סֻכָּה<\/td><td>sukkah<\/td><td>H5521<\/td><td>棚、帳棚<\/td><\/tr><tr><td>蔭<\/td><td>בַּצֵּל<\/td><td>tsel<\/td><td>H6738<\/td><td>影子、蔭<\/td><\/tr><tr><td>看<\/td><td>יִרְאֶה<\/td><td>ra'ah<\/td><td>H7200<\/td><td>看見<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>出城，坐在城的東邊<\/strong>：vayetse... vayeshev miqqedem la'ir，約拿離開城，坐下；「坐」（yashav）在 3:6 是尼尼微王坐在灰中，這裡是約拿坐在棚下。<\/p><p><strong>為自己搭了一座棚<\/strong>：sukkah 是臨時的棚。<strong>蔭<\/strong>（tsel）在下一節的蓖麻「影兒」（tsel），兩次都是同一個字。<\/p><p><strong>要看看那城究竟如何<\/strong>：ad asher yire mah yihyeh ba'ir，字面是「直到他看見，城裡將會怎樣」。<\/p>","exp":"<p>神的問句沒有被回答。約拿<strong>出城<\/strong>了，<strong>坐下<\/strong>了，<strong>搭了一座棚<\/strong>，<strong>要看看那城究竟如何<\/strong>。<\/p><p>這一節有一個很安靜的畫面：一個人，坐在城外，看著一座城。你注意「為自己搭了一座棚」，約拿想要自己預備一個蔭，自己預備一個安全的位置。他沒有說他要什麼；經文只說，他要<strong>看<\/strong>。是希望看見那城被毀，還是在等待、觀望，還是在看神到底要怎麼做？經文沒有說。<strong>我們不替經文補上它沒有說的心思。<\/strong><\/p><p>有一件事是確定的：<strong>他把自己，放在了「旁觀者」的位置。<\/strong> 在第三章裡，所有人都「起來」了；在這一章，約拿「坐下」了。你有沒有發現，我們有時候也這樣：看著別人蒙恩，坐在城外，看。<\/p>"},{"a":6,"z":8,"star":2,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיְמַן יְהוָֽה אֱלֹהִים קִיקָיוֹן וַיַּעַל מֵעַל לְיוֹנָה לִֽהְיוֹת צֵל עַל רֹאשׁוֹ לְהַצִּיל לוֹ מֵרָֽעָתוֹ וַיִּשְׂמַח יוֹנָה עַל הַקִּֽיקָיוֹן שִׂמְחָה גְדוֹלָֽה׃ וַיְמַן הָֽאֱלֹהִים תּוֹלַעַת בַּעֲלוֹת הַשַּׁחַר לַֽמָּחֳרָת וַתַּךְ אֶת הַקִּֽיקָיוֹן וַיִּיבָֽשׁ׃ וַיְהִי כִּזְרֹחַ הַשֶּׁמֶשׁ וַיְמַן אֱלֹהִים רוּחַ קָדִים חֲרִישִׁית וַתַּךְ הַשֶּׁמֶשׁ עַל רֹאשׁ יוֹנָה וַיִּתְעַלָּף וַיִּשְׁאַל אֶת נַפְשׁוֹ לָמוּת וַיֹּאמֶר טוֹב מוֹתִי מֵחַיָּֽי׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華神安排一棵蓖麻，使其發生高過約拿，影兒遮蓋他的頭，救他脫離苦楚；約拿因這棵蓖麻大大喜樂。次日黎明，神卻安排一條蟲子咬這蓖麻，以致枯槁。日頭出來的時候，神安排炎熱的東風，日頭曝曬約拿的頭，使他發昏，他就為自己求死，說：我死了比活著還好！」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>安排<\/td><td>וַיְמַן<\/td><td>manah<\/td><td>H4487<\/td><td>安排、預備<\/td><\/tr><tr><td>蓖麻<\/td><td>קִיקָיוֹן<\/td><td>qiqayon<\/td><td>H7021<\/td><td>蓖麻（植物）<\/td><\/tr><tr><td>救<\/td><td>לְהַצִּיל<\/td><td>natsal<\/td><td>H5337<\/td><td>拯救<\/td><\/tr><tr><td>苦楚<\/td><td>מֵרָֽעָתוֹ<\/td><td>ra'ah<\/td><td>H7451<\/td><td>惡、苦楚<\/td><\/tr><tr><td>喜樂<\/td><td>שִׂמְחָה<\/td><td>simchah<\/td><td>H8057<\/td><td>喜樂<\/td><\/tr><tr><td>蟲子<\/td><td>תּוֹלַעַת<\/td><td>tola'at<\/td><td>H8438<\/td><td>蟲<\/td><\/tr><tr><td>咬<\/td><td>וַתַּךְ<\/td><td>nakah<\/td><td>H5221<\/td><td>擊打、咬<\/td><\/tr><tr><td>東風<\/td><td>קָדִים<\/td><td>qadim<\/td><td>H6921<\/td><td>東、東風<\/td><\/tr><tr><td>發昏<\/td><td>וַיִּתְעַלָּף<\/td><td>ataf<\/td><td>H5968<\/td><td>昏厥、衰弱<\/td><\/tr><tr><td>求死<\/td><td>לָמוּת<\/td><td>mut<\/td><td>H4191<\/td><td>死<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>安排<\/strong>：vayman（動詞 manah）。這個字全卷四次，主詞都是神：安排大魚（1:17）、安排蓖麻（4:6）、安排蟲子（4:7）、安排東風（4:8）。本章三次，每一次都是不同的受造物，每一次都是為了同一個對象：約拿。<\/p><p><strong>耶和華神<\/strong>：YHWH Elohim，把「耶和華」與「神」連用作稱呼，全卷只有 4:6 這一處；其餘各處，不是單用「耶和華」，就是單用「神」。<\/p><p><strong>救他脫離苦楚<\/strong>：lehatsil lo mera'ato，<strong>ra'ah<\/strong>（惡、苦楚）又出現了。蓖麻是為了救他脫離他的「ra'ah」；也就是 4:1 那個「大惡」。<strong>大喜樂<\/strong>：simchah gedolah，是全卷約拿<strong>唯一一次<\/strong>的喜樂，與 4:1 的「大惡」相對。<\/p><p><strong>東風<\/strong>：ruach qadim charishit，qadim 是「東」，charishit 的意思不確定（炎熱、靜止或其他）；和合本採「炎熱」。<strong>求死<\/strong>：vayish'al et-nafsho lamut，與 4:3 同樣的話。<\/p>","exp":"<p>這一段，是神親手做的三次「安排」：蓖麻，蟲子，東風。每一次，都是<strong>耶和華神<\/strong>自己做的。<\/p><p>第一次，是<strong>恩典<\/strong>：神安排一棵蓖麻，長得比約拿還高，影兒遮蓋他的頭，<strong>救他脫離苦楚<\/strong>。這是約拿書裡，約拿<strong>唯一一次<\/strong>的大喜樂：「約拿因這棵蓖麻大大喜樂。」他為一棵植物歡喜，卻沒有為一座城歡喜。第二次，是<strong>失去<\/strong>：神安排一條蟲子，在次日黎明，咬這蓖麻，枯槁了。第三次，是<strong>重壓<\/strong>：神安排炎熱的東風，日頭曝曬約拿的頭，他發昏，<strong>再次求死<\/strong>。<\/p><p>請你看這三次安排的<strong>目的<\/strong>：<strong>不是為了折磨約拿。<\/strong> 蓖麻是來<strong>救他<\/strong>的；蟲子與東風，是要把他帶到一個地方：他為一棵不是他栽種的植物，那麼痛。神不是在懲罰，<strong>神是在準備一個問題<\/strong>。祂把約拿帶到那個，他能親自感覺到「我捨不得」的地方。<\/p>"},{"a":9,"z":9,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמֶר אֱלֹהִים אֶל יוֹנָה הַהֵיטֵב חָרָֽה לְךָ עַל הַקִּֽיקָיוֹן וַיֹּאמֶר הֵיטֵב חָֽרָה לִי עַד מָֽוֶת׃<\/p><\/blockquote>","lit":"<blockquote><p>「神對約拿說：你因這棵蓖麻發怒合乎理嗎？他說：我發怒以至於死，都合乎理！」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>合乎理<\/td><td>הַהֵיטֵב<\/td><td>yatav<\/td><td>H3190<\/td><td>好、合宜<\/td><\/tr><tr><td>發怒<\/td><td>חָרָֽה<\/td><td>charah<\/td><td>H2734<\/td><td>發怒<\/td><\/tr><tr><td>蓖麻<\/td><td>הַקִּֽיקָיוֹן<\/td><td>qiqayon<\/td><td>H7021<\/td><td>蓖麻<\/td><\/tr><tr><td>以致於死<\/td><td>מָֽוֶת<\/td><td>mavet<\/td><td>H4194<\/td><td>死<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>你因這棵蓖麻發怒合乎理嗎？<\/strong>：hahetev charah lekha al-haqiqayon，與 4:4 的問句相同，只是加上了「因這棵蓖麻」（al-haqiqayon）。4:4 神問「你這樣發怒」；這一次，神把怒氣的<strong>對象<\/strong>，指了出來。<\/p><p><strong>我發怒以至於死，都合乎理！<\/strong>：heitev charah li ad-mavet，約拿的回答，與神的問句<strong>同樣的字<\/strong>：hetev charah。他把神的問句，原樣還給神。這是約拿書裡，約拿<strong>第一次直接回答神的問題<\/strong>。<\/p>","exp":"<p>神問了第二次：<strong>你因這棵蓖麻發怒，合乎理嗎？<\/strong> 這一次，約拿回答了。他說：<strong>合乎理！<\/strong> 我發怒，以至於死，都合乎理。<\/p><p>你注意，約拿用的字，與神問他的字，是同一個。<strong>他沒有迴避，沒有說「我不知道」，他說：是的，我就是這樣認為的。<\/strong> 這是整卷書裡，最誠實的一句話之一。<\/p><p>這一節很重要，因為神<strong>在等這個回答<\/strong>。一個人不先說出自己的怒氣，就不能真正被問。<strong>神先讓約拿說出口，然後才問他下一個問題。<\/strong> 這是神對待人的方式：不是壓下去，是讓人說出來，然後再一起面對。這也提醒我們：<strong>誠實，是被神改變的開始。<\/strong> 約拿的回答，也許不合乎神的心意，但它是真的，而神可以使用真的話。<\/p>"},{"a":10,"z":11,"star":3,"grk":"<blockquote dir=\"rtl\" lang=\"he\"><p>וַיֹּאמֶר יְהוָה אַתָּה חַסְתָּ עַל הַקִּיקָיוֹן אֲשֶׁר לֹא עָמַלְתָּ בּוֹ וְלֹא גִדַּלְתּוֹ שֶׁבִּן לַיְלָה הָיָה וּבִן לַיְלָה אָבָֽד׃ וַֽאֲנִי לֹא אָחוּס עַל נִינְוֵה הָעִיר הַגְּדוֹלָה אֲשֶׁר יֶשׁ בָּהּ הַרְבֵּה מִֽשְׁתֵּים עֶשְׂרֵה רִבּוֹ אָדָם אֲשֶׁר לֹֽא יָדַע בֵּין יְמִינוֹ לִשְׂמֹאלוֹ וּבְהֵמָה רַבָּֽה׃<\/p><\/blockquote>","lit":"<blockquote><p>「耶和華說：這蓖麻不是你栽種的，也不是你培養的；一夜發生，一夜乾死，你尚且愛惜；何況這尼尼微大城，其中不能分辨左手右手的有十二萬多人，並有許多牲畜，我豈能不愛惜呢？」<\/p><\/blockquote>","key":"<table><thead><tr class=\"header\"><th>中文<\/th><th>原文<\/th><th>音譯<\/th><th>Strong's<\/th><th>意義<\/th><\/tr><\/thead><tbody><tr><td>愛惜<\/td><td>חַסְתָּ<\/td><td>chus<\/td><td>H2347<\/td><td>愛惜、憐惜<\/td><\/tr><tr><td>勞苦<\/td><td>עָמַלְתָּ<\/td><td>amal<\/td><td>H5998<\/td><td>勞苦、辛苦<\/td><\/tr><tr><td>培養<\/td><td>גִדַּלְתּוֹ<\/td><td>gadal<\/td><td>H1431<\/td><td>長大、培養<\/td><\/tr><tr><td>一夜<\/td><td>לַיְלָה<\/td><td>laylah<\/td><td>H3915<\/td><td>夜<\/td><\/tr><tr><td>萬<\/td><td>רִבּוֹ<\/td><td>ribbo<\/td><td>H7239<\/td><td>萬<\/td><\/tr><tr><td>十二萬<\/td><td>מִֽשְׁתֵּים<\/td><td>shteim<\/td><td>H8147<\/td><td>二<\/td><\/tr><tr><td>左手右手<\/td><td>לִשְׂמֹאלוֹ<\/td><td>semol<\/td><td>H8040<\/td><td>左<\/td><\/tr><tr><td>牲畜<\/td><td>וּבְהֵמָה<\/td><td>behemah<\/td><td>H929<\/td><td>牲畜<\/td><\/tr><tr><td>許多<\/td><td>רַבָּֽה<\/td><td>rav<\/td><td>H7227<\/td><td>多<\/td><\/tr><\/tbody><\/table>","gram":"<p><strong>愛惜<\/strong>：chus，是「憐惜、不忍心」，第 10 節用在約拿身上（你尚且愛惜），第 11 節用在神身上（我豈能不愛惜）。這個字在全書只出現這兩次，是約拿書的最後一個動詞。<\/p><p><strong>不是你栽種的，也不是你培養的；一夜發生，一夜乾死<\/strong>：lo amalta bo velo giddaltu，shebin-laylah hayah uvin-laylah avad，字面是「是一夜的兒子，一夜的兒子就滅亡了」。<\/p><p><strong>十二萬多人<\/strong>：shteim esreh ribbo，字面是「十二個萬」。<strong>不能分辨左手右手<\/strong>：歷來有兩種理解：一是指年幼的孩子；二是指在道德上沒有分別能力的人。本講義不裁定，兩種都指向：這些人，是尚不知道的人。<strong>並有許多牲畜<\/strong>：uvehemah rabbah，全書最後兩個字是 behemah rabbah（許多牲畜）。<\/p>","exp":"<p>全書最後兩節，是一個<strong>沒有答案的問句<\/strong>。<\/p><p>神說：這蓖麻，不是你栽種的，也不是你培養的，一夜發生，一夜乾死，<strong>你尚且愛惜<\/strong>；何況這尼尼微大城，其中有十二萬多人，不能分辨左手右手，<strong>並有許多牲畜，我豈能不愛惜呢？<\/strong><\/p><p>這是一個<strong>由小到大<\/strong>的論證：你為一棵你沒有勞苦過的植物心疼，我為我所造、我所看顧的這些人，難道不心疼嗎？神沒有罵約拿「你沒有愛心」。祂只是，把約拿自己的<strong>心<\/strong>，指給他看：<strong>你看，你也會捨不得。<\/strong> 然後，祂把這個「捨不得」，放大到一座城，放大到十二萬人，連牲畜也算在裡面。<\/p><p>然後，書卷就結束了。<strong>約拿有沒有回答，沒有說。<\/strong> 他有沒有起來，沒有說。這不是作者沒有寫完，而是作者把這個問句，<strong>交到每一個讀者手上<\/strong>。我們不替經文補上結局，不替約拿回答。我們只聽見那個問題：<strong>我豈能不愛惜呢？<\/strong> 這是約拿書的最高點，也是整本書的重量所在。<\/p>"}]},"serm":{"1":{"min":12,"blocks":[["h","《你起來往尼尼微大城去》"],["p","弟兄姊妹平安。"],["p","今天我們讀約拿書第一章。"],["p","先問一個問題。"],["p","你有沒有買過一張票？"],["p","你很清楚，那不是你該去的方向。"],["p","可是你還是買了。"],["p","沒有吵架。"],["p","沒有大聲說「我不去」。"],["p","只是很安靜地，轉過身。"],["p","約拿，就是這樣的人。"],["h","一、神的差遣"],["q","耶和華的話臨到亞米太的兒子約拿，說：（拿1:1）"],["q","你起來往尼尼微大城去，向其中的居民呼喊，因為他們的惡達到我面前。（拿1:2）"],["p","你看第一句。"],["p","耶和華的話，臨到約拿。"],["p","不是約拿去找神。"],["p","是神的話，先來找他。"],["p","神先開口。"],["p","這是整本聖經的開頭方式。"],["p","不是人，爬上去找神。"],["p","是神，走下來，說話。"],["p","先知，不是自己想出一個使命。"],["p","他只是，被一句話，抓住了。"],["p","所以，先知是怎樣的人？"],["p","他是，一個聽見的人。"],["p","聽見，在說話以前。"],["p","人在後面。"],["p","這一節裡有三個動作。"],["p","起來。"],["p","去。"],["p","呼喊。"],["p","「起來」，是希伯來文 qum。"],["p","這個字，在這卷書要走很遠。"],["p","神叫他往哪裡去？"],["p","尼尼微大城。"],["p","經文只用一個字介紹它：大。"],["p","這個「大」，一直到最後一節還會再出現。"],["p","尼尼微，是一座大城。"],["p","人很多。街很長。"],["p","有買賣，有宮殿，有數不清的人家。"],["p","神看這座城的時候，看見的是什麼？"],["p","是一座城。"],["p","約拿心裡的尼尼微，是敵人。"],["p","神眼中的尼尼微，是一座有人的大城。"],["p","這一點，要先記住。"],["p","你可以想一想。"],["p","如果有一天，神叫你去一個地方。"],["p","那裡的人，你不喜歡。"],["p","甚至，你有一點怕。"],["p","你會怎麼想？"],["p","你可能會說，神啊，換一個人吧。"],["p","你可能會說，等我預備好了再去。"],["p","約拿的難處，不是他不知道神的話。"],["p","是他太清楚了。"],["p","太清楚這個命令，會把他帶到哪裡。"],["p","有時候，我們逃的，不是神。"],["p","是神要帶我們去的那個地方。"],["p","為什麼要去？"],["p","因為他們的惡，達到神的面前。"],["p","惡，是往上走的。"],["p","一直上到神的面前。"],["p","注意。"],["p","神差他，是去「呼喊」。"],["p","不是去毀滅。"],["p","呼喊，是給人聽見的機會。"],["q","約拿卻起來，逃往他施去躲避耶和華；下到約帕，遇見一隻船，要往他施去。他就給了船價，上了船，要與船上的人同往他施去躲避耶和華。（拿1:3）"],["p","可是約拿怎麼做？"],["p","他也起來了。"],["p","同一個字。"],["p","同一個動作。"],["p","方向相反。"],["p","他逃往他施。"],["p","他施，是最遠的地方。"],["p","和尼尼微，剛好相反。"],["p","然後呢？"],["p","他下到約帕。"],["p","他給了船價。"],["p","他上了船。"],["p","你看，逃跑，是要花錢的。"],["p","逃，也不一定是狂奔。"],["p","有時候，只是買一張船票。"],["p","經文說了兩次：「躲避耶和華」。"],["p","一頭一尾，夾住整節。"],["p","還有一個方向。"],["p","他一直往下走。"],["p","下到約帕。"],["p","下到船裡。"],["p","後面還要下到底艙。"],["p","再後面，下到山根。"],["p","離開本位的路，總是往下走。"],["p","這一點，我們都懂。"],["p","離開了該站的位置，人就會往下。"],["p","下到一個看起來比較安全的地方。"],["p","下到一個沒有人找得到的地方。"],["p","可是神的話，還在上面。"],["p","惡，在上面。"],["p","神的面，在上面。"],["p","他一直往下。"],["p","卻一直，沒有離開神的面前。"],["h","二、沉睡的先知"],["q","然而耶和華使海中起大風，海就狂風大作，甚至船幾乎破壞。（拿1:4）"],["q","水手便懼怕，各人哀求自己的神。他們將船上的貨物拋在海中，為要使船輕些。約拿已下到底艙，躺臥沉睡。（拿1:5）"],["p","可是神沒有放手。"],["p","耶和華使海中起大風。"],["p","你看這個動詞。"],["p","不是「起」。"],["p","是「擲」。"],["p","神把大風，擲出來。"],["p","船幾乎要破壞。"],["p","你有沒有坐過遇到亂流的飛機？"],["p","杯子在抖。"],["p","大家不說話。"],["p","有人開始禱告。"],["p","外邦的水手，也禱告。"],["p","各人，求自己的神。"],["p","他們不認識耶和華。"],["p","可是他們知道，風大到，人沒有辦法。"],["p","水手開始害怕。"],["p","每個人，都哀求自己的神。"],["p","他們把貨物拋進海裡。"],["p","全船的人，都醒著。"],["p","都忙著。"],["p","都在盡力。"],["p","你看這一船人。"],["p","他們做了所有，人能做的事。"],["p","禱告。"],["p","減輕船的重量。"],["p","盡力。"],["p","沒有一件，是壞事。"],["p","可是風，沒有停。"],["p","人的努力，有它的用處。"],["p","也有它，到不了的地方。"],["p","風浪的根，不在貨物。"],["p","在底艙裡，那個人的身上。"],["p","那約拿呢？"],["p","他已下到底艙。"],["p","躺下。"],["p","沉睡。"],["p","先知，睡著了。"],["p","別嘲笑他。"],["p","我們也有這樣的時候。"],["p","逃到最後。"],["p","最累的人，常常是最先睡著的人。"],["p","我們也會用「睡」，來躲。"],["p","用忙。"],["p","用手機。"],["p","用看起來很平靜的日子。"],["p","睡，是最安靜的逃。"],["p","外面風浪再大。"],["p","只要心裡不醒著，就好像沒事。"],["p","可是你看，風浪，不看你睡不睡。"],["p","風，是神擲出來的。"],["p","它不會因為你閉上眼睛，就停下來。"],["p","有時候，神的愛，是很不安靜的。"],["p","祂寧可讓風大一點。"],["p","也不願意，讓你一直這樣睡下去。"],["q","船主到他那裡對他說：你這沉睡的人哪，為何這樣呢？起來，求告你的神，或者神顧念我們，使我們不致滅亡。（拿1:6）"],["p","然後，反轉來了。"],["p","船主走到他那裡。"],["p","你這沉睡的人哪，為何這樣呢？"],["p","起來，求告你的神。"],["p","你聽出來了嗎？"],["p","這是神在 1:2 說過的話。"],["p","「起來。呼喊。」"],["p","現在，從一位外邦船主的嘴裡說出來。"],["p","本來該對別人說這句話的人。"],["p","現在，被別人這樣叫醒。"],["p","弟兄姊妹。"],["p","你有沒有被誰叫醒過？"],["p","也許是一位同事。"],["p","也許是一個不太信的朋友。"],["p","也許是孩子一句話。"],["p","他說的，不是什麼大道理。"],["p","可是你聽了，就醒了。"],["p","神可以用任何人。"],["p","包括一位外邦的船主。"],["p","我們不要看輕，被神用來叫醒我們的人。"],["p","還有一件事，要看清楚。"],["p","船主，並沒有給約拿，任何神學。"],["p","他只說了兩句話。"],["p","你為何這樣呢？"],["p","起來，求告你的神。"],["p","一句，是問。"],["p","一句，是邀請。"],["p","他沒有說，你是個罪人。"],["p","他沒有說，你快悔改。"],["p","問一個人，你為何這樣。"],["p","有時候，比講一百個道理，更能叫醒他。"],["q","船上的人彼此說：來吧，我們掣籤，看看這災臨到我們是因誰的緣故。於是他們掣籤，掣出約拿來。（拿1:7）"],["q","眾人對他說：請你告訴我們，這災臨到我們是因誰的緣故？你以何事為業？你從哪裡來？你是哪一國？屬哪一族的人？（拿1:8）"],["q","他說：我是希伯來人。我敬畏耶和華－那創造滄海旱地之天上的神。（拿1:9）"],["p","後來，掣籤。"],["p","籤，落在約拿身上。"],["p","我們不教人，用這個方法，找神的旨意。"],["p","經文只說，籤，落在約拿身上。"],["p","水手，那時候，不認識耶和華。"],["p","他們只有，他們的辦法。"],["p","可是，神，使用了。"],["p","神可以，從人的方式，進到人的處境裡。"],["p","水手問了他一連串的問題。"],["p","你做什麼的？"],["p","你從哪裡來？"],["p","你是哪一國的人？"],["p","他怎麼回答？"],["p","我是希伯來人。"],["p","我敬畏耶和華。"],["p","那創造滄海旱地之天上的神。"],["p","這是一句很正確的話。"],["p","也是一句很扎心的話。"],["p","他說，他敬畏造海的神。"],["p","可是他，正在往海上逃。"],["p","知道，是一回事。"],["p","活在知道裡面，是另一回事。"],["q","他們就大大懼怕，對他說：你做的是甚麼事呢？他們已經知道他躲避耶和華，因為他告訴了他們。（拿1:10）"],["p","水手聽了，就大大懼怕。"],["p","你做的是甚麼事呢？"],["p","這句話，是質問。"],["p","也是驚嘆。"],["p","一個背對神的人，嘴裡仍然可以說出最真的話。"],["p","這是約拿的難處。"],["p","經文的話，有一種距離。"],["p","是口，和腳之間的距離。"],["p","口說：我敬畏。"],["p","腳說：我往海上去。"],["p","這個距離，不是一天造成的。"],["p","是一次一次，話說對了，路卻沒有走對。"],["p","今天，神不是要責備你。"],["p","祂只是要你看見，你的口，和你的腳。"],["p","也是我們的。"],["p","你自己，有沒有這樣的一個距離？"],["p","禱告的時候，說得很好。"],["p","行動的時候，又是另一回事。"],["p","你的口，在說什麼？"],["p","你的腳，在往哪裡去？"],["p","不必急著回答。"],["p","只要在神面前，誠實地，看一看。"],["h","三、拋下與接住"],["q","他們問他說：我們當向你怎樣行，使海浪平靜呢？這話是因海浪越發翻騰。（拿1:11）"],["q","他對他們說：你們將我抬起來，拋在海中，海就平靜了；我知道你們遭這大風是因我的緣故。（拿1:12）"],["p","水手問：我們該怎麼辦？"],["p","約拿說了一句話。"],["p","這是他在這一章，最誠實的一句。"],["p","把我拋在海中。"],["p","因為，我知道。"],["p","你們遭這大風，是因我的緣故。"],["p","他沒有說「我悔改」。"],["p","他只是說：是因我。"],["p","很短。"],["p","但是很真。"],["p","承認，不是悔改的全部。"],["p","可是承認，是悔改的門。"],["p","他還沒有說，我要回去。"],["p","但他，已經不再說，那是別人的事。"],["p","有時候，我們差的，只是，這一句。"],["p","是因我。"],["p","不是，是因為你。"],["p","不是，是環境。"],["p","是因我。"],["q","然而那些人竭力盪槳，要把船攏岸，卻是不能，因為海浪越發向他們翻騰。（拿1:13）"],["q","他們便求告耶和華說：耶和華啊，我們懇求你，不要因這人的性命使我們死亡，不要使流無辜血的罪歸與我們；因為你－耶和華是隨自己的意旨行事。（拿1:14）"],["p","水手沒有馬上照做。"],["p","他們竭力盪槳。"],["p","想把船攏岸。"],["p","不要把一個人拋下去。"],["p","你看。"],["p","這一船外邦人，比先知更不願意讓一個人死。"],["p","後來，實在不能了。"],["p","他們才求告耶和華。"],["p","這是他們第一次，用祂的名字。"],["p","耶和華啊，我們懇求你。"],["p","不要因這人的性命，使我們死亡。"],["p","不要使流無辜血的罪，歸與我們。"],["p","他們怕的，是罪。"],["p","不只是風。"],["p","這一群水手，其實很可愛。"],["p","他們不認識神。"],["p","可是，他們有一個很深的直覺。"],["p","人命，是重的。"],["p","不能因為我要平安，就把別人丟進海裡。"],["p","連一個沒聽過耶和華的人。"],["p","也知道，不可以輕看一個人的性命。"],["p","不只是風。"],["p","這是一幅很美的畫。"],["p","一

["p","邀請約拿，自己，看一看自己的怒氣。"],["p","約拿，沒有回答。"],["p","他出城去了。"],["p","神的問，是慈愛的問。"],["p","它沒有逼迫。"],["p","它等待。"],["p","你可以想想。"],["p","一個在氣頭上的人，被問一句，你這樣發怒，合乎理嗎？"],["p","通常會怎麼樣？"],["p","我們會頂回去。"],["p","會說，當然合乎理。"],["p","可是神，沒有反駁約拿。"],["p","也沒有說，你錯了。"],["p","祂只是問。"],["p","把問題，交還給他。"],["p","約拿，沒有回答。"],["p","神，也沒有再追。"],["p","祂讓他自己，坐下來，想。"],["h","三、坐在城的東邊"],["q","於是約拿出城，坐在城的東邊，在那裡為自己搭了一座棚，坐在棚的蔭下，要看看那城究竟如何。（拿4:5）"],["p","約拿出了城。"],["p","坐在城的東邊。"],["p","為自己，搭了一座棚。"],["p","坐在棚的蔭下。"],["p","要看看，那城究竟如何。"],["p","你有沒有發現？"],["p","第三章，所有的人，都起來了。"],["p","約拿起來。"],["p","尼尼微人起來。"],["p","王，也起來了。"],["p","這一章，只有一個人，坐下了。"],["p","他把自己，放在旁觀者的位置。"],["p","為自己，預備一個蔭。"],["p","看。"],["p","他在看什麼？"],["p","經文，沒有說。"],["p","我們，不替經文補上，它沒有說的心思。"],["p","可是，我們都知道。"],["p","有時候，我們也這樣。"],["p","看著別人蒙恩。"],["p","坐在城外。"],["p","看。"],["p","旁觀者，最容易，覺得自己是對的。"],["p","因為我沒有在裡面。"],["p","我不必弄髒手。"],["p","我只要，坐在棚下。"],["p","看他們，會不會又回去。"],["p","可是，神的問題，不會留在城外。"],["p","它，會走到，棚下。"],["p","走到，那個，最安靜的人面前。"],["h","四、三次安排"],["q","耶和華神安排一棵蓖麻，使其發生高過約拿，影兒遮蓋他的頭，救他脫離苦楚；約拿因這棵蓖麻大大喜樂。（拿4:6）"],["q","次日黎明，神卻安排一條蟲子咬這蓖麻，以致枯槁。（拿4:7）"],["q","日頭出來的時候，神安排炎熱的東風，日頭曝曬約拿的頭，使他發昏，他就為自己求死，說：我死了比活著還好！（拿4:8）"],["p","然後，神做了三件事。"],["p","第一件。"],["p","耶和華神，安排一棵蓖麻。"],["p","長得，比約拿還高。"],["p","影兒，遮蓋他的頭。"],["p","救他，脫離苦楚。"],["p","約拿，因這棵蓖麻，大大喜樂。"],["p","你知道嗎？"],["p","這是整卷書，約拿唯一的一次，大喜樂。"],["p","他為一棵植物，歡喜。"],["p","卻沒有為一座城，歡喜。"],["p","這句話，很重。"],["p","一棵蓖麻，使他大喜樂。"],["p","一座城的得救，卻使他大不悅。"],["p","他的喜樂，是什麼？"],["p","是蔭涼。"],["p","是，對他自己，有好處的。"],["p","他的怒氣，是什麼？"],["p","是，那些人，不用付代價。"],["p","我們的喜怒，常常，不是看，神怎麼想。"],["p","是看，我自己，得了什麼，失了什麼。"],["p","第二件。"],["p","次日黎明。"],["p","神卻安排一條蟲子。"],["p","咬這蓖麻。"],["p","枯槁了。"],["p","第三件。"],["p","日頭出來的時候。"],["p","神安排炎熱的東風。"],["p","日頭曝曬約拿的頭。"],["p","他發昏。"],["p","他又求死。"],["p","你記得嗎？"],["p","全卷，有一個動詞。"],["p","安排。"],["p","神安排大魚。"],["p","神安排蓖麻。"],["p","神安排蟲子。"],["p","神安排東風。"],["p","每一個安排，都是為了約拿。"],["p","這三次，不是為了折磨他。"],["p","蓖麻，是來救他的。"],["p","蟲子，和東風。"],["p","是要把他，帶到一個地方。"],["p","一個，他自己能感覺到。"],["p","我捨不得。"],["p","的地方。"],["p","神，不是在懲罰。"],["p","神，是在準備一個問題。"],["p","你看，這個問題，是怎麼被準備的？"],["p","不是用講的。"],["p","是用一棵植物，教他。"],["p","一夜之間，有了。"],["p","一夜之間，沒了。"],["p","神讓約拿，自己，經歷一次。"],["p","那種，捨不得的感覺。"],["p","然後再問。"],["p","這樣的問，比一百句道理，更有力。"],["p","因為，那是他自己的心，在說話。"],["h","五、我豈能不愛惜呢"],["q","神對約拿說：你因這棵蓖麻發怒合乎理嗎？他說：我發怒以至於死，都合乎理！（拿4:9）"],["q","耶和華說：這蓖麻不是你栽種的，也不是你培養的；一夜發生，一夜乾死，你尚且愛惜；（拿4:10）"],["q","何況這尼尼微大城，其中不能分辨左手右手的有十二萬多人，並有許多牲畜，我豈能不愛惜呢？（拿4:11）"],["p","第九節。"],["p","神問了第二次。"],["p","你因這棵蓖麻發怒，合乎理嗎？"],["p","這一次，約拿回答了。"],["p","他說，合乎理。"],["p","我發怒，以至於死，都合乎理。"],["p","他把神的問句，原樣還給了神。"],["p","這是整卷書。"],["p","約拿，第一次，直接回答神的問題。"],["p","而且，是一句誠實的話。"],["p","神，在等這句話。"],["p","一個人，不先說出自己的怒氣。"],["p","就不能真正被問。"],["p","你看，這是一種很深的安靜。"],["p","神，沒有要求他說得好聽。"],["p","祂要他，說真的。"],["p","我們在神面前，常常，想先整理好。"],["p","先把怒氣，換成比較屬靈的話。"],["p","先說，神，我知道你是對的。"],["p","可是神，要的是，最前面那一句。"],["p","真的那一句。"],["p","我氣。"],["p","我氣到想死。"],["p","詩篇裡，有很多這樣的話。"],["p","神，把它們，放進了聖經裡。"],["p","然後，神說了最後的話。"],["p","這蓖麻，不是你栽種的。"],["p","也不是你培養的。"],["p","一夜發生。"],["p","一夜乾死。"],["p","你，尚且愛惜。"],["p","何況。"],["p","這尼尼微大城。"],["p","其中，不能分辨左手右手的，有十二萬多人。"],["p","並有許多牲畜。"],["p","我豈能不愛惜呢？"],["p","然後，書卷，結束了。"],["p","約拿，有沒有回答？"],["p","經文，沒有說。"],["p","他有沒有起來？"],["p","經文，沒有說。"],["p","這不是作者沒有寫完。"],["p","這是作者，把這個問句。"],["p","交到，每一個讀者的手上。"],["p","你有沒有發現，這樣的結尾，很不一般？"],["p","我們習慣，故事要有結局。"],["p","要有圓滿。"],["p","可是約拿書，停在一個問句。"],["p","為什麼？"],["p","因為，神要的，不是約拿的答案，寫在書裡。"],["p","神要的，是我的答案，活在我的生命裡。"],["p","你，怎麼回答？"],["p","我們，不替經文補上結局。"],["p","我們，不替約拿回答。"],["p","我們只聽見，那個問題。"],["p","我豈能不愛惜呢？"],["p","弟兄姊妹。"],["p","也許你今天，正坐在城外。"],["p","也許你，很清楚，自己是對的。"],["p","可是你，不開心。"],["p","請你記得。"],["p","神，沒有罵你。"],["p","祂只是問你。"],["p","你這樣，合乎理嗎？"],["p","祂不是要定你的罪。"],["p","祂是要，把你的心。"],["p","帶到祂的心旁邊。"],["p","也許，你現在，還不想放下。"],["p","沒關係。"],["p","神沒有催你。"],["p","祂那一個問題，還在。"],["p","你可以，帶著它，回家。"],["p","今晚，坐下來。"],["p","把它問一遍。"],["p","我，在氣什麼？"],["p","我，在捨不得什麼？"],["p","然後，把答案，說給神聽。"],["p","不必修飾。"],["p","約拿書，就停在這裡。"],["p","等你。"],["p","你心裡，有沒有一座，你不想讓祂憐憫的城？"],["p","也許是一個人。"],["p","也許是一群人。"],["p","也許是一個，曾經傷過你的人。"],["p","神，沒有要你，假裝沒事。"],["p","也沒有要你，馬上喜歡他。"],["p","祂只是，問你。"],["p","我豈能不愛惜呢？"],["p","然後，等你，把這個問題，帶到十字架前。"],["p","耶穌，也站在，一座城的外面。"],["p","祂為那座城，哭了。"],["p","祂說，耶路撒冷啊，耶路撒冷。"],["p","我多次想聚集你的兒女。"],["p","祂，不是坐在城外，看。"],["p","祂，是走進去。"],["p","走到十字架。"],["p","為那座，不認識祂的城。"],["p","為那些，不能分辨左手右手的人。"],["p","死了。"],["p","所以，我們有盼望。"],["p","那位問約拿的神。"],["p","也在耶穌裡，給了我們答案。"],["p","讓耶穌作王。"],["p","不是我決定，誰配被愛惜。"],["p","是祂說，我豈能不愛惜呢。"],["p","我說，主啊，求祢，把祢的心，給我。"],["p","奉主耶穌基督的名禱告，阿們。"]]}},"issues":[{"id":"ISS00_1","t":"文體與歷史性：約拿書是歷史敘事、寓言，還是歷史核心加文學筆法？","r":"1:1--4:11","ch":[1,4],"why":"約拿書有大魚、一夜長起的蓖麻、全城連牲畜都披麻布，也有耶穌親自提到約拿與尼尼微人（太12:39–41；路11:29–32）。因此，讀者對這卷書的文體，有不同的看法：它是按字面記錄的歷史，還是用故事教導真理的寓言，或是以歷史為核心、帶著文學筆法的敘事？","pos":[["歷史敘事","","按字面讀：約拿是歷史上的先知（王下14:25），魚、蓖麻、尼尼微的悔改，都是神的作為；耶穌提到約拿與尼尼微人，是把他們當作真實的人與真實的事。"],["寓言或諷刺作品","","這卷書有許多反諷與誇張（全城連牲畜都披麻布、先知在神面前生悶氣），目的是借故事照出以色列的心；教導的真理，不因文體而減損。"],["歷史核心加文學筆法","","約拿與尼尼微的事是真實的，作者用精巧的敘事手法（重複的字、對比、沒有結局的結尾）把它寫出來。"]],"con":[],"say":"本講義不把「相信聖經」與某一種文體的看法綁在一起。我們同意：這卷書是神的話；耶穌的引用，有不可輕忽的重量。至於文體的細節，我們不裁決，也不用它去論斷別的弟兄姊妹。我們逐節讀經文自己說的：神差遣、神追趕、神憐憫、神發問。","care":"不要把這個問題變成「誰比較尊重聖經」的標籤。有人讀過不同的學術意見，有人守著傳統的看法，都可以一起查考同一段經文。先把經文讀完，再談意見；對正在尋求的朋友，可以先說：這卷書最動人的，是神沒有放棄一個逃跑的人，也沒有放棄一座大城。"},{"id":"ISS00_2","t":"神的主權、憐憫與先知的義憤：約拿為什麼發怒？","r":"4:1--4:11","ch":[1,4],"why":"四章二節，約拿說他逃往他施，是因為他知道神是有恩典、有憐憫的神。這個理由，是在抗議神太寬容，還是在為公義發聲，還是為了自己的名聲？整卷書的後半，都被這個問題照亮。","pos":[["為公義發怒","","尼尼微是殘暴的城，約拿覺得放過牠，不公平；這是對惡的義憤。"],["不願意恩典臨到他們","","約拿的神學是對的，他的心卻不願意神的恩典臨到他不喜歡的人。"],["不替他下結論","","經文只給了約拿自己的說法與神的問句；最後，也沒有給約拿的回答。"]],"con":[],"say":"本講義以經文自己的線索為主：約拿自己說的理由（4:2），與神的問句（4:4、9、11）。我們不把約拿當反派，也不把他當榜樣；他是一個認得神、卻不歡喜神心意的人，而神仍然追問他。這個問句，最後問到我們自己。","care":"不要用這個問題去論斷「某個人的怒是不屬靈的」。先問自己：我最近的怒，是為了誰？把怒氣帶到神面前，讓祂問，是約拿書教我們的方式。"},{"id":"ISS00_3","t":"神的後悔與神的不改變：3:10 與 4:2、民數記 23:19、耶利米書 18:7–8","r":"3:10；4:2","ch":[3,4],"why":"三章十節說，神後悔，不把所說的災禍降與他們；四章二節約拿引用神「後悔不降災」的屬性。但民數記 23:19 說，神非人，必不至後悔。聖經怎樣同時說這兩件事？","pos":[["神真的回應人","","聖經用人的語言說神；神對人的回轉，有真實的回應，不是做戲。"],["本性不變，對人的方式變","","神的本性、信實與計劃沒有改變；「後悔」是從人的角度描述神收回所說的災。"],["審判有條件","","耶利米書 18:7–8 是神自己啟示的原則：祂若說要拔出、毀壞，但那國回轉，祂就後悔，不把災禍降給他們。"]],"con":[],"say":"本講義不裁決這個神學難題。三種說法有一個共同點：神是信實的，也是有憐憫的；警告是為了叫人回轉，人一回轉，神就以憐憫回應。這是我們可以放心依靠的。","care":"不要因為這個問題，懷疑神的可靠；也不要用「神會後悔」，作為輕看警告的藉口。神的憐憫，不是我們的把握，是祂的恩典。"},{"id":"ISS00_4","t":"外邦人與神的愛：尼尼微的悔改與神的普遍之愛","r":"1:16；3:5--10；4:11","ch":[1,4],"why":"約拿書裡，外邦的水手敬畏耶和華，外邦的尼尼微人信服神，神說祂愛惜這座大城。這卷書，是在告訴我們神的愛，不只在以色列嗎？同時，我們要怎樣避免用這卷書為任何仇恨、歧視、或民族主義背書？","pos":[["神的愛超越民族","","神差遣先知到外邦的大城，並說祂愛惜那座城；這是舊約對萬民的心的清楚表達。"],["對以色列的鏡子","","這卷書也是向以色列說話：外邦人回轉得比神的百姓更快，這是對自義的提醒。"],["兩者並存","","神的愛及於萬民，同時祂的百姓也被這個故事質問。"]],"con":[],"say":"本講義的立場是：這卷書顯出神對一座城、對一群不認識祂的人的愛惜；它既不為任何仇恨背書，也不為任何優越感背書。我們不把尼尼微等同今日任何國家或族群，也不用它去羞辱任何人。","care":"不要用這卷書去指責某個民族「應該像尼尼微一樣悔改」，也不要用它說「外邦人比信徒好」。先問自己：我心裡有沒有一個「尼尼微」，是我不想讓神愛惜的？"},{"id":"ISS00_5","t":"事工的成功與先知的生命：事工大過生命的危險（含苦難、憂鬱、求死）","r":"3:1--4:11","ch":[3,4],"why":"約拿的講道成功了：全城悔改。但他的生命，卻是全卷最掙扎的：憤怒、坐在城外、兩次求死。這提醒我們：事工的成果，與一個人的生命狀態，可以是兩回事。這卷書也寫到求死，我們該怎樣嚴肅地讀它？","pos":[["事工與生命脫節","","一個人可以有很大的事工果效，裡面卻是疲憊、憤怒與絕望；成功不能取代生命的更新。"],["疲憊與憂鬱需要被陪伴","","摩西、以利亞、約拿都曾求死；神的回應，是陪伴、休息、一個安靜的問題，不是責備。"],["不要拿它當榜樣","","經文沒有稱讚約拿求死；我們不把求死浪漫化，也不把它當成「屬靈深度」。"]],"con":[],"say":"本講義的立場是：先生命，再關係，後事工。約拿書最後留下的，不是他事工的成績，而是神對他生命的追問。對求死，我們不當笑話，也不當榜樣；我們學神的方式：陪伴、等待、發問。","care":"如果你正在服事，卻覺得疲憊、憤怒或絕望；或者你身邊有人有「不如消失」的念頭，請不要獨自承擔。請找你信得過的人，並尋求專業的幫助，包括醫師、輔導與當地的求助專線。神愛惜你，祂不要你消失。不對正在流淚的人說「你要有信心」，先陪伴。"},{"id":"ISS01_1","t":"1:1：約拿是誰？這個名字在聖經其他地方出現過嗎？","r":"1:1--1","ch":[1],"why":"一章一節只說：耶和華的話臨到亞米太的兒子約拿。這個人不是憑空出現的；列王紀下十四章二十五節提到，耶羅波安二世的時候，有一位先知，亞米太的兒子約拿，迦特希弗人，說過以色列疆界必得恢復。問題是：這兩處是同一個人嗎？知道這件事，對我們怎樣讀這卷書有什麼影響？","pos":[["同一位先知","","兩處的名字與父名相同，都是先知，所以最自然的讀法，是同一個人：一位曾經向本國報喜訊的先知，如今被差往仇敵的大城。這個背景讓「他不願意去」顯得更有分量。"],["不必確定","","聖經沒有在這卷書裡再說明他的身分；有人認為，不必把兩處硬連在一起，這卷書的重點是神的話與約拿的回應，不是他的履歷。"]],"con":[],"say":"本講義採第一種為主：兩處指同一位先知，是最合乎經文的讀法；但我們不把整卷書的意義建在這個推論上。重點是，神差遣的，是一位認得耶和華、也傳過耶和華話語的人，連這樣的人，也會往反方向走。","care":"不要因為約拿「是先知」，就把他當作遠離我們的人；也不要因為他逃了，就把他當作壞人的樣本。先問自己：我是不是也曾經把「我是信徒」當作不需要再被叫醒的理由？"},{"id":"ISS01_2","t":"1:3：「他施」在哪裡？為什麼是這個方向？","r":"1:3--3","ch":[1],"why":"一章三節說約拿「逃往他施去」，並且是「躲避耶和華」。他施到底在哪裡？有人認為在地中海極西的地方，有人提出別的地點。這個問題，會不會改變這一節的意思？","pos":[["地中海極西","","許多學者認為，他施在今日西班牙南部一帶，是當時人所知最遠的西方；與尼尼微在東方正好相反。"],["不能確定的遠方","","經文沒有給地圖，聖經其他地方也用「他施」代表遙遠的海外與貿易；重點是方向，不是座標。"]],"con":[],"say":"本講義不替經文補上確定的地理位置，只守住兩件事：尼尼微在東，約拿向西；神說「起來去」，他卻往反方向。至於他施是哪一個港口，並不影響這一節的重量。","care":"不要把這一節變成地理的爭論。更值得問的是：我的「他施」，是離神最遠、最不容易被找到的地方，還是其實就在我熟悉、舒服、不需要被打擾的地方？"},{"id":"ISS01_3","t":"1:7：水手「掣籤」，是不是為占卜背書？","r":"1:7--7","ch":[1],"why":"一章七節，水手們彼此說：來吧，我們掣籤，看看這災是因誰臨到我們。籤落在約拿身上。這是否表示，聖經支持用掣籤來決定神的旨意？","pos":[["外邦水手的做法","","掣籤是這群水手的辦法，經文只是記述他們做了什麼，並沒有教導讀者照做；真正做主的，是神擲出大風，也使籤落在約拿身上。"],["神掌管籤","","箴言十六章三十三節說，籤放在懷中，定事由耶和華；有人因此認為，神可以在不認識祂的人所用的方法中，成就祂的旨意。"]],"con":[],"say":"本講義的立場是：經文描寫掣籤，卻沒有命令信徒用掣籤尋求神的旨意；神可以使用，不表示我們可以倚靠。今日我們尋求旨意，靠聖經、聖靈的引導、屬靈同伴的印證，不靠擲籤，也不靠任何占卜。","care":"不要用這一節為任何占卜、算命或「抽籤問神」背書；也不要因此嘲笑誠心尋求的人。可以溫和地說：神確實掌管，但祂已經把話語賜給我們，我們先從祂的話語開始。"},{"id":"ISS01_4","t":"1:3：約拿為什麼逃？是怕尼尼微，還是怕神的恩典？","r":"1:2--3","ch":[1],"why":"一章二至三節沒有說明約拿逃跑的原因。到了四章二節，約拿自己說：我知道你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災，所以我急速逃往他施去。這個理由，是不是一開始就在了？","pos":[["怕尼尼微的人","","尼尼微是強大而殘暴的城，約拿可能怕自己的性命有危險，這是最直接的讀法。"],["怕神的憐憫","","四章二節是約拿自己的說明：他逃，是因為他知道神會憐憫；他不願意看見尼尼微得著憐憫。這個讀法，讓第一章成為一個伏筆。"],["兩者都有","","人的動機常常不只一個；怕、不甘心、不想去，可以同時存在。"]],"con":[],"say":"本講義讀到第四章才下結論：約拿自己給的理由，最有分量。因此，在第一章，我們不替他說「他一定是這樣」，只記得這個問題，在第四章，神要問他。","care":"不要在第一章就替約拿定罪，也不要替他辯護。每個人逃避的理由都不同；比起分析別人為什麼逃，更重要的是，誠實地說出自己：我不願意去，是因為怕，還是因為不甘心？"},{"id":"ISS01_5","t":"1:12：約拿叫水手把他拋下海，是認罪，還是求死？","r":"1:12--12","ch":[1],"why":"一章十二節，約拿說：你們將我抬起來，拋在海中，海就平靜了，因為我知道你們遭這大風，是因我的緣故。這句話，是一個勇於承擔的人，還是一個想要結束生命的人？這個問題，也牽涉到我們今天怎樣對待有輕生念頭的人。","pos":[["承擔責任","","約拿承認風浪因他而起，願意付出代價，使無辜的人得救；水手後來也不願意立刻照做（1:13），他們求告耶和華，才把他拋下。"],["絕望與求死","","有人注意到，約拿後來在第四章兩次求死（4:3、8），因此認為，這裡也帶有一種逃離一切的絕望。"],["經文沒有稱讚他","","經文只記錄他說了什麼，沒有把這句話當作要我們效法的榜樣。"]],"con":[],"say":"本講義的立場是：這一節同時有承認與疲憊，我們不替約拿的心思下單一的結論。也要誠實地說：約拿並沒有被稱讚，這一節也不是一個叫人效法犧牲、或叫人「消失」的範本。","care":"如果你或你身邊的人，心裡有「不如消失」的念頭，請不要用這一節去鼓勵、也不要用它去責備。請先陪伴，傾聽，不要求對方「要有信心」，並協助尋求專業的幫助，包括醫師、輔導與當地的求助專線。神不要你消失，祂安排一條大魚，是為了接住人。"},{"id":"ISS01_6","t":"1:17：大魚是什麼？可以推測是哪一種魚嗎？","r":"1:17--17","ch":[1],"why":"一章十七節說：耶和華安排一條大魚，把約拿吞了。人們很容易把重點放在：這是什麼魚？人能在魚腹中活三日嗎？有些人用這件事證明聖經是真的，也有人用它來嘲笑聖經。","pos":[["歷史敘事","","按字面理解，神以神蹟安排魚；這是神作為的記錄，與耶穌提到約拿（太12:39–41）的重量相合。"],["帶著文學筆法的敘事","","有人認為，這卷書的寫法有許多誇張與反諷，魚的敘述是為了強調神的主權；他們同樣相信，耶穌的話是真實的。"]],"con":[],"say":"本講義只守住經文自己說的：是「耶和華安排」的，是「一條大魚」。我們不推測魚種，不引用未經查證的傳聞，也不用這一節去爭辯誰比較尊重聖經。這一節的重點，是神安排魚，不是丟棄約拿，而是接住他。","care":"不要因為對這卷書的文體有不同看法，就把別的弟兄姊妹當作敵人。討論的目的，是更靠近神的話，不是贏過一個人。對不信的朋友，可以先說：這一節最動人的，是神沒有放棄一個逃跑的人。"},{"id":"ISS02_1","t":"2:1–9：魚腹中的禱告是詩歌，還是約拿當時真的說的話？","r":"2:1--9","ch":[2],"why":"二章二至九節是一首詩，用了許多詩篇的語言。有人因此問：約拿在魚腹中，真的說了這樣工整的詩嗎？還是作者後來整理而成？這個問題，影響我們怎樣讀這一段。","pos":[["當時的禱告","","約拿在得救之後，把他在魚腹中的禱告記錄下來；詩篇的語言，是他平時熟悉、在危急中自然想起的話。"],["整理過的詩","","作者把約拿的經歷與禱告寫成一首感謝詩，放在敘事的中間，使讀者與約拿同在深處；這不影響它是神的話。"]],"con":[],"say":"本講義不裁決這個問題，只守住一件事：這篇禱告是一個認得詩篇的人，在最深的地方，用他最熟悉的話向神開口。我們不必比較誰說得工整，重點是他說了真話。","care":"不要用這個問題嘲笑或論斷持不同意見的人，也不要因此覺得自己的禱告不夠漂亮就不敢開口。神聽見的，是真話，不是詩句。"},{"id":"ISS02_2","t":"2:2、6：「陰間的深處」與「山根」是什麼地方？","r":"2:2--6","ch":[2],"why":"約拿說自己「從陰間的深處呼求」，又說「我下到山根，地的門將我永遠關住」。這是指他已經死了，還是詩歌的說法？","pos":[["死亡的邊緣","","「陰間」在舊約常指死亡之地；約拿在詩語中說，他的處境近乎死亡，如同被關在墳墓的門後。"],["字面的海底","","「山根」是海底山脈的根基，是人所能到的最深處；這是用地理的深度，描寫生命的盡頭。"]],"con":[],"say":"本講義讀為詩歌語言：約拿用陰間、山根、門閂，寫出一個人在死亡的邊緣。我們不從這幾節推出死後世界的詳細地圖，只看見：在人以為永遠的地方，神說：你卻。","care":"不要用這幾節討論死後的細節而嚇唬人，也不要對剛失去親人的人，用它說明逝者在何處。先陪伴，再談盼望。"},{"id":"ISS02_3","t":"1:17；2:1：「三日三夜」與太 12:40，要怎麼理解？","r":"2:1--1","ch":[2],"why":"約拿在魚腹中三日三夜（1:17），耶穌引用這件事說，人子也要這樣三日三夜在地裡頭（太12:40）。這個「三日三夜」是精確的七十二小時，還是一種計算方式？耶穌從死裡復活，又怎樣對應？","pos":[["字面的三日三夜","","按字面算滿七十二小時，並以此推算耶穌受難與復活的日子。"],["猶太計日法","","古時計日，一天的一部分也算一天；「三日三夜」可以指跨越三個日子，不必滿七十二小時。"],["重點在記號","","耶穌要說的是「約拿的神蹟」：一個人落到死亡般的深處，又被神帶上來；重心在復活，不在計算。"]],"con":[],"say":"本講義不算日子，不排時間表。我們聽耶穌自己怎麼用：祂說的是約拿的神蹟，指向祂的死與復活；叫人今天就悔改、仰望祂的，才是原意。","care":"不要用「三日三夜」與人爭辯，也不要用它推算任何日期。有人用這個細節質疑聖經，也可以溫和回答：我們先看耶穌指向什麼。"},{"id":"ISS02_4","t":"2:8：「虛無之神」指什麼？這句話怎樣用才不傷人？","r":"2:8--8","ch":[2],"why":"約拿說：那信奉虛無之神的人，離棄憐愛他們的主。這句話，會不會被拿來貶低別的信仰的人，甚至成為歧視的藉口？","pos":[["對偶像的判斷","","「虛無」是舊約對偶像的稱呼；這是約拿向神說的話，說明偶像不能救人，只有耶和華是救主。"],["慈愛的反面","","「離棄」不是約拿對別人的詛咒，而是他在深處看見：離開神，就離開慈愛；這句話同時也在照自己。"]],"con":[],"say":"本講義的立場是：這句話是對神說的告白，不是對鄰舍的攻擊。尼尼微人後來也被神憐憫（第三章）；約拿書要我們看見神的慈愛，不要我們用這一句話嘲笑別人。","care":"不要用這一節貶低任何人的信仰，也不要用它在家庭或職場裡攻擊不同信仰的人。我們可以誠實說出自己所信，同時尊重、愛護每一個人。"},{"id":"ISS02_5","t":"2:2–9：約拿的禱告誠不誠懇？為什麼沒有認罪，第四章又發怒？","r":"2:2--9","ch":[2],"why":"這篇禱告有感謝、有信心，卻沒有明說認罪；而第四章，約拿為尼尼微得憐憫而發怒。有人因此說，這篇禱告是虛假的；也有人說，它是真實的，只是約拿的故事還沒有完。","pos":[["禱告是虛假的","","禱告說得很漂亮，行為卻沒有改變，所以約拿是在說客套話。"],["禱告是真的，轉變還未完成","","一個人可以在深處真誠地感謝，卻仍然在別的地方抓住自己；成長不是一次完成。"],["不替他下結論","","經文沒有評論他的內心，我們也不替他定案。"]],"con":[],"say":"本講義取第三種：不裁決約拿的內心。我們只看見兩件事：一，他在深處說出了最正確的話（2:9）；二，神後來還要再問他一次。這提醒我們，真誠的禱告與持續的順服，是兩個需要一生來學的功課。","care":"不要用這個問題去懷疑別人的禱告，也不要拿來定自己的罪。你若在深處說過一句真話，那就是真話；至於下一步，神會再問。"},{"id":"ISS02_6","t":"2:10：魚把約拿「吐」在旱地上，是神厭棄他嗎？","r":"2:10--10","ch":[2],"why":"二章十節說，魚把約拿「吐」出來。這個動詞很不優雅。有人問：這是神對約拿的厭棄，還是只是一種描寫？","pos":[["厭棄的記號","","「吐」是一種排斥，約拿被趕出魚腹，如同被丟棄。"],["神的吩咐","","經文說，是「耶和華吩咐魚」，魚才吐；這是神的作為，目的是把約拿送回旱地，重新上路。"]],"con":[],"say":"本講義讀為神的吩咐，不是神的厭棄：魚是接住，這一節是放下。約拿得救了，卻還沒有起來；第三章，神的話要第二次臨到他。","care":"不要把「被吐出」說成「被神拋棄」。若有人正在經歷被推離、被辭退、被離開的處境，請先陪伴，不要急著替他的處境下定論。"},{"id":"ISS03_1","t":"3:4：「再等四十日」是預言的條件性嗎？可以用它算日子嗎？","r":"3:4--4","ch":[3],"why":"約拿宣告：再等四十日，尼尼微必傾覆了。但四十日之後，尼尼微沒有傾覆。這是預言落空，還是預言本來帶著條件？有人也想用「四十日」去推算別的日期。","pos":[["預言帶著條件","","先知的警告常帶著「若不回轉」的意思（耶18:7–8）；尼尼微回轉，宣告就不再成立，這不是落空，而是警告達到了目的。"],["「傾覆」的雙重意思","","hafakh 既可指毀滅，也可指翻轉；尼尼微真的被「翻轉」了，只是翻轉的是人心。"],["不要拿來算日子","","四十日是這個故事裡的一段時間，不是一份可以挪用的時間表。"]],"con":[],"say":"本講義的立場是：警告的目的，是叫人回轉，而不是為了應驗。我們不用「四十日」推算任何日期，也不把這個故事，變成排時間表的工具。","care":"不要用這節經文嘲笑聖經，也不要用它預測任何日子。先問自己：神的警告來到我面前時，我怎麼回應？"},{"id":"ISS03_2","t":"3:3：尼尼微有多大？「三日的路程」是什麼意思？","r":"3:3--3","ch":[3],"why":"三章三節說，尼尼微是極大的城，有三日的路程。這是指城的周長，是指走遍全城辦事所需的時間，還是形容它在神眼中的重要？","pos":[["城的範圍","","尼尼微及周邊的城鎮合起來，周長約三日路程，是一個都會區的描寫。"],["辦事的時間","","三日是一位先知走遍全城、進行宣告所需的時間。"],["在神眼中的大","","le-Elohim（對神來說）可讀為「在神眼中」，強調這座城的分量，不止是尺寸。"]],"con":[],"say":"本講義不替它定位。我們只守住一件事：這是一座大城，大到一個人走了一日，才開始說話；而它在神眼中，是值得差遣先知去呼喊的城。","care":"不要因為地理爭論，而忽略經文要我們看見的：神看重一座城，也看重城裡的每一個人。"},{"id":"ISS03_3","t":"3:5：尼尼微人的悔改到什麼程度？他們算「得救」了嗎？","r":"3:5--10","ch":[3],"why":"三章五節說尼尼微人「信服神」，十節說神看見他們離開惡道，就不降災。這是否表示他們全城都已經得救、成為神的子民？","pos":[["已經得救","","「信服神」與「離開惡道」是真悔改的記號，神的憐憫臨到他們，他們得救了。"],["暫時免去審判","","經文說的是神不降所宣告的災禍；他們後來的歷史（鴻3），顯示悔改未必持續。"],["不替經文裁定","","經文記下他們的信服與神的憐憫，沒有說他們永遠得救或不得救。"]],"con":[],"say":"本講義不裁定他們的永遠歸屬，我們只說經文說的：他們信服神，離開惡道，神就憐憫。我們不用這件事，去替任何人的永生下判斷。","care":"不要用這個問題去論斷誰「已經得救」。你可以先問自己：我是否也曾聽見神的話就起來回轉？"},{"id":"ISS03_4","t":"3:5–8：披麻、坐灰、牲畜禁食，是什麼意思？是迷信嗎？","r":"3:5--8","ch":[3],"why":"尼尼微人宣告禁食、穿麻衣，王坐在灰中，連牲畜也不吃不喝、披上麻布。這是否是一種迷信的儀式？今天有意義嗎？","pos":[["悔改的外在表現","","麻衣、灰、禁食，在聖經世界是悲哀與悔改的常見記號（參撒下3:31；斯4:1）。"],["人與牲畜一同謙卑","","把牲畜包含進來，顯示整個群體與受造之物，一起在神面前謙卑；這是強烈的象徵。"],["重點在行為","","神察看的是「他們的行為，見他們離開惡道」（3:10）；外在的儀式，必須連著行為。"]],"con":[],"say":"本講義的立場是：外在的記號，是悔改的表現，不是悔改的替代。今天我們不必照樣披麻坐灰，卻必須像他們一樣：離開惡道，丟棄手中的強暴。","care":"不要用這些外在做法評價別人的屬靈，也不要因為沒有類似的表現，就懷疑自己的悔改。神察看的，是行為與回轉。"},{"id":"ISS03_5","t":"3:9–10：神「後悔」，神的本性有改變嗎？","r":"3:9--10","ch":[3],"why":"三章十節說，神後悔，不把所說的災禍降與他們。但民數記23:19說，神非人，必不至說謊，也非人子，必不至後悔。這兩處怎麼理解？","pos":[["神真的回應","","聖經用人的語言說神的行動；神對人的回轉有真實的回應，這不是做戲。"],["本性不變，對人的方式變","","神的本性、信實與計劃沒有改變；「後悔」是從人的角度，描述神收回所說的災。"],["審判是有條件的","","耶18:7–8 說，神若說要拔出，但那國回轉，神就後悔不降災；這是神自己所啟示的原則。"]],"con":[],"say":"本講義不裁決這個神學難題。三種說法有一個共同點：神是信實的，也是有憐憫的；人回轉，神就回應。這是我們可以放心依靠的。","care":"不要因為這個問題，懷疑神的可靠；也不要用「神會後悔」，作為輕看警告的藉口。神的憐憫，不是我們的把握，是祂的恩典。"},{"id":"ISS03_6","t":"3:10：尼尼微悔改與亞述後來的歷史（鴻3），要怎麼連起來？","r":"3:10--10","ch":[3],"why":"尼尼微在約拿的時代悔改，神不降災；但後來，先知那鴻說尼尼微是「流人血的城」（鴻3:1），終於被毀滅。這兩段歷史，怎麼連？","pos":[["悔改沒有持續","","尼尼微的悔改，後來被後代的罪取代；神的憐憫臨到一代，但不保證永遠。"],["不同的時代","","約拿與那鴻面對的是不同的世代；兩個時代，兩種光景。"],["神的主權與公義","","神的憐憫與審判，都是祂的作為；兩者並不矛盾。"]],"con":[],"say":"本講義的立場是：第三章只講這一次的悔改與這一次的憐憫，後來的事，由那鴻書去說。我們不用後來的歷史，去否定這一次的恩典，也不用這一次的恩典，去保證後代。","care":"不要用尼尼微後來的結局，嘲笑悔改的意義；也不要用這一次的悔改，輕看後代需要再次回轉的呼召。你的一次悔改，是真的；你的下一天，仍需要神。"},{"id":"ISS04_1","t":"4:1：約拿為什麼發怒？是為了尼尼微沒有被毀，還是為了自己的面子？","r":"4:1--4","ch":[4],"why":"神不降災，約拿大大不悅。他為什麼生氣？經文用了「大惡」這個說法，卻沒有直接解釋。有人認為，他在意的是公義；有人認為，是他的預言落空；有人認為，是他對尼尼微的情感。","pos":[["為公義發怒","","尼尼微是殘暴的城，神放過牠，約拿覺得不公平；這是對惡的義憤。"],["為預言的名聲","","他宣告了「傾覆」，神卻不降災，他覺得自己被當作說謊的先知。"],["不願意恩典臨到他們","","4:2 說，他逃是因為知道神有恩典；他不願意這份恩典臨到尼尼微人。"],["不替他下結論","","經文只給了4:2的一個理由，其餘留給我們自己對照。"]],"con":[],"say":"本講義以 4:2 約拿自己的話為主：他知道神的恩典，所以不願意去。其他讀法，可以並存，但不替經文補上它沒有說的心思。這一節的目的，不是分析約拿，而是照出我們自己的怒。","care":"不要用這個問題去論斷「某個人的怒是不屬靈的」。先問自己：我最近的怒，是為了誰？是為了公義，還是為了我不願意某人得好處？"},{"id":"ISS04_2","t":"4:2：約拿引用的，是出埃及記 34:6–7 嗎？為什麼把神的屬性當作抱怨？","r":"4:2--2","ch":[4],"why":"約拿說：你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災。這幾乎是出34:6–7，神向摩西宣告的名字。為什麼約拿用它來作抱怨？","pos":[["他說的是真的","","這是約拿真實的神學，他沒有說錯，只是他的心，沒有同意。"],["信仰告白可以被誤用","","最寶貴的真理，可以被用來合理化自己的不順服。"],["他在抗議神的方式","","約拿覺得神太寬容，所以才用神自己的話來責問祂。"]],"con":[],"say":"本講義的立場是：約拿的神學無誤，他的心，與神的心，站在不同的地方。這提醒我們，知道神的慈愛，並不等於歡喜神的慈愛臨到我不喜歡的人。","care":"不要用這一節說「神學不重要」，也不要用它說「知道得越多越好」。真正的標準是：我知道的，有沒有帶我更靠近神的心。"},{"id":"ISS04_3","t":"4:6：蓖麻是什麼植物？","r":"4:6--6","ch":[4],"why":"4:6 的蓖麻（qiqayon）是什麼植物？有人認為是蓖麻（Ricinus communis），也有人認為是葫蘆或別的快速生長的植物。這個問題重要嗎？","pos":[["蓖麻","","古代傳統與一些學者認為是蓖麻，生長快速，葉大，能遮蔭。"],["葫蘆或別種","","也有人認為是匏瓜類的藤蔓；詞語的確切意思，不能確定。"]],"con":[],"say":"本講義不替它定種類，只守住經文的重點：神安排一棵快速生長的植物，約拿為牠歡喜，也為牠的枯槁發怒。植物的品種，不是這一節的重心。","care":"不要在這個問題上爭辯，更不要因此忽略神的問題。蓖麻是什麼，並不影響我們聽見：你尚且愛惜。"},{"id":"ISS04_4","t":"4:3、8：約拿求死，我們要怎樣嚴肅地讀它？","r":"4:3--8","ch":[4],"why":"約拿兩次求神取他的命。這是一個先知的絕望，還是一個發脾氣的人的誇張？我們該怎樣讀這一節，才不傷害正在受苦的人？","pos":[["真實的痛苦","","摩西（民11:15）、以利亞（王上19:4）也曾在重壓下求死；這是疲憊與失望的真實，不應被輕看。"],["誇張的情緒","","有人認為，約拿的求死，帶有文學的誇張，是在凸顯他的固執；但這仍不使痛苦變得微小。"]],"con":[],"say":"本講義不把約拿的求死當笑話，也不當榜樣。神對求死者的回應，是陪伴、飲食、休息，與一個安靜的問題。我們也當如此。","care":"如果你或你身邊的人，有「不如消失」的念頭，請不要獨自承擔。請先聯絡你信得過的人，並尋求專業的幫助，包括醫師、輔導與當地的求助專線。神愛惜你，祂不要你消失。不對正在流淚的人說「你要有信心」，先陪伴。"},{"id":"ISS04_5","t":"4:11：「不能分辨左手右手的人」是誰？","r":"4:11--11","ch":[4],"why":"神說，尼尼微有十二萬多不能分辨左手右手的人。這是指幼童，還是指在道德上沒有分辨力的人？這個問題，影響我們怎樣理解神的愛惜。","pos":[["幼童","","「不能分辨左右」是年幼孩子的描寫（參申1:39；賽7:15–16），十二萬指的是兒童的數目。"],["不認識神的人","","這句話是指整座城的人，他們不知道什麼是對、什麼是錯，也不認識神，是需要被教導的人。"],["不替它定案","","經文沒有進一步說明，兩種理解都指向：神愛惜這些人。"]],"con":[],"say":"本講義不裁定。不論是哪一種，這句話都是在說：這些人，是神所愛惜的。我們不拿它建立「無知的人不受審判」等超過經文的教義，只記得神的心。","care":"不要用這一節去替任何群體定案，也不要用它說「孩子都不需要福音」。先看神的心：祂愛惜一座城。"},{"id":"ISS04_6","t":"4:11：最後的問句沒有答案，我們可以替它補結局嗎？","r":"4:10--11","ch":[4],"why":"書卷在神的問句中結束。約拿有沒有回答？他有沒有起來？經文沒有說。許多讀者想替它補上一個結局：約拿悔改了，或約拿仍然固執。","pos":[["約拿後來悔改","","因為這卷書是約拿自己寫的，所以他一定是悔改了，才會把自己的故事寫下來。"],["不確定","","經文沒有說他悔改或不悔改。"],["讀者的問題","","作者故意不給答案，是要把問題交給每一位讀者。"]],"con":[],"say":"本講義不替約拿補結局。我們不說他悔改，也不說他沒有。我們把那個問句，留在我們面前：我豈能不愛惜呢？而我們的回答，就是我們自己的下一步。","care":"不要用「他一定悔改了」安慰自己，也不要用「他不肯悔改」責備別人。這個問句問的是我們。你今天的回答，是什麼？"}],"terrain":{"points":[[1.088,62,0,"你起來往尼尼微大城去","mid"],[1.147,24,0,"躲避耶和華","mid"],[1.265,12,0,"躺臥沉睡","bot"],[1.853,52,0,"海的狂浪就平息了","mid"],[1.971,56,0,"耶和華安排一條大魚","mid"],[2.25,18,0,"你將我投下深淵","bot"],[2.85,78,0,"救恩出於耶和華","top"],[3.45,88,0,"尼尼微人信服神","mid"],[3.95,94,0,"他就後悔","top"],[4.045,14,0,"約拿大大不悅","bot"],[4.682,4,0,"我死了比活著還好","bot"],[4.955,100,0,"我豈能不愛惜呢","top"]]},"tracks":[{"gk":"קוּם／יָרַד","tr":"qum／yarad","gl":"起來・下去","code":"H6965／H3381","root":"√קוּם（起來）／√יָרַד（下去）","stops":[["1:2","「你起來往尼尼微大城去」神的第一個「起來」：命令。","top"],["1:3","「約拿卻起來，逃往他施去躲避耶和華；下到約帕」同一個動詞，方向相反；一節裡三個動詞：起來、下去、下去（原文第二個「下去」，和合本譯為「上了船」，直譯是「下到船裡」）。","top"],["1:5","「約拿已下到底艙，躺臥沉睡」第三次「下去」：下到全船最低的地方。",""],["1:6","「起來，求告你的神」船主說出神早先說的同一句：「起來」。","top"],["2:6","「我下到山根，地的門將我永遠關住」全卷最深的「下」：下到山根。","top"],["3:2","「你起來！往尼尼微大城去」第二次，同一個命令。",""],["3:3","「約拿便照耶和華的話起來，往尼尼微去」同一個動詞，這次方向對了。","top"],["3:6","「他就下了寶座」原文動詞是「起來」（וַיָּקָם מִכִּסְאוֹ）：王起身離開寶座，和合本譯為「下了寶座」。全城最高的人，也放下了尊位。",""]],"ins":"「起來」（קוּם）與「下去」（יָרַד）合起來是全卷的方向感。神說「起來」；約拿真的起來，卻是為了逃，然後一路「下去」——下到約帕、下到船裡、下到底艙、下到山根。第二次，同一個命令再來，約拿起來，這回方向對了；連尼尼微王也起身，離開了寶座。"},{"gk":"קָרָא","tr":"qara","gl":"呼喊、宣告、求告","code":"H7121","root":"√קָרָא（呼喊、宣告）","stops":[["1:2","「向其中的居民呼喊」神叫約拿呼喊：呼喊本來是約拿的事工。","top"],["1:6","「起來，求告你的神」船主說：你的神，求告他。",""],["1:14","「他們便求告耶和華說」水手第一次稱呼耶和華的名。","top"],["2:2","「我遭遇患難求告耶和華，你就應允我」約拿自己的「呼喊」，被聽見了。","top"],["3:2","「向其中的居民宣告我所吩咐你的話」第二次，同一個字：宣告。",""],["3:4","「約拿進城走了一日，宣告說」約拿終於呼喊，只有一句。",""],["3:5","「尼尼微人信服神，便宣告禁食」聽見呼喊的人，也開始宣告。","top"],["3:8","「人要切切求告神」呼喊轉了向：從人對人，變成人對神。","top"]],"ins":"「呼喊」（קָרָא）在全卷 8 次，每一節各一次。它的流向是：神叫約拿向尼尼微呼喊（1:2）；異教的船主叫約拿向他的神呼求（1:6）；水手向耶和華呼求（1:14）；約拿從魚腹向神呼求（2:2）；約拿向尼尼微宣告（3:4）；尼尼微人宣告禁食、切切求告神（3:5、8）。第四章沒有一個人呼喊——約拿不再向神呼求，只剩神一次又一次地發問。"},{"gk":"גָּדוֹל","tr":"gadol","gl":"大","code":"H1419","root":"√גדל（大）","stops":[["1:2","「尼尼微大城」全卷第一個「大」：神所看重的大城。","top"],["1:4","「海中起大風，海就狂風大作」一節兩個「大」：大風、大浪（原文各一）。",""],["1:10","「他們就大大懼怕」水手的第一個「大」：懼怕。",""],["1:12","「你們遭這大風是因我的緣故」約拿承認：這大風是因我。",""],["1:16","「那些人便大大敬畏耶和華」同一個字從懼怕轉成敬畏。","top"],["1:17","「耶和華安排一條大魚吞了約拿」神的預備，也是「大」。",""],["3:2","「往尼尼微大城去」第二次，同一座大城。",""],["3:3","「這尼尼微是極大的城」大到要走三日的路程。",""],["3:5","「從最大的到至小的」「大」成了人：從最大到至小，全城一起。",""],["3:7","「王和大臣有令」「大臣」（原文即「他的大人們」）也在悔改的行列。",""],["4:1","「約拿大大不悅」原文是「大惡」（רָעָה גְדוֹלָה）：這個「大」落在約拿身上。","top"],["4:6","「約拿因這棵蓖麻大大喜樂」約拿最大的喜樂：一棵蓖麻。",""],["4:11","「何況這尼尼微大城」全卷最後一個「大」：神的大城。","top"]],"ins":"「大」（גָּדוֹל）在全卷 14 次，分布於 13 節。它先是神的大——大城、大風、大魚；接著是人的大——水手的大懼怕、大敬畏，王和大臣；最後落在約拿身上：他為一座城「大大不悅」，為一棵蓖麻「大大喜樂」。同一個字：約拿的「大」是一棵蓖麻，神的「大」是一座城。"},{"gk":"רָעָה／שׁוּב／נָחַם","tr":"ra'ah／shuv／nacham","gl":"惡・回轉・後悔","code":"H7451／H7725／H5162","root":"√רעע（惡、災）／√שׁוּב（回轉）／√נחם（後悔）","stops":[["1:2","「因為他們的惡達到我面前」全卷第一個「惡」：尼尼微的惡。","top"],["1:7","「看看這災臨到我們是因誰的緣故」同一個字：船上的災。",""],["1:8","「請你告訴我們，這災臨到我們是因誰的緣故」水手再問一次：這災。",""],["1:13","「竭力盪槳，要把船攏岸」「回轉」的第一次：水手要把船「轉」回岸邊，卻是不能（這一次不是悔改的意思）。",""],["3:8","「各人回頭離開所行的惡道」「回轉」與「惡」第一次同節：離開惡道。","top"],["3:9","「或者神轉意後悔，不發烈怒」一節兩個「回轉」，加一個「後悔」：王把門留給神。","top"],["3:10","「見他們離開惡道，他就後悔，不把所說的災禍降與他們了」三個字在同一節：離開惡道、後悔、災禍。全卷樞紐之一。","top"],["4:1","「約拿大大不悅」「惡」落在約拿身上：他覺得這是一件大惡事。",""],["4:2","「並且後悔不降所說的災」約拿自己引用神的屬性：後悔不降災。","top"],["4:6","「救他脫離苦楚」「苦楚」與「惡」同一個字：神救他脫離的，是這個字。",""]],"ins":"三個字連成一條線：「惡」（רָעָה，也是「災」）9 次、「回轉」（שׁוּב）5 次、「後悔」（נָחַם）3 次，共 17 次、分布於 10 節。尼尼微的惡達到神面前（1:2）；船上的災（1:7–8）；尼尼微人回轉離開惡道（3:8、10）；神就後悔，不降所說的災（3:10）；約拿卻大大不悅——原文用的還是同一個字「惡」（4:1）；他認得神是「後悔不降災」的神（4:2）；神為他安排蓖麻，救他脫離苦楚（4:6，又是同一個字）。尼尼微的惡、神要降的災、約拿的不悅，是同一個字。"},{"gk":"מָנָה","tr":"manah","gl":"安排、預備","code":"H4487","root":"√מָנָה（安排、預備）","stops":[["1:17","「耶和華安排一條大魚」","top"],["4:6","「耶和華神安排一棵蓖麻」",""],["4:7","「神卻安排一條蟲子咬這蓖麻」",""],["4:8","「神安排炎熱的東風」",""]],"ins":"「安排」（מָנָה）在全卷 4 次，主詞都是神：安排一條大魚（1:17）、一棵蓖麻（4:6）、一條蟲子（4:7）、炎熱的東風（4:8）。神安排救人的魚，也安排讓蓖麻枯槁的蟲；祂安排的，都是為了把約拿帶到那個問句面前：我豈能不愛惜呢？（附註：只有四站，未達五站標準。）"}],"lesson":{"1":{"no":1,"vol":"《321約拿書講義》第1課·約拿書第1章","title":"你起來往尼尼微大城去——逃、下、魚","chars":4794,"min":60,"deep":8,"dchars":1538,"tchars":1272,"blocks":[["h","一、一通不想接的電話（1:1–3）"],["p","弟兄姊妹平安。你有沒有接過一通電話，一看到來電的名字，心裡就說：不要是這件事。你知道那通電話要談什麼，你知道你該回答什麼，可是你讓它響，響到沒有聲音，然後告訴自己：我等一下再回。約拿書第一章，就是從一通「不想接的電話」開始。只是這一通電話，不是從手機裡來的，是從神那裡來的。"],["p","經文第一句非常安靜：耶和華的話臨到亞米太的兒子約拿。神先開口，人在後面。接著是三個命令：起來，去，呼喊。去哪裡？尼尼微大城。理由呢？因為他們的惡達到神的面前。注意這個方向：惡是向上走的，一路上到神的面前。神不是在遠處發怒，是這座城的惡，已經上來，上到祂面前了。神差約拿去「呼喊」，不是去毀滅，是去給這座城一個聽見的機會。"],["p","然後第三節，只有一句話的轉折：約拿卻起來。他用的，是和神同一個動詞「起來」。他真的起來了，沒有爭吵，沒有說「我不去」，只是往另一個方向走：逃往他施。他下到約帕，給了船價，上了船，要躲避耶和華。逃跑不一定是狂奔，有時候只是買一張船票。而且逃跑要花錢，這是我們常常忘記的事：不順服的路，從來不是免費的。"],["p","先停在這裡。我們不急著罵約拿，也不要急著替他找藉口。經文用很平靜的語氣說這件事，是因為這件事，每一個信徒心裡，都有一個版本。你的他施，是哪裡？也許是一份遲遲不寫的信，一通不打的電話，一個不去的探望，一句不說的道歉。約拿讓我們看見的，不是一個壞人，是一個認得神的人，怎樣轉過身去。"],["d",["約拿逃往他施，是因為怕尼尼微人，還是怕神？","第一章沒有說；到了 4:2，約拿自己才說：我知道你是有恩典、有憐憫的神，所以我急速逃往他施去。這一節回頭看，會改變我們對第一章的讀法：他怕的，也許不只是危險，更是神的慈愛會臨到他不想要的人。這是一種「讀到後面，才看懂前面」的寫法。所以現在，我們先不替他下結論，只記得：他逃，有一個理由，這個理由，在第四章才說出口。所以第一章的讀法，要等到第四章才完整：這就是約拿書「回頭看才明白」的寫法，也提醒我們，不必急著替別人的動機下結論。"]],["h","二、風是神擲的，船主叫醒先知（1:4–6）"],["p","神沒有放手。耶和華使海中起大風。你注意這個動詞：不是「起」，是「擲」，神把大風擲出來。海就狂風大作，船幾乎要破壞。水手開始害怕，各人哀求自己的神，又把貨物拋進海裡，想使船輕些。全船的人，都醒著，都忙著，都在盡力。可是約拿呢？他已經下到底艙，躺臥，沉睡。"],["p","這一幕是全卷最強的對比。外面風浪，裡面沉睡；水手在禱告，先知在睡覺。我們不要嘲笑他。逃到後來，人有時候真的會累，累到只想把自己關進最深、最暗、最安靜的地方。睡，是最安靜的逃。外面的風浪再大，只要心裡不醒著，就好像沒有事。"],["p","然後，船主走進底艙，說了一句話：你這沉睡的人哪，為何這樣呢？起來，求告你的神，或者神顧念我們，使我們不致滅亡。你聽見了嗎？「起來，求告」，這幾乎是神在 1:2 的原話，卻是從一位外邦船主的嘴裡說出來的。本來該對別人說「起來，呼喊」的先知，現在被別人這樣叫醒。神可以使用任何人，包括一位不認識祂的船主。我們不要看輕被神用來叫醒我們的人。"],["d",["底艙裡沉睡的約拿，和疲倦、憂鬱的人，有什麼不同？","不要把兩件事混在一起。本章寫的是一個「離開了差遣」的人，他沉睡，是逃跑的一部分；而今天有人整夜失眠，或是起不來，是身心的疲憊，需要的是醫治與陪伴，不是責備。所以，這一段不是用來叫累的人自責。它要我們問的是：我有沒有用「忙」或「睡」，去避開一個我心裡知道的呼召？如果你是累，請你好好休息，也請你找人陪伴。如果你是躲，請你起來，求告。你若是那位累了的人，請把這一段當作邀請：先休息，也讓人陪你，神不會因為你累就責備你。"]],["h","三、原文亮光：起來、下去、擲（1:2–15）"],["p","這一章有三個原文字，是約拿書的骨架。第一個是「起來」（qum）。1:2 神說「起來」；1:3 約拿「起來」逃；1:6 船主說「起來」求告；到了第三章，神第二次說「起來」，約拿又「起來」，這一次，是往尼尼微去。同一個動詞，六次，一次又一次，問的是：你起來，是往哪裡去？"],["p","第二個字，是「下去」（yarad）。1:3 約拿下到約帕，下到船裡；1:5 他下到底艙；2:6 他下到山根。四次「下去」，一路向下。聖經裡，離開本位的路，總是向下的：離開神給的位置，往下走，往隱藏的地方走。而與它相對的，是 1:2 惡「上到」神面前。你看見了嗎？人往下逃，神的面前卻是向上的；他逃得越深，越發現，神一直在那裡。"],["p","第三個字，是「擲」（hetil）。1:4 神擲出大風；1:5 水手把貨物擲進海裡；1:12 約拿說，把我擲下去；1:15 他們就把約拿擲下去。同一個動詞，四次。神擲風，是追；人擲貨物，是自救；約拿說「擲我」，是認罪；水手擲約拿，是不得已。這四次的擲，讓我們看見：這一整章，不是約拿一個人的故事，是神與一船人的故事。"],["d",["這些重複的動詞，是作者的設計，還是巧合？","從希伯來文看，這些重複，很可能是作者刻意編排的：約拿書的敘事，常用同一個字，在不同的場景裡出現，讓讀者自己看見關聯。我們不需要把每個重複都當成密碼，也不必為此去爭論；只要注意：當同一個字一再出現，經文常常在對我們說：請在這裡停一下。起來、下去、擲，這三個字，剛好把約拿的方向、神的追趕、與人的反應，連成一條線。讀經時，只要留意同一個字出現在哪些地方，經文常常就替我們把重點標出來了，這是最簡單、也最可靠的讀法。"]],["d",["「起來」這個動詞，為什麼這麼重要？","因為它是全卷的第一個命令，也是第一個回應。神說「起來」，約拿起來了，卻是為了逃；後來神再說一次「起來」，約拿又起來，這回是為了去。從頭到尾，神的話沒有變，變的是人的方向。這也是我們每天面對的處境：不是聽不懂，是聽懂之後，我們起來，往哪裡去？這個動詞提醒我們，順服不是一種感覺，是一個方向。所以每當你讀到「起來」，都可以安靜地問自己一句：我現在，是朝向神的話起來，還是背向神的話起來？"]],["h","四、承認、拋下，與被接住（1:7–17）"],["p","籤落在約拿身上。水手問：你以何事為業？你從哪裡來？你是哪一國，屬哪一族的人？約拿的回答，是全章最正確的一句話：我是希伯來人，我敬畏耶和華，那創造滄海旱地之天上的神。這是一句非常好的告白，可是你聽出來了嗎？他說他敬畏造海的神，卻正在往海上逃。知道，與活在所知道的裡面，是兩回事。水手聽了，就大大懼怕：你做的是甚麼事呢？"],["p","然後是約拿全章最誠實的一句：把我抬起來，拋在海中，海就平靜了，因為我知道，你們遭這大風，是因我的緣故。他沒有說「我悔改」，他只說：是因我。很短，卻很真。可是你看水手：他們沒有立刻照做，他們竭力盪槳，想把船攏岸，不願意讓一個人死。這一船外邦人，比先知更不願意傷害人。直到實在不能，他們才求告耶和華，第一次用祂的名字，說：不要使流無辜血的罪歸與我們。"],["p","他們把約拿拋下，海的狂浪就平息了。接著經文說：那些人便大大敬畏耶和華，向耶和華獻祭，並且許願。這句話，我們一個字都不加。他們後來如何，經文沒有說；我們只看見：在一個逃跑的先知身邊，一群本來求自己的神的人，認識了耶和華的名。最後一節，只有一句：耶和華安排一條大魚吞了約拿，他在魚腹中三日三夜。"],["p","請留意那個動詞：安排。神安排魚，後來也安排蓖麻、蟲子、東風。魚不是丟棄，是接住。這一章，沒有一個字說：神放棄了約拿。風是追他的，魚是接他的。約拿以為自己在逃，其實每一個轉角，都有一個安排在等他。"],["d",["水手「大大敬畏耶和華」，是不是說他們已經信主得救了？","經文只記了三件事：他們大大敬畏耶和華，向耶和華獻祭，並且許願。至於他們後來的信仰如何，聖經沒有說。我們不替經文下結論，不說「他們已經得救」，也不說「他們還沒有」。這裡真正重要的，是另一件事：神的名，被一船不認識祂的人認識了；而約拿，雖然在逃，仍然成為了神的工具。這提醒我們：神的作為，常常比我們的順服更大。我們可以放心地說：神的名被認識，是神自己做的工；至於每個人的終局，我們交在神的手裡，不替祂定案。"]],["p","請你再看一次這個畫面：一艘船，在風浪裡，滿船的人，各自不同的神，各自不同的禱告；底艙裡，一個人睡著。這個畫面，今天仍然在發生。世界在風浪裡，教會的聲音常常被別的聲音淹沒，而神的子民，有時卻在睡。船主對先知的那一句話，其實是神對教會的一句話：你這沉睡的人哪，為何這樣呢？起來，求告你的神。這不是羞辱，是邀請，也是盼望：因為被叫醒的人，才有機會成為祝福。"],["p","再留意一個細節：全船的人，每個人都在做自己能做的事。有人哀求，有人拋貨，有人盪槳。他們沒有把責任推給別人，也沒有等神先把風停下來。這些外邦的水手，在災難裡，反而比先知更像一群「起來」的人。神常常借著這樣的人，提醒我們，信仰不是躲起來的安靜，而是在風浪裡，仍然願意出力、仍然願意求告。"],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把約拿講成壞人、叛徒，用來嘲笑不順服的人。約拿是被神差遣的先知，也是後來被神挽回的人；這卷書的重點，不是羞辱一個人，是顯出神的不放手。檢驗標準是：會眾聽完，是更看見神的追趕，還是更熱衷於批評約拿？"],["p","第二個偏差，是把尼尼微，講成今日某個國家、民族或政權的名字。經文說的是「他們的惡達到我面前」，尼尼微是亞述的重要大城；本講義不把它等同今日任何族群，也不以此替任何仇恨、排外背書。檢驗標準是：會眾聽完，是更看見神對一座城的眼光，還是更熱衷於點名別人？"],["p","第三個偏差，是把大風講成「不順服就被神懲罰」的固定公式，讓正在風浪中的人，懷疑自己做錯了什麼。這一章的風，是神擲的，為的是追約拿；但經文沒有說，每一場風浪都是懲罰。耶穌的門徒，順服的時候也遇過風浪（可4:35–41）。檢驗標準是：在苦難裡的人，聽完是更靠近神，還是更自責、更害怕？"],["p","第四個偏差，是把 1:12 約拿說「把我拋下海」，講成英雄式的犧牲，或求死的理由。約拿在這裡是承認「是因我」；經文沒有稱讚他求死。如果有人心裡出現「不如消失」的念頭，請不要把這一節拿給他，請先陪伴他，並協助他尋求專業的幫助。檢驗標準是：聽的人，是更敢說出誠實的話，還是更覺得自己應該消失？"],["p","第五個偏差，是用「大魚」的科學可能性，去爭辯，甚至羞辱對這卷書的文體有不同看法的弟兄姊妹。1:17 的重點，是「耶和華安排」；經文沒有指明魚的種類。不論我們怎樣理解這卷書的文體，耶穌自己提到約拿（太12:39–41），這個重量不變。檢驗標準是：討論之後，大家是更靠近神的話，還是更靠近自己的立場？"],["d",["有人說大魚的故事不可能，我該怎麼回答他？","不需要馬上辯論。可以先問他：你最在意的是什麼？是在意科學，還是在意這卷書要說什麼？然後可以誠實地說：這卷書的重點，不在於魚的種類，而在於「耶和華安排」；基督徒對這卷書的文體，也有不同的看法，有人視為歷史敘事，有人視為帶著文學筆法的敘事。我們可以彼此尊重，把重心放在：神怎樣追回一個逃跑的人，也怎樣愛一座大城。你不必贏了這場辯論，才算有見證。帶著善意與耐心，比擁有完美的答案更重要；有時候，一杯茶、一次傾聽，比一場辯論更能打開一扇門。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「安靜地逃」。在華人的家庭與教會文化裡，很少人會大聲說「我不去」，我們更習慣說「再看看」「再說吧」「改天」「我最近比較忙」。這種逃，看起來很有禮貌，也不傷和氣，卻使一個應該起來的人，一直站在原地。約拿的「起來，卻往他施去」，就是這樣的逃：沒有爭吵，只是改變了方向。請你誠實地問自己：我有哪一件事，一直在說「再說吧」？不是要責備你，是要你在神面前，說出那個「再說吧」的名字。"],["p","第二個問題：我們很習慣「不要麻煩別人，也不要被人看見軟弱」。約拿在底艙沉睡，是一個人躲起來的樣子；而船主叫醒他，是別人走進他的黑暗。在華人文化裡，被叫醒，常常覺得丟臉，叫醒別人，又怕得罪人。可是這一章讓我們看見：神使用一位外邦的船主，把先知叫醒。若有人敢走進你的底艙，請你不要立刻防衛；若你看見別人在沉睡，請你不要輕易責備，只問一句：你還好嗎？我們一起求告，好不好？"],["p","讓我們再把這兩個處境放在一起看。我們常以為，逃跑的人是那些離開教會、不再禱告的人；其實最常見的逃跑，發生在教會裡面。一個人照常聚會、照常奉獻、照常微笑，卻在心裡有一個房間，鎖著，不讓神進去。約拿就是這樣的人：他是先知，他會說敬畏耶和華的話，他甚至在風浪中說出最正確的告白。可是他身體上船，心卻往另一個方向去。我們不需要先改變外面的樣子，我們需要先誠實：我心裡那個上了鎖的房間，是什麼？"],["p","也請你記得，神對逃跑的人，沒有一句責罵的話。這一章從頭到尾，神沒有對約拿說一句重話；祂只是擲出風，安排魚，然後等待。神的追趕，是慈愛的追趕。你若正在逃，不必先把自己修好，才敢回頭。你只要在底艙裡，睜開眼睛，聽那一聲：起來。"],["d",["我已經逃了很久，神還會再用我嗎？","第一章沒有答完這個問題，但它埋下了線索：魚是接住，不是丟棄；第三章，神的話「第二次」臨到約拿。這不是說，逃跑沒有代價；約拿付了船價，也經歷了風浪與深水。但經文要我們看見：神的呼召，不因一次的逃，就收回。你可以從今天開始，不是先證明自己配，而是先回答那一聲「起來」。你可以先說一句最簡單的話：主，我回來了。神的話第二次臨到約拿，也可以臨到你，不必等到你完全預備好。"]],["h","七、活出321——起來，去，求告"],["p","耶穌是我的榜樣。祂也在船上睡過，卻是在父的手裡安然入睡；風浪來了，祂站起來，說：住了吧！靜了吧！祂不是逃往他施，祂是向十字架走去，沒有一次轉身。祂說：不要照我的意思，只要照你的意思（路22:42）。"],["p","聖經是我的準則。我們讀約拿書第一章，不是要找一個人來責備，也不是要算三日三夜，而是讓聖經自己說話：神先開口，神擲出大風，神安排大魚，神不放棄一個逃跑的人。聖經的準則，既讓我們敬畏神的話，也讓我們安心，神的手一直在。"],["p","聖靈是我的引導。是聖靈，使我們聽見神在說「起來」；也是聖靈，使我們看見自己的他施。求祂幫助我們，不再用「再說吧」去搪塞，願意先起來一步。"],["p","讓耶穌作王。無己，是放下「我覺得不合理」「我比較懂」「我不想見那些人」這些理由，回到本位，讓神作神。讓耶穌作王，就是讓祂的話，比我的理由大，比我的恐懼大；讓祂決定，我該去哪裡，該說什麼。"],["p","讓耶穌得著一切的榮耀。風是神擲的，魚是神安排的，水手的敬畏，也是神做的。一切都是神的作為，不是約拿的功勞，也不是我們的功勞。榮耀歸給耶穌。"],["p","建立屬神的體系。一個屬神的群體，是一群聽見差遣、肯起來的人；逃的時候，有人叫醒；沉睡的時候，有人陪伴；誠實說出「是因我」的時候，有人接住，不是論斷。大家的焦點，都在耶穌。"],["d",["我可以怎樣分辨，這是神叫我「起來去」，還是我自己的衝動？","可以用三個問題檢驗：第一，這件事有沒有和聖經的話一致？第二，這件事是不是為了別人的生命，而不是為了我自己的面子？第三，有沒有一位屬靈的同伴，願意為你印證，並與你同行？如果三個答案都是「是」，你可以先走一小步，不需要一次走完。經文裡的神，總是先叫人起來，再一步一步地帶領。更重要的是：不要用「神叫我去」，去傷害任何人，或離開該守的責任。也要記得，分辨需要時間，不必急著一次定案；一步一步來，神的帶領常常是在路上變得清楚的。"]],["p","最後，請把這一課帶回你的日常：下一次，你聽見心裡有一個小小的聲音說「起來」，不要先問這合不合理，也不要先問別人怎麼看。先問一個最簡單的問題：我現在的腳，是朝向神的話，還是背向神的話？這一個問題，一天可以問很多次，在廚房、在車上、在辦公桌前、在睡前。慢慢地，我們就會從「安靜地逃」，學會「安靜地回來」。"],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我一向很清楚神的旨意，不需要別人叫醒我。經文對他說：連先知，也會往他施去；連一位船主，也能說出神早先說過的話。你可以先問自己：我有沒有一個，不許別人提起的方向？"],["p","恐懼型的人說：我怕起來去了，會出事，會失敗，會被人看輕，所以我寧願不動。經文對他說：神不是只差約拿，祂也擲風、安排魚，祂在前面，也在後面。你可以先把你的怕，說給祂聽，祂不是要嚇你，是在追你，要你不要躲。"],["p","羞恥型的人說：我曾經逃過，我曾經沉睡，我不配再被神差遣。經文對他說：魚不是丟棄，是接住；第三章，神會第二次說：起來。你可以對神說：求祢憐憫，我願意從這一步再起來。"],["p","受傷型的人說：我是被派去面對傷害我的人的，我不想去。經文沒有叫受傷的人，去面對傷害他的人。神的差遣，是為了生命，不是為了讓人再受傷害。你可以先對神說：求祢陪我，我還沒有力氣，讓我先休息，再來說下一步。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天睡前，花三分鐘，安靜地說：主，若有一件事，是我一直往反方向走的，求祢指給我，我先起來一步。連續七天，把你聽見的，寫下一句。"],["p","第二，找出一件你心裡早就知道該做、卻一直說「再說吧」的事，這個星期，寫下日期和時間，並告訴一位你信得過的人，請他一個星期後問你：做了嗎？"],["p","第三，這個星期，找一個你曾經用「忙」去躲開的人，打一通電話或傳一則訊息，只說一句：我最近想起你，你好嗎？"],["p","第四，如果你看見身邊有人像在底艙沉睡，不要急著勸，也不要責備，只陪他坐十分鐘，問他：你還好嗎？我們一起求告神，好不好？"],["p","第五，找出一個你心裡的「尼尼微」，一個你不想為他們呼喊的人或處境，只用三十秒，向神說：主，我還不想，但我把它交給祢。不必急著愛，只需誠實。"],["p","我宣告：神的話臨到我，祂先開口，我願意起來，不再用「再說吧」搪塞。"],["p","我宣告：我的他施，我要說出口；我不躲，也不再下去。"],["p","我宣告：神擲出的風，是追我；神安排的魚，是接我；祂不放棄我。"],["p","我宣告：耶穌是我的王，祂比我的理由大，比我的恐懼大，我要跟隨祂。"],["h","十、結語"],["p","約拿書第一章，是一通不想接的電話，一張往反方向的船票，一場神擲出的大風，一位叫醒先知的船主，一船敬畏耶和華的外邦人，和一條神安排的大魚。開頭，是神的話臨到約拿；中間，是約拿一路向下，下到約帕，下到船裡，下到底艙；結尾，是神安排一條大魚，把他接住，留給我們一個問題：神的追趕，是為了什麼？"],["p","在這一章，神要我們看見祂的心：祂是一位先開口的神；祂是一位不因人逃跑，就放手的神；祂也是一位，用風、用魚、用外邦的船主，把一個先知追回來的神。而這位神，在逃跑的人身邊，也使一船不認識祂的人，認識了祂的名。"],["p","所以，請你記得今天這一課的三個重點：神的話先於我們的路，我可以起來，不再往反方向走；我的他施，我可以說出口，神的風是追我，神的魚是接我；神不放棄逃跑的人，也沒有放棄任何一座大城。這一課的焦點，不在你懂不懂大魚，不在約拿有多糟，也不在你過去逃過幾次，而是那位先開口、擲出大風、安排大魚、又走進風浪的耶穌。"],["p","親愛的天父，謝謝祢，祢的話臨到我們，祢不放棄逃跑的人。求祢使我們聽見祢說「起來」，也使我們誠實地說出自己的他施；求祢安慰每一位正在沉睡、正在逃、或是太累的人，讓他們知道，祢的風是追，祢的魚是接。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人先把經文放進自己的心裡，看見自己的位置，不急著討論別人。"],["n","1. ★ 一章二節：神說：你起來往尼尼微大城去。你最近有沒有一件事，心裡知道神的話，卻一直在繞過去？請說出是哪一類，不必細節。"],["n","2. ★ 一章三節：約拿起來，卻逃往他施。你的「他施」，是哪一個方向？請說出一個，例如工作、家庭、教會或一個人。"],["n","3. ★★ 一章五節：約拿在底艙沉睡。你最近有沒有用「忙」或「睡」去躲一件事？請說出一個。"],["n","4. ★★★ 請在安靜中想一件事：一件你說了「再說吧」、卻一直沒有做的事。現在用一句話寫下它，並寫下你願意讓誰陪你，一起起來。"],["m","帶領提醒：請先安靜念一章二節與三節，再開始。不要點名逼人說。這一章會碰到逃避、疲憊、羞愧與求死的念頭：如果有人提到憂鬱、失眠、自傷的念頭或長期的無望感，不追問細節，不要求他「要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照一章三節，你心裡有沒有一個「起來，卻往另一個方向」的事？請只說出一個，例如一個決定、一個關係。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽一章六節船主說的「起來，求告你的神」，也聽一章十七節「耶和華安排」。你心裡聽見的第一個感覺是什麼？"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：一章四節是神擲出大風，一章十七節是神安排大魚。請用自己的話向組員說明：為什麼神的風與魚，是追，是接，不是丟棄？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你這個星期可以先走哪一小步，並當場說出一個時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，打一通電話、傳一則訊息，或安靜十分鐘禱告；寫下時間，並說出誰會問你：做了嗎？"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，像在底艙沉睡的人？請說出名字，並決定這個月用一句具體的話關心他，只陪伴，不責備。"],["n","11. ★★ 你的小組或教會，有沒有人用「再說吧」，推開了一個該做的事？請說出你可以怎樣，用邀請，不用責備，陪他起來。"],["n","12. ★★ 你有沒有一位，曾經在你逃的時候，叫醒你的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「起來，求告神」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人，不要用它論斷任何講員、教會、政府，不要拿尼尼微去套用任何今日的國家或族群，也不要用經文推算日子。若有人分享被傷害、被背棄、憂鬱或求死的念頭，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「他施」，放在神面前。一起念一章二節。"],["p","由帶領者為每一位禱告：求神使我們聽見祂說「起來」，也使我們誠實說出自己的他施。散會前，彼此問一句：你這星期要先起來哪一小步？"]]},"2":{"no":2,"vol":"《321約拿書講義》第2課·約拿書第2章","title":"救恩出於耶和華——深、禱、救","chars":4735,"min":60,"deep":8,"dchars":1517,"tchars":1271,"blocks":[["h","一、安靜下來的夜（2:1–2）"],["p","弟兄姊妹平安。你有沒有過這樣的夜晚：白天的忙亂都過去了，燈關了，手機放下了，四周突然很安靜。這時候，那些白天被擋在外面的聲音，一個一個走進來：我做過的事、我沒做的事、我說過的話、我逃過的方向。安靜，有時候不是平安，是一面鏡子。約拿書第二章，就發生在一個這樣的夜裡，只是約拿的夜，比我們的更黑，他在魚的肚腹中。"],["p","第一章結束的時候，約拿被一條大魚吞了。第二章第一句，非常簡單：約拿在魚腹中禱告耶和華他的神。請你留意這個「終於」。第一章，船上的每一個人都在呼求：水手各人哀求自己的神，船主叫約拿起來求告，連水手最後都向耶和華呼求。只有一個人，從頭到尾沒有開口，就是約拿。他在底艙睡著了。現在，他終於開口。不是在聚會裡，不是在講台上，是在一個沒有人看見、沒有出路的地方。"],["p","而且你聽他怎麼稱呼神：耶和華，他的神。這是全卷第一次，他用這麼近的說法。在第一章，他向水手說，我敬畏耶和華，那創造滄海旱地的天上的神，那是一個很好的信仰告白，卻像是在背誦一份資料。到了這裡，他說：我的神。人在最黑的地方，才說得出最近的話。"],["p","再聽他說什麼：我遭遇患難求告耶和華，你就應允我；從陰間的深處呼求，你就俯聽我的聲音。注意，這些動詞都是過去的：我求告了，你就應允了；我呼求了，你就俯聽了。他沒有說「求你救我出去」，他說「你已經聽見」。魚腹還是魚腹，水還是水，一點都沒有改變，可是他已經在說：神聽見了。這是禱告很重要的一個祕訣：有時候，禱告不是先改變我所在的地方，而是先改變我怎樣看自己所在的地方。"],["d",["約拿在魚腹中，為什麼不求神救他出去？","經文沒有記錄他求出去，這一點的確值得留意。有人認為，這是因為他已經沒有力氣再要求；也有人認為，這是這首詩的寫法，先說神已經應允，才說後面的處境。無論如何，我們不必逼自己每一次禱告，都要先提出一份願望清單。你可以像約拿一樣，先說：主，我在這裡，祢已經聽見我。把清單放在後面，也許禱告就從「要求」變成「同在」。這也提醒我們，被神聽見的平安，有時候比立刻被救出更早一步到來，而這份平安，是為了讓我們撐過等候的日子。"]],["h","二、你將我投下深淵（2:3–6）"],["p","接下來四節，是約拿一步一步下沉的描寫。第三節，他說：你將我投下深淵，就是海的深處；大水環繞我，你的波浪洪濤都漫過我身。你有沒有發現一件事？在第一章，是水手把約拿拋下去的，他自己也說：把我拋在海中。可是到了這裡，他說：是你。他沒有說水手，也沒有說自己，他說：你將我投下深淵。"],["p","這不是推卸責任。他在第一章，已經說了：是因我的緣故。這是另一件事：他在黑暗裡，看見了一隻手。那隻手，比水手的手更大，比海更大。再看下去：你的波浪，你的洪濤。浪是海的浪，卻是「你的」浪。神不是在海的外面，看著約拿掙扎；神是在浪的裡面。這是一種不容易的信心：在一個人最想問「神在哪裡」的時候，他說，連這片水，也屬於祢。"],["p","第四節，是整首詩的轉折：我從你眼前雖被驅逐，我仍要仰望你的聖殿。他說「被驅逐」，用的是亞當被趕出伊甸園的那個動詞。他覺得自己被趕出去了，被趕出神的眼前。可是下半句，他說：我仍要。這兩個字，是整卷書最溫柔的轉身。他被趕出去，他沒有轉頭離開那位趕他的神，他把臉，轉向聖殿的方向。聖殿在耶路撒冷，離海底何止千里，他看不見。可是他望著。信心，常常不是看見之後才相信，而是看不見的時候，仍然把臉轉向那個方向。"],["p","然後第五節、第六節，把下沉寫到最深：水環繞我，直到性命；深淵圍住我；海草纏繞我的頭。我下到山根，地的門將我永遠關住。你還記得第一章的那條線嗎？下到約帕，下到船裡，下到底艙，下到海裡，現在，下到山根。這是全卷最深的一個「下」。他說，地的門閂在我後面，永遠關住。門閂是從外面關上的，他在說，我被關在一扇，從裡面打不開的門後面。永遠。"],["p","可是接著，來了兩個字：你卻。「耶和華我的神啊，你卻將我的性命從坑中救出來。」人說「永遠」的地方，神說「不」。而這一句，還有一個我們不能漏掉的細節：「救出來」，原文是「帶上來」。往下的路，是約拿自己走的，一步一步，下到山根；往上的路，是神帶的。你看，他說「耶和華，我的神」，到了最深的地方，他說的，不是那位神，是我的神。"],["d",["「我從你眼前被驅逐」，這是說神真的把約拿趕出去了嗎？","這是約拿在詩歌裡的感受，不是神對他的最後判決。他的處境，看起來像是被趕出神的眼前；可是這首詩的後半，說得很清楚：神聽見了，神把他救出來。我們可以誠實地說出「我覺得被神丟棄」，這種感覺在詩篇裡也有；但是，感覺不等於事實。約拿教我們的，是把感覺說出來，同時仍然把臉轉向神。所以，當你覺得自己被神推開時，不妨把這個感覺原原本本說給神聽；說出口，本身就是把臉轉向祂的開始。"]],["h","三、原文亮光：下去、帶上來、救恩（2:6–9）"],["p","這一章有三個原文字，值得我們慢慢看。第一個，是「下去」（yarad）。約拿書的第一章，這個字出現了三次：約拿下到約帕、下到船裡、下到底艙；到了 2:6，約拿說，我下到山根，這是全卷最後一次的「下去」。你把這四次連起來看，是一條一直往下的線：約帕、船、底艙、山根。聖經常常用「下」描寫離開本位的路，離開神給的位置，就一路往下。"],["p","第二個，是「帶上來」（alah）。2:6 說，你卻將我的性命從坑中救出來，這個「救出來」，原文是「使上來」，與「下去」剛好相反。更有意思的是，這個字，在 1:2 也出現過：尼尼微的惡，上來到神的面前。同一個動詞：惡往上走，到神面前，神也把一個往下沉的人，往上帶。在這個字裡面，我們看見神的心：祂看見一座城的惡，也看見一個先知的沉，兩件事，祂都不能不管。"],["p","第三個，是「救恩」（yeshu'ah）。2:9 的最後一句，是全卷的樞紐：救恩出於耶和華。原文字面是「救恩屬於耶和華」。這個字，與「耶穌」這個名字，來自同一個字根。「耶穌」的意思，就是「耶和華是救恩」。這句話說，救的權柄，在神那裡，不在我們這裡，不在約拿，不在水手，也不在魚。而在新約，天使對約瑟說：你要給他起名叫耶穌，因他要將自己的百姓從罪惡裡救出來（太1:21）。約拿在深處說的那句話，成了一個人的名字。"],["d",["「慈愛」這個字，在約拿書出現幾次？為什麼要留意它？","原文的「慈愛」（chesed），在約拿書只出現兩次：一次在 2:8（約拿說，信奉虛無之神的人，離棄慈愛），一次在 4:2（約拿說，你是有豐盛慈愛的神）。你會發現，這兩處，剛好是約拿說話的兩個位置：在深處，他說離開神就離開慈愛；在第四章，他說神的慈愛太多了。這個字，像一個伏筆：他知道什麼是慈愛，可是他後來要面對的功課，是，當這個慈愛，臨到他不喜歡的人身上時，他怎麼辦。留意這個伏筆，讀到第四章時，你會更明白：約拿不是不懂慈愛，而是在慈愛臨到別人身上時，心裡出了狀況。"]],["d",["「救恩出於耶和華」和「人需要回應」，這兩件事矛盾嗎？","不矛盾。2:9 說救恩屬於神，這是恩典的核心；可是同一節，約拿也說：我必用感謝的聲音獻祭，我所許的願，我必償還。恩典不是叫人不動，是叫人有力量動。救恩屬於神，約拿的回應，是感謝與償還；下一章，約拿的回應，是起來，去尼尼微。我們不是靠行為得救，卻是為了好行為而得救（弗2:8–10）。換句話說，救恩是禮物，順服是收下禮物之後，用生命說的「謝謝」；兩者是同一份恩典的前後兩面，缺了哪一面，都不完整。"]],["h","四、虛無之神、感謝的聲音，與吐在旱地上（2:7–10）"],["p","第七節很短：我心在我裡面發昏的時候，我就想念耶和華。你注意，「發昏」，是一點力氣都沒有的時候。這不是一個高峰經驗，也不是一次很屬靈的感動，這是一個人的魂，快要熄滅的時候。就在這時候，他想念耶和華。我們常以為，要等自己有力氣，才可以禱告；經文說，不必。在最軟弱的地方，一個「想念」，就夠了。而且下半節說：我的禱告，進入你的聖殿，到了你的面前。沒有一句禱告，是丟在海裡的。"],["p","第八、九節，是兩種人的對照：那信奉虛無之神的人，離棄憐愛他們的主，但我，必用感謝的聲音獻祭與你。你看那兩個字：「但我」。有人離棄，但我，獻祭。他在第一章看過水手向耶和華獻祭許願，現在他說，我也要。然後，是那一句：救恩出於耶和華。這句話，他說得很好，真的很好。可是你要記得，整卷書的下半，神要把這句話，再問回給他一次：既然救恩屬於耶和華，那麼，神要不要救尼尼微，是誰的事？我們先不替第四章搶話，只把這一句記住：這是約拿最正確的一句話，也是他後來，最需要再聽一次的話。"],["p","最後一節，只有一句：耶和華吩咐魚，魚就把約拿吐在旱地上。你看，神對魚說話，魚就聽了。風聽了，籤聽了，海聽了，魚也聽了，全卷到這裡，所有的受造之物，都立刻回應了神。只有一個人，還沒有。約拿被吐在旱地上，他還沒有說，他會去尼尼微。被神救，是恩典；起來，去，才是接下來的事。這一章結束在旱地上，是在提醒我們：得救不是終點，是重新上路的起點。"],["d",["約拿的禱告，沒有一句認罪，這樣算悔改嗎？","這是一個真實的問題，也是這章很容易引起爭論的地方。這篇禱告，主要是感謝與信心的告白，有承認神掌權，有說「我被驅逐」，卻沒有明說「我有罪」。有人因此認為，這篇禱告不夠誠實；也有人認為，一個人在死亡邊緣，說出最真實的感謝，已經是回轉的開始。本講義不替約拿的內心下結論，只提醒一件事：聖經的「悔改」是一生的功課，神後來還要再問他一次。我們也一樣，不必用一次禱告，證明自己已經完全。所以，與其急著替他的禱告打分數，不如問自己：我最近的禱告，有沒有真話？有沒有一個我還沒有向神交出去的地方？"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把這章講成「人要落到谷底，才有資格禱告」。約拿在深處禱告，神聽見了；可是經文沒有說，人必須先落到絕境，神才肯聽。神隨時垂聽，包括平安的日子，包括你覺得自己沒有資格的日子。檢驗標準是：會眾聽完，是更願意隨時來到神面前，還是覺得要先受苦，才有資格禱告？"],["p","第二個偏差，是把 2:3「你將我投下深淵」，講成「所有的苦難，都是神親手降下的懲罰」。約拿在詩歌裡看見神的手在水手之上；可是這一章沒有說，每個人的苦難都是神的懲罰。尤其是受害的人，不應被告知：這是你的錯。檢驗標準是：受苦的人聽完，是更知道神在，還是更覺得神恨他？"],["p","第三個偏差，是用「三日三夜」推算日期，或者把魚腹、陰間、山根的每一個細節，都當成耶穌的預言。新約自己作過的連結，是「約拿的神蹟」（太12:39–41）；其餘的細節，我們說「這使我們想起」，不說「這是預言」。檢驗標準是：會眾聽完，是更仰望復活的主，還是更熱衷於找隱藏的密碼？"],["p","第四個偏差，是把 2:8「信奉虛無之神的人」，當作嘲笑別的信仰的根據。這句話是約拿向神的告白，不是叫我們去羞辱鄰舍。耶穌教我們愛人如己，連仇敵也要愛。檢驗標準是：會眾聽完，是更看見神的慈愛，還是更熱衷於貶低別人？"],["p","第五個偏差，是對正在憂鬱、長期痛苦的人說：你看約拿，禱告就出來了，你要有信心。約拿的故事還沒有完；第四章，他再次說想死。有人的「魚腹」很長，需要陪伴，也需要專業的幫助。檢驗標準是：痛苦中的人聽了，是被陪伴，還是被催促？"],["d",["我若曾經跟神說過「願意」，卻沒有做到，神還會聽我的禱告嗎？","會。約拿在第一章逃跑，第二章仍然被神聽見。這並不是說，逃跑沒有後果；他付了船價，也經歷風浪與深水。而是說，神的耳朵，不因為我們的不完全就關上。你可以像約拿一樣，誠實地說：主，我逃過，我在這裡，求祢聽。聽見不等於認可我們的逃，聽見是神的慈愛，也是祂把人帶上來的開始。神聽，不是因為我們做得夠好，而是因為祂的慈愛；從聽見的那一刻，祂就預備好了讓我們重新起來的路。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「不把軟弱說出口」。在華人的家庭與教會裡，我們常常會說：我沒事，我很好，不用擔心。我們把魚腹藏起來，把山根藏起來，然後在聚會裡微笑。約拿在魚腹中，說的是很真實的話：我遭遇患難，我被驅逐，水環繞我，直到性命，我發昏。這些詩句，在聖經裡，不是被刪掉的，而是被收進正典的。神喜歡真實的禱告。請你誠實地問自己：我有沒有一個「山根」，是我從來沒有對神、也沒有對任何人說出口的？"],["p","第二個問題：我們很習慣「用禱告完成任務」。禱告，變成一份清單：求平安、求健康、求工作、求孩子，求完了就結束。約拿的禱告，卻很不一樣：他說神聽見了，說神把他救出來，說他要感謝，說救恩屬於耶和華。這是一種「同在」的禱告，不只是「要求」的禱告。在我們這樣忙碌的文化裡，請你這個星期，給自己一個機會，不為了要什麼，只是說：主，我在這裡，我知道祢聽見了。"],["p","這兩個問題，其實是同一件事的兩面：我們不習慣在神面前，只當一個需要被聽見的人。我們習慣當一個有用的人、一個有進度的人、一個沒有問題的人。可是約拿書第二章，邀請我們，把這些頭銜放下，回到最簡單的位置：一個在深處的人，對一位聽得見的神，說一句話。這個位置，一點都不丟臉，因為連先知，也曾經站在這裡。"],["d",["在禱告時，我常常分心、說不出話，這樣算禱告嗎？","算。約拿在「發昏」的時候，只剩下「想念」，這樣的禱告，神也聽見了。聖靈在我們不知道怎樣禱告的時候，用說不出來的歎息替我們禱告（羅8:26）。你可以從一句很短的話開始：「主，我在這裡。」分心的時候，不必責備自己，輕輕再說一次就好。神看重的是你轉向祂，不是你的句子多完整。你也可以用一句話禱告，例如「主，我在這裡」，一天說很多次，這樣的禱告，同樣是真實而有力量的，神聽的是你的心，不是你的辭藻。"]],["h","七、活出321——在深處，仍然仰望"],["p","耶穌是我的榜樣。耶穌也下去過。祂說，約拿三日三夜在大魚肚腹中，人子也要這樣三日三夜在地裡頭（太12:40）。祂不是因為逃，是為了我們，下到地的門被關上的地方。祂在最深的時候，說：父啊！我將我的靈魂交在你手裡（路23:46）。然後，在第三天，那位把約拿帶上來的神，把祂的兒子，從死裡帶了上來。"],["p","聖經是我的準則。我們讀約拿書第二章，不是要學一個漂亮的禱告格式，也不是要推算三日三夜；我們讓聖經自己說話：約拿在深處說了真話，神聽見了；救恩屬於耶和華。聖經的準則，讓我們不需要假裝，也不需要自己爬上來。"],["p","聖靈是我的引導。是聖靈，在我們不知道怎樣禱告的時候，用說不出來的歎息替我們禱告（羅8:26）。約拿在魚腹中，發昏的時候，想念耶和華，這個「想念」，也是被引導的。求祂幫助我們，在深處，不急著說漂亮的話，只說真話。"],["p","讓耶穌作王。無己，是放下「我要自己想辦法」「我要自己爬上來」，回到本位：救恩屬於耶和華，不屬於我。讓耶穌作王，就是讓祂決定怎樣、何時，把我從深處帶上來；也讓祂決定，他要救哪些人。"],["p","讓耶穌得著一切的榮耀。約拿被帶上來，不是約拿的功勞，不是他的禱告多漂亮，是神吩咐魚，魚就聽了；是神把他的性命從坑中救出來。榮耀歸給耶穌，因為救恩出於耶和華。"],["p","建立屬神的體系。一個屬神的群體，是一群敢把魚腹說出口的人：有人在深處，有人陪他禱告；沒有人催促他快點好，沒有人急著給答案；大家一起記得：救恩，是出於耶和華。"],["d",["我可以怎樣陪伴一個正在「魚腹」中的人？","不急著給答案，是最重要的一件事。可以先說：我在這裡，我陪你。可以問他：你想不想我為你禱告？可以一起讀一首詩篇，例如詩篇 42 或 130，不是要他振作，而是讓他知道，聖經裡早就有人這樣禱告。陪伴不是替他爬上來，是和他一起，把臉轉向神的方向。如果他有傷害自己的想法，請不要獨自承擔，請協助他找專業的幫助。陪伴最重要的是持續：不是一次長談，而是之後的一通短短的問候，讓他知道，你沒有離開，神也沒有。"]],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我可以靠自己爬上來，不需要別人陪我禱告。經文對他說：人往下的路是自己走的，往上的路是神帶的；救恩屬於耶和華。你可以先問自己：我有沒有一件事，是我一直想靠自己解決，卻從來沒有真的交給神的？"],["p","恐懼型的人說：我怕說出真話，怕被人看輕，怕神聽了生氣。經文對他說：約拿說了很多真話，被收進了聖經；神沒有生氣，神聽見了。你可以先把你的怕，用一句話說給神聽。"],["p","羞恥型的人說：我逃過，我沉睡過，我沒有資格禱告。經文對他說：約拿逃過，神仍然聽見他在魚腹中的聲音。你不需要先把自己整理乾淨，才開口；你可以從「主，我在這裡」開始。"],["p","受傷型的人說：我被丟進深處，我覺得被神丟棄。經文對他說：你可以把這個感覺說出口，詩篇裡也有人這樣說；可是請你同時記得，那位神，沒有離開，祂在浪的裡面。你不需要馬上相信，只需要先讓一個人，陪你坐一會兒。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天找三分鐘，安靜地說：主，我在這裡；祢已經聽見；救恩出於祢。連續七天，把你說出口的一句真話，寫下來。"],["p","第二，寫下你生命裡的一個「山根」，那個你覺得自己被關起來的地方，再寫下，一件神曾經把你帶上來的事，哪怕很小。把這兩件事，放在一起看。"],["p","第三，找一位你信得過的人，告訴他你的一個「深處」，請他陪你禱告一次，不必給答案，也不必給建議。"],["p","第四，這個星期，為一件你習以為常的事，寫下一句感謝，並且當面或傳訊息，對一個人說出口。"],["p","第五，留意身邊正在「魚腹」裡的人，不急著教他、不急著勸他，只問一句：我可以陪你坐一會兒嗎？"],["p","我宣告：我不假裝，我敢在神面前說真話。"],["p","我宣告：我的禱告，不是丟在海裡的，它到了神的面前。"],["p","我宣告：往下的路是我自己走的，往上的路是神帶的。"],["p","我宣告：救恩出於耶和華，耶穌是我的王，我不必自己爬上來。"],["p","請你把這一章，當作一個邀請，而不是一份功課：今晚，當四周安靜下來的時候，不要急著打開手機，也不要急著把心裡的聲音壓下去。讓它們進來，然後，一個一個，交給那位聽得見的神。你不需要整理好，不需要說得漂亮，只需要開口。"],["h","十、結語"],["p","約拿書第二章，是一個安靜下來的夜，一首在魚腹中的詩，一個下到山根的人，一個「你卻」，一句「救恩出於耶和華」，和一條聽從神吩咐的魚。開頭，是約拿終於開口；中間，是他一路下沉，下到山根，下到地的門被關上的地方；結尾，是神對魚說話，魚就把他吐在旱地上。"],["p","在這一章，神要我們看見祂的心：祂是一位在最深的地方，仍然聽見的神；祂是一位在浪的裡面，不是在浪的外面的神；祂也是一位，把人從坑中帶上來的神。而這位神，在約拿還沒有起來的時候，已經在預備，下一次，對他說話。"],["p","所以，請你記得今天這一課的三個重點：在深處，我可以說真話；神聽見了，救恩屬於祂；我不必自己爬上來。這一課的焦點，不在你禱告得多漂亮，不在你下得多深，也不在你過去逃過多少次，而是那位下到地的門被關上的地方、又從死裡復活、把我們帶上來的耶穌。"],["p","親愛的天父，謝謝祢，祢在最深的地方仍然聽見我們。求祢使我們在深處不假裝，敢說真話；求祢安慰每一位正在魚腹中的人，讓他們知道，祢在浪的裡面，祢要把他們帶上來。救恩出於祢，榮耀歸給祢。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人把自己的「深處」帶到神面前，不急著解決，也不急著安慰別人。"],["n","1. ★ 二章二節：約拿說：你就應允我。你最近有沒有一次，只說「主，我在這裡」，就覺得被聽見了？請說出一個場景。"],["n","2. ★ 二章三節：約拿說：是你將我投下深淵。你生命裡有沒有一個「深處」，你曾經不知道神在哪裡？請只說一個詞，例如：病、失業、關係、失去。"],["n","3. ★★ 二章七節：發昏的時候，我就想念耶和華。你最近有沒有一次，力氣用盡，只剩下「想念」？那一刻，你想到的是什麼？"],["n","4. ★★★ 請在安靜中想一件事：一件你一直沒有對神、也沒有對人說出口的「山根」。現在用一句話寫下它，並寫下你願意讓誰，陪你禱告。"],["m","帶領提醒：請先安靜念二章二節與九節，再開始。不要點名逼人說。這一章會碰到失落、憂鬱、孤單與被丟棄的感覺：如果有人提到長期的憂鬱、失眠、傷害自己的想法，不追問細節，不要求他「要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照二章六節，你有沒有一個「山根」，覺得被關在一扇打不開的門後？請只說出一個，例如一個處境、一段關係。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽二章九節「救恩出於耶和華」，也聽二章六節「你卻」。你心裡聽見的第一個感覺是什麼？"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：二章三節約拿說「是你將我投下深淵」，二章六節說「你卻將我救出來」。請用自己的話向組員說明：看見神的手在深處，為什麼不是推卸責任？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你可以向神說的一句真話，並當場說出一個時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，用三分鐘說「主，我在這裡」；寫下時間，並說出誰會問你：說了嗎？"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，正在「魚腹」中的人？請說出名字，並決定這個月用一句具體的話關心他，只陪伴，不給答案。"],["n","11. ★★ 你的小組或教會，有沒有人習慣把軟弱藏起來？請說出你可以怎樣，用邀請，不用逼問，陪他說出一句真話。"],["n","12. ★★ 你有沒有一位，曾經在你的深處陪你禱告的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「在深處說真話」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去評斷任何人的禱告、悔改或信心，不要用「三日三夜」推算日子，也不要用經文貶低任何人的信仰。若有人分享被傷害、被遺棄、憂鬱或想傷害自己的念頭，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「山根」，放在神面前。一起念二章九節。"],["p","由帶領者為每一位禱告：求神使我們在深處說真話，也使我們記得，救恩出於耶和華。散會前，彼此問一句：你這星期要對神說哪一句真話？"]]},"3":{"no":3,"vol":"《321約拿書講義》第3課·約拿書第3章","title":"耶和華的話二次臨到——起、信、悔","chars":4703,"min":60,"deep":8,"dchars":1520,"tchars":1266,"blocks":[["h","一、第二次機會（3:1–3）"],["p","弟兄姊妹平安。你有沒有得到過「第二次機會」？也許是一次考試重考，也許是一份你以為沒有希望的工作，又被人問了一次：你還要不要來？也許是一段關係，在你以為已經結束的時候，有人又說了一次：我們再試試看。第二次機會，和第一次最大的不同，是你已經知道，自己曾經搞砸過。你帶著這個記憶走進去，所以，那個「再來一次」，往往比第一次更重，也更珍貴。約拿書第三章，就是從一個「第二次」開始的。"],["p","第一節，只有一句：耶和華的話二次臨到約拿。請你把它和 1:1 並排來看：「耶和華的話臨到亞米太的兒子約拿」；「耶和華的話二次臨到約拿」。只多了兩個字：二次。神沒有換一個先知，也沒有換一個命令，更沒有一句責備。祂把同一句話，再說一次。你可以想像，約拿站在旱地上，滿身是魚腹的味道，也許還在想：神會不會對我失望了？這個時候，神的話又來了。這就是恩典的樣子：它不先算帳，它先說話。"],["p","第二節，神說：你起來，往尼尼微大城去，向其中的居民宣告我所吩咐你的話。你注意一個小小的差別：第一次，神說去呼喊他們的惡；這一次，神說，宣告我所吩咐你的話。約拿要說的，不是他自己想說的，也不是他自己想像的。順服，不是只是「去」，順服，是把嘴交給神。"],["p","然後第三節：約拿便照耶和華的話起來，往尼尼微去。你還記得 1:3 嗎？「約拿卻起來，逃往他施去」。同一個動詞，同一個人，只是這一次，方向對了。逃跑的人，被神挽回，又起來了。我們不要輕看這一節的簡單：沒有任何一個形容詞，沒有一句「他心裡多麼掙扎」，沒有一句「他嘆了一口氣」。經文只說：他便照耶和華的話起來。有時候，順服真的就是這麼樸素，沒有音樂，沒有眼淚，只是起來，走。"],["d",["約拿第二次起來，是心甘情願的嗎？","經文沒有說他心甘情願，也沒有說他勉強。我們只看見他起來了。到了第四章，我們會發現，他的心並沒有在這一章被完全改變。這提醒我們：順服與心意的完全一致，有時需要時間。神的第二次呼召，不是要等我們的心完全預備好，才來；祂先說話，我們先起來，心意可以在路上被帶領。這不是鼓勵我們勉強，而是說，不要等到感覺對了，才動身。所以，若你現在還沒有「感覺」，也不要緊，先把腳步邁出去一小步，感覺常常會在行走的路上，慢慢跟上來。"]],["h","二、五個詞的講道（3:4）"],["p","約拿進了城，走了一日，他開口了。他的整篇講道，在原文只有五個詞：再等四十日，尼尼微必傾覆了。就這樣。沒有說「你們要悔改」，沒有說「或者神會憐憫」，沒有任何一個出路。短，冷，一點邀請都沒有。如果你是一位傳道人，你大概會對這篇講道搖頭：這太不合格了。可是，神的話，不需要靠講員的口才。就是這五個詞，落在一座大城裡，產生了整卷書最大的轉變。"],["p","不過，請你留意這五個詞裡的兩個細節。第一個，是「再等四十日」。神給了時間。不是今天，不是馬上，是一段可以回轉的空間。神的警告，裡面常常藏著一個邀請：你還有時間。第二個，是「傾覆」這個字。它在希伯來文是 hafakh，意思是翻轉、倒轉。它可以是毀滅式的傾覆，像所多瑪；也可以是翻轉，像詩人說的，你將我的哀哭變為跳舞。約拿心裡想的，是前一種；可是這座城後來經歷的，是後一種。同一個字，兩個結局。"],["p","我們也要誠實說一件事：我們不用「四十日」推算任何日期，也不把這個故事當成時間表。這一節的重點，不是數字，是神在宣告裡，留下了一個空間。很多時候，神的警告不是要嚇我們，是要在我們還來得及的時候，叫我們轉身。"],["d",["約拿的講道這麼短、這麼冷，為什麼仍然有果效？","經文沒有解釋，但它提示我們：果效不在講員，在神的話。神的話臨到約拿，約拿宣告的是神所吩咐的話，所以，話語自己帶著重量。這並不是說我們不需要預備、不需要愛心；耶穌的講道是流著淚、張開雙手的。而是說：傳講的人要放下「我要講得精彩」的壓力，回到本位，信靠神的話自己會做工。這是一種釋放。這也讓我們輕鬆一些：傳福音的人，只要忠心地把神的話帶出去，結果是神的事，我們可以安心交託。"]],["h","三、原文亮光：信服、回轉、後悔（3:5–10）"],["p","這一章有三個原文字，是第三章的骨架。第一個，是「信服」（aman）。3:5 說：尼尼微人信服神。這個字，與「亞們」是同一個字根，意思是「站穩、可靠」。他們不是「承認有這位神」，而是把整個身子，站在這位神的話上。你注意，他們還沒有看見任何神蹟，只聽見了五個詞，就把重量交上去。而且，第三章裡，尼尼微人與敘事者稱神為 Elohim，不是耶和華這個立約的名字；他們不知道這位神的名字，卻已經站在祂的話上。"],["p","第二個，是「回轉」（shuv）。3:8 說：各人回頭離開所行的惡道；3:9 說：或者神轉意後悔；3:10 說：他們離開惡道。這個字出現三次，人在回轉，神也在回轉。你看見了嗎？這是一個很美的畫面：人往神那邊轉，神也往人這邊轉。悔改，不是一個人孤單地轉身，是兩個方向，在同一個點相遇。"],["p","第三個，是「惡」（ra'ah）。3:8 說：離開所行的惡道；3:10 說：他們離開惡道，神就後悔，不把所說的災禍降與他們了。「惡道」的惡，與「災禍」的災，在希伯來文是同一個字。人離開惡，神就不降災；災與惡，是同一個字，好像一面鏡子。更有意思的是，這個字，在下一節，會落在約拿身上：4:1 說，約拿大大不悅，這個「不悅」，原文也是 ra'ah，他覺得，這是一件大惡事。一個字，從尼尼微的惡，到神要降的災，到約拿心裡的不悅，貫穿全卷。"],["d",["「後悔」這個字，用在神身上，是什麼意思？","聖經用人能懂的話，說神的行動。「後悔」（nacham）在這裡，不是說神做錯了，不是說神改變了本性，也不是說神原來不知道結果。耶利米書 18:7–8 說得很清楚：神若說要拔出、毀壞，但那國回轉離開惡，神就後悔，不把災禍降給他們。這是神自己所啟示的原則：祂的警告，是為了叫人回轉；人一回轉，祂就以憐憫回應。所以，「神後悔」，是神信實的另一面，不是祂不可靠的記號。這樣讀，我們既不會把神看成反覆無常，也不會把祂看成冷冰冰的機器，而是一位真實回應人的、有位格的神。"]],["d",["尼尼微人是憑什麼知道要「離開惡道」的？","經文沒有說。約拿只宣告了傾覆，沒有說「回頭」；可是王的令裡有「回頭離開惡道，丟棄強暴」。我們不替經文補上它沒有說的事。我們只能說：神的話落在人心上，人就知道如何回應。耶穌也說過，聖靈要叫世人為罪、為義、為審判，自己責備自己（約16:8）。悔改，不是靠講員的技巧，是聖靈在人裡面的工作。這讓我們在傳福音時，多了一份安靜的信心。這讓我們多了一分安靜的信心：我們盡力把話說清楚，其餘的，我們交給那位在人心裡動工的聖靈。"]],["h","四、從最大的到至小的，一同起來（3:5–9）"],["p","第五節說，尼尼微人信服神，便宣告禁食，從最大的，到至小的，都穿麻衣。你注意這個順序：是百姓先信，然後，消息才傳到王的耳中。不是王先下令，百姓才跟著做；是整座城，先一起轉了。這一節提醒我們：復興，常常不是從講台往下開始，而是從一群人的心開始。當然，王的回應也很重要。"],["p","第六節的畫面，很動人：王就下了寶座，脫下朝服，披上麻布，坐在灰中。四個動作：離開寶座，脫下朝服，披上麻布，坐在灰中。你注意第一個動詞：他「起來」，離開他的寶座。這是約拿以外，全卷第一個以行動「起來」的人。約拿的起來，花了兩次才對；尼尼微王的起來，一次，就對了。這不是要羞辱約拿，而是要我們看見：神的話落在誰的心上，誰就起來。一個擁有權力的人，願意從寶座上下來，坐在灰裡，這是整卷書最強的畫面之一。"],["p","第七、八節，是王的令：人不可嘗什麼，牲畜不可吃草、也不可喝水，人與牲畜都當披上麻布，人要切切求告神，各人回頭離開所行的惡道，丟棄手中的強暴。請你特別看最後一句：丟棄手中的強暴。是「手」。不是只有「心」。悔改，不只是覺得難過，是我手中，抓著什麼，我要放下；是我今天，怎麼對人，我要改變。我的帳，我的話，我手中那個不肯放的怨，都是「強暴」可以進來的地方。這是整章最實在的一句話。"],["p","然後第九節：或者神轉意後悔，不發烈怒，使我們不致滅亡，也未可知。原文的開頭，是四個字：誰知道呢。你看尼尼微人的態度：他們沒有說，神一定會饒恕我們。他們說，誰知道。他們把自己，放在神的憐憫之下，而不是放在神的債主的位置。這是真悔改的記號：我不拿「我已經悔改了」，去要求神必須饒恕我；我把一切，交在祂的手裡。"],["d",["我若悔改了，神就一定會照我的意思、消除後果嗎？","不一定。3:10 寫的是，神收回了所宣告的毀滅；可是我們不能把這一節，變成對每個處境的保證。有時候，一個人悔改了，神赦免了他，現實中的後果，仍然需要他去面對，例如一段受傷的關係、一筆需要還的債、一份需要時間重建的信任。悔改的意義，不是保證結果，而是回到神面前、回到對的方向。尼尼微人說「誰知道」，這種謙卑，也是我們的方向。所以，悔改之後，仍要有耐心：重建需要時間，神的赦免是立刻的，而生命的更新，是一段與祂同行的路。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是用「再等四十日」推算日期，或把這個故事變成時間表。四十日是神給的一段時間，也是約拿宣告的內容；本講義不算日子，不排時間表。檢驗標準是：會眾聽完，是更看見神給人時間悔改，還是更熱衷於算數字？"],["p","第二個偏差，是把尼尼微人的悔改，講成「全城都已經得救」，或「他們的悔改保證永遠有效」。經文記的，是這一次的悔改與神的憐憫；至於後來的歷史，那鴻書會說。檢驗標準是：會眾聽完，是更敬畏神的憐憫，還是更熱衷於替別人定案？"],["p","第三個偏差，是把約拿五個詞的講道，講成傳福音只需要說一句警告，不需要關係與愛。約拿的講道冷而無邀請，這正是第四章要處理的問題；耶穌不是這樣，祂說：凡勞苦擔重擔的人，可以到我這裡來。檢驗標準是：會眾聽完，是更看見耶穌的邀請，還是以為福音只是一句警告？"],["p","第四個偏差，是把 3:6 尼尼微王的行為，講成「只要領袖悔改，全民就得救」，或用它要求政治人物。本章的順序，是百姓先信服，王後來聽見；經文沒有叫我們把悔改的責任推給領袖。檢驗標準是：會眾聽完，是先看見自己，還是更熱衷於指責領袖？"],["p","第五個偏差，是用尼尼微的悔改，指責今日某個國家或族群，說「他們應該像尼尼微一樣悔改」。本章寫的是一座古城因聽見神的話而回轉；我們不拿它比對今日任何國家或族群，也不替任何仇恨背書。檢驗標準是：會眾聽完，是先問自己，還是更熱衷於點名別人？"],["d",["尼尼微人後來又犯罪被毀滅，這樣他們的悔改有意義嗎？","有意義。那鴻書記載了尼尼微後來的結局，說明一次的悔改，不保證後代永遠正直。可是這不能抹去這一次的恩典：神真的聽見了，真的憐憫了。每一次的悔改，在神面前都是真實的；每一代人，都需要再次回轉。這也提醒我們：今天的悔改，不是為了買一勞永逸的保險，而是為了今天，和神同行。這提醒我們，不要把一次的屬靈經歷，當成永遠的保證，而要每天、每個階段，都再一次，回到神面前。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「失敗一次，就被貼上標籤」。在華人的家庭、職場與教會裡，一個人搞砸一次，常常被記很久：他曾經離婚、他曾經離開教會、他曾經欠債、他曾經犯過錯。標籤一旦貼上，第二次機會很難來。可是約拿書第三章，神的話「二次」臨到，沒有一句責備。這是一個很重要的提醒：神不替我們貼標籤。請你誠實地問自己：我有沒有一個人，我還在用過去的標籤看他，沒有給他第二次機會？我是否也在用過去的標籤，看我自己？"],["p","第二個問題：我們很習慣「不好意思說對不起」。尼尼微王下了寶座，坐在灰中，在全城面前，公開謙卑。可是在華人文化裡，面子很重要，尤其是長輩、領袖、父母，很難說「我錯了」。悔改，常常變成「大家心裡知道，但是不說」。經文說，悔改要落在手上，落在行為上：丟棄手中的強暴。如果你是領袖、是家長，這一章邀請你：不要等別人先低頭，你先從寶座上下來。"],["d",["我該怎樣給一個曾經傷害我的人「第二次機會」？","不要把「第二次機會」與「立刻恢復信任」混在一起。神給約拿第二次機會，是再次差遣，不是說第一次的後果不存在。在人與人的關係裡，原諒是一個選擇，信任需要時間與行為來重建。如果你曾經被傷害，特別是被暴力或虐待傷害，請不要被這一章催促：你不需要馬上回到傷害你的人面前，也不需要馬上和解。請先尋求安全與陪伴，必要時也尋求輔導與專業的協助。第二次機會，從來不應該使受傷的人，再次受傷。你可以先從為對方禱告開始，或只是不再主動報復，這些都是很實在的一小步，神都看見。"]],["p","最後，請你把這一章，當作一面鏡子，不是照別人，是照自己。尼尼微人聽了五個詞就回轉，我們聽過多少篇講道、讀過多少次經文？也許問題不在於我們聽得不夠多，而在於我們聽見之後，有沒有「起來」。信服不是知道，信服是站穩；回轉不是感覺，回轉是手放下。今天，神的話，可能已經第二次、第三次，臨到你了。你，要怎麼回應？"],["p","也請你記得，神的第二次，往往不是在你準備好的時候來，而是在你最不敢期待的時候來。約拿剛從魚腹裡被吐出來，滿身狼狽，神的話就到了。不要等到自己好一點，才聽。就在你現在的位置，這一刻，神的話，已經在你面前。"],["d",["我常常「起來」又跌倒，神會厭煩嗎？","神的第二次，也可以是第三次、第七十個七次。聖經的神，不是在算我們失敗的次數，而是在等我們再起來。約拿在第四章仍然會跌倒，神仍然沒有放棄他，繼續問他問題。你可以對神說：主，我又跌倒了，我還要再起來。祂的憐憫，每天早晨都是新的（哀3:22–23）。不要因為跌倒，就停止起來。所以，不要等到不再跌倒才起來；就在跌倒的地方，再說一次：主，我願意，祢的恩典，足夠我再起來。這句禱告，神天天都樂意聽。"]],["h","七、活出321——第二次，起來，離開惡道"],["p","耶穌是我的榜樣。耶穌說：當審判的時候，尼尼微人要起來定這世代的罪，因為尼尼微人聽了約拿所傳的就悔改了。看哪，在這裡有一人比約拿更大（太12:41）。約拿只說了五個詞，冷而沒有邀請；耶穌卻流著淚，張開手，說：凡勞苦擔重擔的人，可以到我這裡來（太11:28）。祂是比約拿更大的那一位，因為祂不只是宣告，祂親自走向十字架，為我們付上悔改的代價。"],["p","聖經是我的準則。我們讀約拿書第三章，不是要排四十日的時間表，也不是要比較誰的悔改更徹底；我們讓聖經自己說話：神的話第二次臨到，尼尼微人信服，離開惡道，神就後悔。聖經的準則，讓我們不需要用過去的標籤看人，也不需要用過去的失敗看自己。"],["p","聖靈是我的引導。是聖靈，叫世人為罪、為義、為審判，自己責備自己（約16:8）。尼尼微人聽了五個詞，就信服神，我們相信，這是神的靈在做工。求祂幫助我們，聽見神第二次的話，不遲疑，起來。"],["p","讓耶穌作王。無己，是放下「我配不配被再用」「他配不配被原諒」這些審判者的位置，回到本位：我是被神憐憫的人，不是憐憫的決定者。讓耶穌作王，就是讓祂說，誰能得到第二次機會；也讓祂的話，比我的失敗大。"],["p","讓耶穌得著一切的榮耀。尼尼微人的悔改，不是約拿的口才，也不是王的魄力，是神的話，與神的憐憫。榮耀歸給耶穌，因為是神使人回轉，也是神使人得著憐憫。"],["p","建立屬神的體系。一個屬神的群體，是一群聽見神的話，就一起「起來」的人：從最大的到至小的，一同謙卑；有人先從寶座上下來，有人丟棄手中的強暴；沒有人替神設限，大家一起說：誰知道呢，或者神轉意。"],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我不需要在別人面前低頭，我有我的難處。經文對他說：尼尼微王，在全城面前，下了寶座，坐在灰中。真正的尊貴，不是不低頭，是願意低頭。你可以先問自己：我有沒有一件事，需要先說一句「我錯了」？"],["p","恐懼型的人說：我怕第二次還是做不好，所以不敢再試。經文對他說：神第二次說話，沒有一句責備；祂先來，你只要起來。你可以先走一小步，不需要一次走完。"],["p","羞恥型的人說：我曾經搞砸，我不配再被神用。經文對他說：神的話，二次臨到約拿。你不需要先洗乾淨，才來。你可以對神說：求祢憐憫，我願意從這一步再起來。"],["p","受傷型的人說：我被人傷害過，我不想再給任何人第二次機會。經文沒有叫受傷的人，立刻回到傷害他的人面前。神的憐憫，是為了生命，不是為了讓人再次受傷。你可以先對神說：求祢陪我，我還需要時間。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天找三分鐘，對神說：主，若祢再說一次，我願意起來。連續七天，把你聽見的一句話，寫下來。"],["p","第二，寫下一件你曾經逃過或搞砸、以為神不會再用你的事，並問：神的話，現在對這件事說什麼？再告訴一位你信得過的人。"],["p","第三，找出你「手中的強暴」：一句傷人的話、一個不公平的做法、一次不肯放下的怨，這個星期，丟棄其中一件，並寫下你怎麼做。"],["p","第四，找一個你還在用「過去的標籤」看待的人，這個星期，為他禱告三次，並說一句好話給他，或傳一則善意的訊息。"],["p","第五，這個星期，對一個你虧欠的人，說一句：對不起，我錯了。不辯解，不加「但是」。"],["p","這五件事，不必一次做完，請挑一件，今天就開始；做完之後，再告訴一個你信得過的人，讓他為你高興，也為你禱告。"],["p","我宣告：神的話，會第二次來，我願意起來。"],["p","我宣告：我要丟棄手中的強暴，我要離開我的惡道。"],["p","我宣告：我不用過去的標籤，看我自己，也不看別人。"],["p","我宣告：耶穌是我的王，祂比約拿更大，我把一切，放在祂的憐憫之下。"],["p","還有一件事，值得在這裡停一停。這一章裡，所有的人都「起來」了：約拿起來，尼尼微人起來，王起來。可是，下一章，只有一個人坐下來，生悶氣。我們這一課，先把這個對比放在心裡：當神的話臨到，人可以起來，也可以坐下。你今天，是哪一個？"],["h","十、結語"],["p","約拿書第三章，是神的話第二次臨到，是一位逃過的先知再次起來，是五個詞的宣告，是一座大城從最大到至小一同信服，是一位王下了寶座，坐在灰中，是「誰知道呢」的謙卑，是神看見他們的行為，就後悔，不降災禍。開頭，是神又說了一次；結尾，是人回轉，神也回轉。"],["p","在這一章，神要我們看見祂的心：祂是一位給人第二次機會的神；祂是一位看見行為、而不只是儀式的神；祂也是一位，人往祂那裡轉，祂也往人這裡轉的神。而這一章的最後一節，只用了一個字，就把我們帶到下一章的門口：這個「惡」字，從尼尼微，落在約拿心裡。"],["p","所以，請你記得今天這一課的三個重點：神的話會第二次來，我可以起來；悔改要落在手上，我要離開惡道，丟棄手中的強暴；我把一切，放在神的憐憫之下，因為誰知道呢。這一課的焦點，不在你搞砸過多少次，不在尼尼微有多大，也不在四十日是幾天，而是那位比約拿更大、親自為我們走向十字架的耶穌。"],["p","親愛的天父，謝謝祢，祢的話會第二次來，祢沒有一句責備。求祢使我們聽見祢說「起來」，也使我們有勇氣，丟棄手中的強暴，離開我們的惡道；求祢安慰每一位覺得自己沒有資格被再用的人，讓他們知道，祢的憐憫，比我們的失敗更大。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人把「第二次機會」與「手中的強暴」帶到神面前，不急著替別人下判斷。"],["n","1. ★ 三章一節：耶和華的話二次臨到約拿。你有沒有一件事，神「再說一次」，你才發現它一直在那裡？請說出一個場景，不必細節。"],["n","2. ★ 三章三節：約拿便照耶和華的話起來。你最近有沒有一次，沒有等心情好，就先起來做了一件對的事？請說出一件。"],["n","3. ★★ 三章六節：王下了寶座，坐在灰中。你有沒有一次，願意從「我有理」的位置下來，先說一句「我錯了」？那是什麼感覺？"],["n","4. ★★★ 請在安靜中想一件事：你手中有沒有一個「強暴」——一句話、一筆帳、一個怨——你還抓著不放？用一句話寫下它，並寫下你願意怎樣丟棄。"],["m","帶領提醒：請先安靜念三章一節與十節，再開始。不要點名逼人說。這一章會碰到失敗、羞愧、被標籤與被傷害的經驗：如果有人提到被虐待、被暴力對待、長期的憂鬱或傷害自己的想法，不追問細節，不要求他原諒，不催促他和解，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照三章八節，你手中有沒有一個「強暴」？請只說出一個，例如一句話、一個習慣。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽三章二節「宣告我所吩咐你的話」，也聽三章九節「誰知道呢」。你心裡聽見的第一個感覺是什麼？"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：三章十節「惡」與「災禍」是同一個字。請用自己的話向組員說明：這個字怎樣連起人的回轉與神的回轉？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你可以丟棄的一件事，並當場說出一個時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，對一個人說「對不起」，或丟棄一個強暴；寫下時間，並說出誰會問你：做了嗎？"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，你一直用「過去的標籤」看他？請說出名字，並決定這個月用一句具體的話，給他第二次機會。"],["n","11. ★★ 你的小組或教會，有沒有人，因為一次失敗，被記了很久？請說出你可以怎樣，用邀請，不用論斷，陪他再起來。"],["n","12. ★★ 你有沒有一位，曾經給你第二次機會的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「離開惡道」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章去指責任何人的悔改不夠徹底，不要用「四十日」推算日子，也不要拿尼尼微去套用任何今日的國家或族群。若有人分享被傷害、被虐待、憂鬱或想傷害自己的念頭，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「強暴」，放在神面前。一起念三章九節。"],["p","由帶領者為每一位禱告：求神使我們聽見祂第二次的話，也使我們丟棄手中的強暴。散會前，彼此問一句：你這星期要丟棄哪一件事？"]]},"4":{"no":4,"vol":"《321約拿書講義》第4課·約拿書第4章","title":"我豈能不愛惜呢——怒、蓖、問","chars":4702,"min":60,"deep":8,"dchars":1492,"tchars":1320,"blocks":[["h","一、你是對的，可是你不開心（4:1–2）"],["p","弟兄姊妹平安。你有沒有過這樣的時刻：你很清楚，自己是對的。你講的道理，一個字都沒有錯；你的立場，有聖經的根據；你的委屈，有人也承認是委屈。可是，你心裡就是不開心，甚至很生氣。別人對你說：你都對了，還生什麼氣？你答不出來。你只知道，對了，卻沒有平安。約拿書第四章，就是這樣一章：一個全卷說話最正確的人，卻是全卷最不開心的人。"],["p","第三章的最後一節，神看見尼尼微人離開惡道，就後悔，不把所說的災禍降與他們。整座城得救了。你以為，接下來會是一場慶祝。可是第四章的第一句話，卻是：這事，約拿大大不悅，且甚發怒。你注意那個字：不悅，原文是 ra'ah，惡。字面是：這事，對約拿是一件大惡事。這個字，我們在全卷裡走過一遍了：尼尼微的惡上來到神面前；人離開惡道，神離開災禍；現在，這個字落在約拿心裡。神離開了災，約拿卻覺得這是一件大惡事。"],["p","然後，約拿禱告了。這是他第二次禱告，而這一次，他說出了第一章沒有說的話：耶和華啊，我在本國的時候，豈不是這樣說嗎？我知道你是有恩典、有憐憫的神，不輕易發怒，有豐盛的慈愛，並且後悔不降所說的災，所以我急速逃往他施去。原來，約拿逃，不是因為怕尼尼微人。他是因為認識神。他知道這位神，一定會憐憫，所以，他搶在前面，逃走了。"],["p","請你留意：約拿引用的，是以色列人最寶貴的信仰告白，出埃及記 34 章，神在西奈山上向摩西宣告的名字。這句話，是以色列人在悔改時，向神求恩的話。可是，在約拿口中，這句話，變成了抱怨：我知道你會這樣，所以我才不想去。這是一個非常深刻的提醒：一個人，可以非常準確地認識神，卻不歡喜神的心。約拿的神學，一個字都沒有錯；可是他的心，站在神的心的外面。"],["d",["約拿說的神學都是對的，為什麼神還要問他？","因為「知道」和「歡喜」是兩件事。約拿知道神是有恩典、有憐憫的神，這是對的；可是，當這份恩典臨到他不喜歡的人身上時，他不歡喜。神的問，不是要糾正他的神學，是要照出他的心。這提醒我們：讀聖經、背信仰告白、懂神學，都很重要；可是，這些知識，最後要帶我們到神的心旁邊。如果知識使我們越來越有理由生氣，我們需要停下來，讓神問一問。所以，與其問「我知道多少」，不如多問「我的心，有沒有跟著我所知道的，一起靠近神」。"]],["h","二、你這樣發怒合乎理嗎（4:3–5）"],["p","約拿接著說了一句很重的話：耶和華啊，現在求你取我的命吧，因為我死了比活著還好。這一句，我們要特別小心地聽。它不是一個笑話，也不是一個榜樣。聖經裡，摩西求過死（民 11:15），以利亞也求過死（王上 19:4），兩個人都在疲憊、失望與重壓之中。神怎麼回應他們？不是責備。神給以利亞餅與水，讓他睡覺，然後用一個安靜微小的聲音，對他說話。"],["p","在這裡，神怎麼回應約拿？只有一個問句：你這樣發怒合乎理嗎？你聽見了嗎？這不是定罪，也不是答案。這是一個邀請，邀請約拿，自己看一看自己的怒氣。神沒有說「你錯了」，神說：你想一想。而約拿，沒有回答。他出了城，坐在城的東邊，為自己搭了一座棚，坐在棚的蔭下，要看看那城究竟如何。"],["p","這一個畫面，很安靜：一個人，坐在城外，看著一座城。你有沒有發現，第三章，所有的人都起來了：約拿起來，尼尼微人起來，連王也起來，離開寶座。到了第四章，只有一個人，坐下了。他把自己，放在旁觀者的位置，為自己，預備一個蔭。他在看什麼？經文沒有說。我們不替經文補上它沒有說的心思。可是，我們都知道，我們有時候也這樣：看著別人蒙恩，我們坐在城外，看。"],["d",["約拿一次又一次說想死，這是神的先知該有的樣子嗎？","不是榜樣，但是需要被嚴肅對待。約拿的求死，不應被當作笑話，也不應被當作效法的對象。它是一種深重的痛苦，在聖經裡，也出現在摩西與以利亞身上。神的回應，不是責備，而是陪伴、飲食、休息與一個安靜的問題。如果你或你身邊的人，心裡有「不如消失」的念頭，請不要獨自承擔，請找你信得過的人，並尋求專業的幫助，例如醫師、輔導與當地的求助專線。神愛惜你，祂不要你消失。再說一次：你不需要自己扛著這件事，說出來，就是一個勇敢的開始，神與願意陪你的人，都在等你。"]],["h","三、原文亮光：安排、愛惜、惡（4:6–11）"],["p","這一章有三個原文字，是全卷的收尾。第一個，是「安排」（manah）。這個字，全卷出現四次，主詞都是神：安排大魚（1:17）、安排蓖麻（4:6）、安排蟲子（4:7）、安排東風（4:8）。你看，神安排的，有大魚、有蓖麻、有蟲子、有東風，有救人的，也有讓人失去的，全都為了同一個人：約拿。神沒有放手，祂用一次又一次的「安排」，把約拿帶到一個地方：他親自感覺到，我捨不得。"],["p","第二個，是「愛惜」（chus）。這個字，全書只出現兩次，在最後兩節：你尚且愛惜（4:10），我豈能不愛惜呢（4:11）。它的意思是「不忍心、憐惜」。約拿愛惜一棵他沒有栽種、沒有培養、一夜長起來、一夜枯死的植物；神愛惜一座城、十二萬人，還有許多牲畜。全書的最後一個動詞，是「愛惜」。這是約拿書的心跳：神不是只有公義，祂有一顆不忍的心。"],["p","第三個，是「惡」（ra'ah）。我們從第一章走到這裡：1:2 尼尼微的惡上來到神面前；3:8、10 人離開惡道，神離開災禍；4:1 約拿覺得這是大惡；4:6 蓖麻是為了救他脫離他的「苦楚」，也是這個字。一個字，貫穿全卷，從尼尼微，到神，到約拿。你有沒有發現，到最後，這個字的重量，已經不是在尼尼微的身上，而是在約拿的心裡。神在問：你的惡，要不要我也救你脫離？"],["d",["「大」這個字，在約拿書出現很多次，有什麼意思？","原文的「大」（gadol），在約拿書出現十多次：大城（1:2）、大風（1:4）、大懼怕（1:10、16）、大魚（1:17）、大城（3:2）、大不悅（4:1）、大喜樂（4:6），最後一次，在 4:11 的「尼尼微大城」。你可以看見，這個字在這卷書裡，一直在量度：什麼是真正大的？風大、魚大、城大、怒大、喜樂大，最後，是神的愛惜，比這一切都大。這是整卷書要我們看見的大。因此，每當你覺得自己的問題「很大」，不妨也把那個「大」，放在神的愛惜旁邊，重新看一看大小的比例，你會發現，心裡的重量，慢慢變輕了。"]],["h","四、蓖麻、蟲子、東風，和最後的問句（4:6–11）"],["p","我們來看神做的三件事。第一件：耶和華神安排一棵蓖麻，使其發生，高過約拿，影兒遮蓋他的頭，救他脫離苦楚。約拿因這棵蓖麻，大大喜樂。注意，這是整卷書，約拿唯一一次的喜樂，而且是為了一棵植物。他為一棵植物歡喜，卻沒有為一座城歡喜。"],["p","第二件：次日黎明，神卻安排一條蟲子，咬這蓖麻，以致枯槁。第三件：日頭出來的時候，神安排炎熱的東風，日頭曝曬約拿的頭，使他發昏，他就為自己求死，說：我死了比活著還好。請你看這三次安排的目的：不是為了折磨約拿。蓖麻，是來救他的；蟲子與東風，是要把他帶到一個地方。神在準備一個問題。祂把約拿，帶到他自己能感覺到「我捨不得」的地方。"],["p","然後，神問了第二次：你因這棵蓖麻發怒，合乎理嗎？這一次，約拿回答了：我發怒以至於死，都合乎理！你注意，他用的字，和神問他的字，是同一個字。他沒有迴避，沒有說「我不知道」，他說：是的，我就是這樣認為。這是整卷書裡，最誠實的一句話之一。神在等這句話，一個人不先說出自己的怒氣，就不能真正被問。神先讓約拿說出口，然後，才說最後的話。"],["p","神說：這蓖麻不是你栽種的，也不是你培養的，一夜發生，一夜乾死，你尚且愛惜；何況這尼尼微大城，其中不能分辨左手右手的有十二萬多人，並有許多牲畜，我豈能不愛惜呢？這是一個由小到大的論證：你為一棵你沒有勞苦過的植物，這麼捨不得，我為我所造、我所看顧的這些人，難道不捨得嗎？神沒有罵約拿「你沒有愛心」。祂只是，把約拿自己的心，指給他看：你看，你也會捨不得。然後，書卷結束了。"],["p","約拿有沒有回答？經文沒有說。他有沒有起來？經文沒有說。這不是作者沒有寫完，而是作者，把這個問句，交到每一位讀者手上。我們不替約拿回答，也不替經文補結局。我們只聽見那個問題：我豈能不愛惜呢？你的回答是什麼？"],["d",["這卷書為什麼不給結局？我可以替約拿補上一個嗎？","不建議補。經文把問句留在最後，是一種邀請：不是要你知道約拿怎樣，而是要你回答你自己。如果我們替約拿補上悔改的結局，我們可能會鬆一口氣，覺得這個問題已經解決；如果我們補上不悔改的結局，我們可能會覺得自己比他好。兩種補法，都讓我們離開那個問題。神的問，沒有結束，它在等每一個讀的人。留著那個問句，在心裡住一陣子，慢慢回答；這比立刻找到一個漂亮的答案，更能使我們的生命被神觸摸。"]],["d",["「不能分辨左手右手的人」是指誰？","原文可以有兩種理解：一是指年幼的孩子，在聖經裡，「不能分辨左右」常用來形容幼童（申1:39；賽7:15–16）；二是指不知道什麼是對錯、不認識神的人。本講義不替經文裁定。無論哪一種，這句話都在說：這些人，是神所愛惜的。我們不要用這句話建立超過經文的教義，只記得神的心：祂愛惜一座城，包括它裡面最不懂的人。重點不是我們能不能確定是哪一種人，而是神說了「我愛惜他們」，這已經足夠改變我們看人的眼光。"]],["h","五、幾個必須認得的偏差"],["p","第一個偏差，是把約拿講成反派、小人，用他來嘲笑一切心胸狹窄的人。約拿是神的先知，也是神所愛惜、所追問的人；這卷書沒有給他結局，因為神的問題，也問我們。檢驗標準是：會眾聽完，是更看見自己的心，還是更熱衷於批評約拿？"],["p","第二個偏差，是把約拿求死，講成笑話，或講成值得效法的屬靈表現。求死是深重的痛苦。摩西、以利亞也求過死，神的回應是陪伴、飲食、休息與安靜的聲音。本講義不鼓勵任何人傷害自己。檢驗標準是：聽的人，是更被陪伴，還是更覺得該被指責、該消失？"],["p","第三個偏差，是把蓖麻、蟲子、東風，講成神「用苦難折磨人」的方法。蓖麻是來救他脫離苦楚的，三次安排，是為了把約拿帶到「我捨不得」的地方。經文沒有說，每一個損失，都是神安排來教導人。檢驗標準是：失落的人聽了，是更知道神在，還是更覺得神在折磨他？"],["p","第四個偏差，是用「我豈能不愛惜呢」，要求受害者立刻原諒傷害他的人，或叫他們面對加害者。神的愛惜，是祂的心，不是對受傷者的命令。受害者不被逼著原諒，不被逼著和解；先被保護、被陪伴、被聽見，必要時尋求專業與法律上的協助。檢驗標準是：受傷的人聽了，是更感到被保護，還是更被催促？"],["p","第五個偏差，是替經文補上結局，說約拿後來悔改了、成了尼尼微的英雄，或說他不肯悔改。經文沒有說。作者把這個問句，交到每一位讀者手上。檢驗標準是：會眾聽完，是更面對那個問題，還是更急著知道故事的結局？"],["d",["我為不公義的事發怒，這也是錯的嗎？","不一定。聖經裡有義怒，耶穌也曾為聖殿被濫用而發怒（約2:13–17）。這一章的問題，不是「不可以生氣」，而是：約拿的怒，指向神的憐憫，不是指向惡。我們可以問自己：我的怒，是為了誰？是為了受害的人，還是為了我自己的面子、我的立場？把怒氣帶到神面前，讓祂問，是一個很安全的方式。所以，不必壓抑怒氣，也不必為它找理由；帶到神面前，讓祂的問句，淨化你的怒，使它變成行動的力量，而不是苦毒。"]],["h","六、兩個華人處境的真實問題"],["p","第一個問題：我們很習慣「為了道理，失去了人」。在華人的家庭、教會與職場裡，我們很重視是非對錯，很重視講理。我們常常說：我是對的，你為什麼不聽？可是，約拿書第四章告訴我們：一個人，可以講得非常有理，卻沒有愛。神問約拿的，不是「你有沒有理」，是「你愛惜嗎」。請你誠實地問自己：我最近，有沒有一場爭論，我贏了道理，卻輸了關係？"],["p","第二個問題：我們很習慣「不要讓某些人得到好處」。有人傷害過我們，有人對不起我們，我們心裡有一個尼尼微：我不想看見他得到憐憫。這種感覺，很真實，也很人性。約拿書沒有責備這種感覺，它只問：神的心是什麼？如果你曾被傷害，特別是被暴力、虐待或背叛傷害，請你不要被這一章催促：你不需要馬上原諒，也不需要面對傷害你的人。神先愛惜你，先保護你；請先尋求安全與陪伴，必要時，也尋求輔導與專業的協助。"],["d",["我受過很深的傷，讀這一章，覺得神好像要我去愛惜傷害我的人，我該怎麼辦？","請先停下來。這一章，沒有要求受傷的人，去面對傷害他的人，也沒有說，你必須立刻原諒。神的問句，是給約拿的，他是一位被差遣的先知，他的問題，是他不願意恩典臨到尼尼微。你的處境，與他不同。神愛惜你，祂不要你再次受傷。請先尋求安全，尋求一位你信得過的人、輔導或專業的協助，陪你慢慢走。原諒是一段路，不是一個命令；你可以先對神說：我還沒有力氣，求祢陪我。你不是沒有愛心，你是需要被愛惜的人；先讓自己被保護、被陪伴，其餘的，神會一步一步帶你，不必急。"]],["p","請你把這一課，放回整卷書來看。第一章，神說：起來，去，約拿卻逃。第二章，在深處，約拿說：救恩出於耶和華。第三章，神的話第二次來，約拿去了，尼尼微回轉了。第四章，神問：我豈能不愛惜呢？這四章，是一條線：神的話，神的救恩，神的第二次機會，神的愛惜。約拿是這條線上的人，我們也是。這條線，沒有在第四章結束，它在我們身上，繼續往下走。"],["d",["讀完整卷約拿書，我最該帶走的是什麼？","最該帶走的，是一個問題與一個畫面。問題是：我豈能不愛惜呢？這是神問約拿的，也是神問我們的。畫面是：一位不放棄的神，用風、用魚、用蓖麻、用東風，追著一個不願意的人，不是為了懲罰，而是為了讓他看見祂的心。如果你只能帶走一件事，請帶走這個：神的心，比我的理由更大；而祂的問，是慈愛的問。帶著這個問題，回到你的日常，在廚房、車上、職場、教會，都可以輕輕問一句：這件事上，神愛惜的是誰？"]],["h","七、活出321——被神問，被神愛惜"],["p","耶穌是我的榜樣。耶穌也站在一座城的外面。祂快到耶路撒冷，看見城，就為它哀哭（路19:41），說：耶路撒冷啊，耶路撒冷啊，我多次願意聚集你的兒女，好像母雞把小雞聚集在翅膀底下（太23:37）。約拿坐在城外，看；耶穌卻走進城裡，走向十字架，為那座不認識祂的城死了。神問約拿的那個問題，耶穌用祂的生命，給了答案：我豈能不愛惜呢？"],["p","聖經是我的準則。我們讀約拿書第四章，不是要判定約拿是好人或壞人，也不是要替經文補結局；我們讓聖經自己說話：神安排蓖麻，神問你發怒合乎理嗎，神說我豈能不愛惜。聖經的準則，讓我們不需要為自己的怒氣找理由，也不需要假裝自己沒有怒氣。"],["p","聖靈是我的引導。是聖靈，把神的愛，澆灌在我們心裡（羅5:5）。我們靠自己的力量，不可能愛惜我們不喜歡的人；求聖靈把神的心，放進我們裡面，使我們的怒氣，被神的問句觸摸。"],["p","讓耶穌作王。無己，是放下「我是對的」「我有理由」「我不要他得到好處」這些審判者的位置，回到本位：我是被愛惜的人，不是決定誰被愛惜的人。讓耶穌作王，就是讓祂的心，比我的理由大。"],["p","讓耶穌得著一切的榮耀。尼尼微得救，不是約拿的功勞；約拿被神追問，也不是約拿的功勞。從大魚到蓖麻，每一件事，都是神做的。榮耀歸給耶穌，因為祂是那位愛惜一座城、也愛惜一個固執的先知的神。"],["p","建立屬神的體系。一個屬神的群體，是一群被神問過、也願意被問的人：有人坐在城外，有人陪他靜下來；沒有人催促他立刻變好，沒有人替他補結局；大家一起，讓神的心，成為我們的心。"],["h","八、四種心，一個邀請"],["p","驕傲型的人說：我是對的，我的理由很充足。經文對他說：約拿的理由，也很充足。可是神問的，不是有理無理，是愛不愛惜。你可以先問自己：我有沒有一個人，我不想神愛惜他？"],["p","恐懼型的人說：我怕說出自己的怒氣，神會不高興。經文對他說：約拿說出來了，神沒有罵他，只是問他。神在等你說出口。你可以先用一句話，把你的怒氣，告訴神。"],["p","羞恥型的人說：我心裡有這樣的怒氣，我很羞愧。經文對他說：約拿是先知，他也有。神不是要你沒有怒氣，神是要你帶著怒氣來。你可以對神說：求祢憐憫，我還是不願意。"],["p","受傷型的人說：我被傷得很深，我不要愛惜傷害我的人。經文沒有要受傷的人，立刻愛惜加害者。神的愛惜，是為了生命，不是為了讓你再次受傷。你可以先對神說：求祢愛惜我，保護我，我需要時間。"],["h","九、這一週，你可以做的幾件事"],["p","第一，每天找三分鐘，讀四章四節，對神說：主，我生氣的理由是這個，求祢問我，也求祢把祢的心給我。連續七天，把你說出口的一句話，寫下來。"],["p","第二，寫下一個「你不想讓神愛惜」的人或處境，並寫下：我怕的是什麼？我捨不得的是什麼？把這張紙，放在聖經裡，每天看一次。"],["p","第三，找一位你信得過的人，說出你的怒氣，請他不急著勸你，只陪你一起安靜十分鐘。"],["p","第四，這個星期，為一個你不喜歡的人，做一件小小的善事，不告訴他是你做的。如果你曾被他傷害，請你先確定自己是安全的，再決定怎麼做。"],["p","第五，留意身邊「坐在城外」的人，不批評他，只問一句：你還好嗎？我可以陪你坐一會兒嗎？這五件事，請挑一件，從最小的開始，不必急著做完，也不必做得完美。"],["p","我宣告：我敢把我的怒氣，帶到神面前，讓祂問我。"],["p","我宣告：我不替神決定，誰配被愛惜，這是祂的權柄。"],["p","我宣告：神的問句，是慈愛的問句，我願意被祂問。"],["p","我宣告：耶穌是我的王，祂的心比我的理由大，我願意讓祂的心，成為我的心。"],["p","最後，請你帶著這個畫面回家：下一次，你又在心裡說「我是對的」的時候，請你停一停，想起那棵蓖麻。不是要你否認你的理由，而是要你問一句：神在這件事上，愛惜的是誰？也許你的回答，不會馬上改變；可是，只要你願意讓這個問題，在心裡住下來，神的心，就已經開始，慢慢靠近你的心了。這樣，就夠了。請你相信，這是一個很好的開始，因為神不是在催你，祂是在等你，也在陪你，一步一步地走。"],["h","十、結語"],["p","約拿書第四章，是一個你是對的、可是你不開心的人，一個坐在城外看的人，一棵蓖麻、一條蟲子、一陣東風，和一個沒有答案的問句。開頭，是約拿大大不悅；中間，是神三次安排；結尾，是神說：我豈能不愛惜呢？而整卷書，就在這個問句中，結束了。"],["p","在這一章，神要我們看見祂的心：祂是一位不急著定罪、卻一直發問的神；祂是一位愛惜一座城、也愛惜一個固執先知的神；祂也是一位，把最後一句話，留給我們每一個人去回答的神。約拿的故事，沒有結局；我們的故事，還在寫，而且是神與我們一起寫。"],["p","所以，請你記得今天這一課的三個重點：我可以把怒氣帶到神面前，神的問是慈愛的問；神的愛惜，比我的理由更大，我不是決定誰配被愛惜的人；這個問句，在等我回答，我可以從一小步開始。這一課的焦點，不在約拿有沒有悔改，不在蓖麻是什麼植物，也不在你的理由有多充足，而是那位站在城外為城哭泣、又走進城裡走向十字架的耶穌。"],["p","親愛的天父，謝謝祢，祢沒有罵我們，祢只是問我們。求祢使我們敢把怒氣帶到祢面前，也使我們願意被祢的心帶領；求祢保護每一位受過傷的人，讓他們知道，祢愛惜他們，不催促他們。祢的愛惜，比我們的理由更大。奉主耶穌基督的名禱告，阿們。"],["h","十一、小組討論分享：三個化"],["m","帶領說明：今天這一課，我們用三個化來走一遍：先把話放進自己心裡（內化），再一起想通、說出口、走一步（消化），最後把這一課帶到人面前（轉化）。"],["m","優先順序標示：★★★＝最優先，時間不足時每一化至少討論這一題；★★＝次優先；★＝時間充裕再討論。標【必做】的繁殖任務不可省略，可帶回家完成。"],["s","第一化　內化（約20分鐘）"],["m","目的：讓每個人把自己的怒氣帶到神面前，不急著替別人下判斷，也不急著勸別人原諒。"],["n","1. ★ 四章一節：約拿大大不悅。你最近有沒有一次，覺得自己是對的，卻不開心？請說出一個場景，不必細節。"],["n","2. ★ 四章四節：神問：你這樣發怒合乎理嗎？你曾經被誰、被什麼，用一個問句，輕輕碰到你的怒氣？請說出一件。"],["n","3. ★★ 四章六節：約拿因蓖麻大大喜樂。你最近為什麼小事，大大喜樂，或大大不開心？請說出一件。"],["n","4. ★★★ 請在安靜中想一件事：你心裡有沒有一個「尼尼微」，你不想讓神愛惜？用一句話寫下它，並寫下你願意讓誰，陪你把它帶到神面前。"],["m","帶領提醒：請先安靜念四章四節與十一節，再開始。不要點名逼人說。這一章會碰到憤怒、傷害、不原諒、憂鬱與求死的念頭：如果有人提到被虐待、被暴力對待、長期的憂鬱或傷害自己的想法，不追問細節，不要求他原諒，不催促他和解，不對他說「你要有信心」，會後單獨關心，必要時協助他尋求專業的幫助。"],["s","第二化　消化（約35分鐘·主軸）"],["m","目的：看見自己、聽神說話、想通關卡、說出口、走一步，讓這一課成為自己的話。"],["t","【看】看見自己"],["n","5. ★ 看見自己：對照四章二節，你有沒有一個人，是你知道神的恩典，但你不想讓他得到的？請只說出一個關係類型，不必說名字。"],["t","【聽】聽神說話"],["n","6. ★★ 聽神說話：安靜三分鐘，聽四章四節「你這樣發怒合乎理嗎」，也聽四章十一節「我豈能不愛惜呢」。你心裡聽見的第一個感覺是什麼？"],["t","【想】想通關卡"],["n","7. ★★★ 想通關卡：四章十、十一節是「你尚且愛惜，我豈能不愛惜」。請用自己的話向組員說明：神為什麼用一棵蓖麻，來問約拿？"],["t","【講】說出口"],["n","8. ★★ 說出口：用一句話向一位組員說，你可以向神說的一句真話，例如「主，我還是不願意，但我把它交給祢」，並當場說出一個時間。"],["t","【行】走一步"],["n","9. ★★★ 走一步：請決定這個星期的哪一天，為一個你不喜歡的人禱告三十秒；寫下時間，並說出誰會問你：做了嗎？"],["m","帶領提醒：依【看】【聽】【想】【講】【行】的順序走，每一步留足時間。【講】的時候，只要說出一句、一個名字、一個時間，不必講故事。若有人眼淚掉下來，不追問細節，也不要求他原諒誰，先安靜陪著，會後單獨關心。"],["s","第三化　轉化（約25分鐘）"],["m","目的：把這一課帶出去：進入家庭、職場、教會的真實關係，並讓福音繼續繁殖。"],["n","10. ★ 你身邊有沒有一位，像約拿一樣坐在城外的人？請說出名字，並決定這個月用一句具體的話關心他，只陪伴，不批評。"],["n","11. ★★ 你的小組或教會，有沒有人，因為怒氣與委屈，離開了？請說出你可以怎樣，用邀請，不用論斷，陪他把怒氣帶到神面前。"],["n","12. ★★ 你有沒有一位，曾經在你生氣時，沒有罵你、只是陪你的人？請說出名字，並決定這個月向他說聲謝謝。"],["n","13. ★★★ 920 操練：找出你的那一個「2」，就是你最想陪他一起「被神問、被神愛惜」的那位，這個星期向他分享，並且當場說出他的名字。"],["n","14. ★★★ 【必做】請在這個星期，把這一課用三句話講給一位教會外的朋友聽，並在下次小組回報：你對誰講的、在哪裡講、他的反應是什麼。"],["m","帶領提醒：請特別提醒：不要在小組裡用這一章要求任何人原諒傷害他的人，不要用它論斷任何人的怒氣，也不要拿尼尼微去套用任何今日的國家或族群。若有人分享被傷害、被虐待、憂鬱或想傷害自己的念頭，不追問細節、不要求原諒，不對正在流淚的人說「你要有信心」，會後單獨關心，必要時協助尋求輔導或其他專業的協助。"],["s","收尾（5分鐘）"],["p","請大家輕輕閉上眼睛，把今天寫下的那一個「尼尼微」，放在神面前。一起念四章十一節。"],["p","由帶領者為每一位禱告：求神使我們敢把怒氣帶到祂面前，也求神保護每一位受傷的人。散會前，彼此問一句：你這星期要向神說哪一句真話？"]]}}}</script>

  'use strict';

  /* ── 帶入詞 ────────────────────────────────────────────────────────
   * 寫這些句子的時候想的是：一位牧者站在台上，講到這裡會怎麼開口？

  var T = {
    /* 分段／節標題：{n} 是段序（中文數字），{t} 是標題 */
    section: [

    start: [

    startBare: [

    startAt: [

    startAtBare: [

    resume: [

  /* 表格與條列讀出來的零件。

    rowMid: ['再看', '接著', '然後', '再來', '接下來'],

    pairSep: '；',
    listSep: '、',
    itemFirst: '第{n}，',
    itemLast: '最後，',
    end: '。'
  };

  var DEF = {
    seed: 0,             // 換一課就換一個起點，整課的節奏不會跟上一課一樣
    speakUnit: true,
    cls: 'nar',          // HTML 的 class 前綴
    words: null,         // 上面那一組零件；英文版整組換掉
    /* 序號怎麼寫。預設中文數字（第三段）；英文版給 String（Section 3）。
       這一格漏了的話，英文版會唸成「Section 三」——模板全換成英文了，

    num: null,           // fn(n) -> string
    labels: { col: '欄', row: '列' }
  };

  var C = null;

  function ext(a, b) { for (var k in b) if (b.hasOwnProperty(k)) a[k] = b[k]; return a; }
  function esc(s) {

  function cfg() { return C || (C = ext({}, DEF)); }

  /* 中文數字。跟 REF321 的那一份刻意各留一份——

  function cn(n) {
    n = parseInt(n, 10);
    var d = '零一二三四五六七八九';
    if (isNaN(n)) return '';
    if (n < 10) return d.charAt(n);
    if (n < 20) return '十' + (n % 10 ? d.charAt(n % 10) : '');
    if (n < 100) return d.charAt(Math.floor(n / 10)) + '十' + (n % 10 ? d.charAt(n % 10) : '');
    return String(n);
  }

  /* ── 挑一套 ────────────────────────────────────────────────────────
   * 用位置算，不用亂數。同一課唸兩次要一模一樣——
   * 亂數的話逐句標示與跟讀會對不上，而且使用者會覺得「怎麼跟剛才不一樣」。
   *

   * 所以混進種類名字的雜湊，讓每一種各走各的。
   * ------------------------------------------------------------------- */

  function hash(kind) {
    var h = 0, i;
    for (i = 0; i < kind.length; i++) h = (h * 31 + kind.charCodeAt(i)) % 9973;

  }

  /* 序號：數字才轉，已經是字串的就原樣送出（宿主給「十二」那種） */
  function num(n) {

    var f = cfg().num;
    if (f) { try { return String(f(n)); } catch (e) {} }
    return cn(n);
  }

  function pick(kind, i) {
    var arr = T[kind];
    if (!arr || !arr.length) return '';
    var n = (Math.abs(parseInt(i, 10) || 0) + hash(kind) + (cfg().seed | 0)) % arr.length;
    return arr[n];
  }

  function fill(tpl, vars) {
    return String(tpl).replace(/\{(\w+)\}/g, function (m, k) {
      return vars && vars[k] != null ? String(vars[k]) : '';
    });
  }

  /* ── 對外的幾種帶入 ─────────────────────────────────────────────── */

  function lead(kind, i, vars) { return fill(pick(kind, i), vars || {}); }

  function section(title, n, i) {
    title = String(title == null ? '' : title).replace(/[。．.]$/, '');
    if (n == null || n === '') return fill(pick('heading', i), { t: title });
    return fill(pick('section', i), { n: num(n), t: title });

  function numbered(n, i) {
    return fill(pick('numbered', i), { n: num(n) });
  }

  function step(key, body, i) {

  /* ── 開始、暫停、停止、接續 ────────────────────────────────────────
   * `i` 是輪替的位置。分段、題目那些有天然的位置（第幾塊），

  function resume(n, i) {

  function pause(i) { return pick('pause', i); }
  function halt(i) { return pick('stop', i); }

  /* ── Markdown ─────────────────────────────────────────────────────
   * 只認小智真的會用到的那幾種：標題、粗體、條列、編號、表格、引用、行內碼。
   * 不做完整的 Markdown——做完整的話要處理巢狀、參考式連結、HTML 混排，
   * 那是一整個函式庫，而且錯了會把整段答案弄亂。
   * ------------------------------------------------------------------- */

  function isTableLine(l) { return /^\s*\|.*\|\s*$/.test(l); }
  function isDivider(l) { return /^\s*\|[\s:|-]*\|\s*$/.test(l) && l.indexOf('-') >= 0; }

  function cells(l) {
    var t = String(l).replace(/^\s*\|/, '').replace(/\|\s*$/, '');
    var out = t.split('|'), i;
    for (i = 0; i < out.length; i++) out[i] = out[i].replace(/^\s+|\s+$/g, '');
    return out;
  }

  /* 把整段切成一塊一塊：段落、標題、條列、編號、表格、引用 */
  function blocks(md) {
    var lines = String(md == null ? '' : md).replace(/\r\n?/g, '\n').split('\n');
    var out = [], i = 0;
    while (i < lines.length) {
      var l = lines[i];
      if (!l.replace(/\s/g, '')) { i++; continue; }

      if (isTableLine(l) && i + 1 < lines.length && isDivider(lines[i + 1])) {

        i += 2;
        while (i < lines.length && isTableLine(lines[i])) { rows.push(cells(lines[i])); i++; }

        continue;
      }
      var m = l.match(/^\s*(#{1,6})\s*(.+)$/);
      if (m) { out.push({ k: 'h', n: m[1].length, t: m[2] }); i++; continue; }
      if (/^\s*>/.test(l)) {
        var q = [];
        while (i < lines.length && /^\s*>/.test(lines[i])) {
          q.push(lines[i].replace(/^\s*>\s?/, '')); i++;
        }
        out.push({ k: 'quote', t: q.join('\n') });
        continue;
      }
      if (/^\s*([-*・]|\d+[.、)])\s+/.test(l)) {
        var items = [], ord = /^\s*\d+[.、)]/.test(l);
        while (i < lines.length && /^\s*([-*・]|\d+[.、)])\s+/.test(lines[i])) {
          items.push(lines[i].replace(/^\s*([-*・]|\d+[.、)])\s+/, '')); i++;
        }
        out.push({ k: 'list', ord: ord, items: items });
        continue;
      }
      var p = [];
      while (i < lines.length && lines[i].replace(/\s/g, '') &&
             !isTableLine(lines[i]) && !/^\s*(#{1,6}\s|>|[-*・]\s|\d+[.、)]\s)/.test(lines[i])) {

      /* 一行都沒收進來的話，i 就不會動——那是一個無窮迴圈，而且會把
         陣列撐爆。會走到這裡的是「長得像表格、可是下一行不是分隔線」
         那種行（例如只有一行的 `| 這不是表格 |`）。
         這種行就當成普通一段，硬收一行再往下走。 */
      if (!p.length) { p.push(lines[i]); i++; }
      out.push({ k: 'p', t: p.join('\n') });
    }
    return out;
  }

     分不乾淨的時候寧可原樣留著，也不要把句子拆壞。 */
  function inlineHTML(t) {

      .replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>')
      .replace(/`([^`]+)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }
  function inlineText(t) {
    return String(t == null ? '' : t)
      .replace(/\*\*([^*]+)\*\*/g, '$1')
      .replace(/`([^`]+)`/g, '$1')
      .replace(/^\s+|\s+$/g, '');
  }

  /* ── 給眼睛看的 ──────────────────────────────────────────────────── */

  function html(md) {
    var bs = blocks(md), out = [], i, b, j, c = cfg().cls;
    for (i = 0; i < bs.length; i++) {
      b = bs[i];
      if (b.k === 'h') {
        out.push('<p class="' + c + 'h' + (b.n <= 2 ? '' : ' sm') + '">' + inlineHTML(b.t) + '</p>');
      } else if (b.k === 'quote') {
        out.push('<blockquote class="' + c + 'q">' + inlineHTML(b.t) + '</blockquote>');
      } else if (b.k === 'list') {
        var tag = b.ord ? 'ol' : 'ul';
        var li = '';
        for (j = 0; j < b.items.length; j++) li += '<li>' + inlineHTML(b.items[j]) + '</li>';
        out.push('<' + tag + ' class="' + c + 'l">' + li + '</' + tag + '>');
      } else if (b.k === 'table') {
        var h = '<div class="' + c + 'tw"><table class="' + c + 't"><thead><tr>';
        for (j = 0; j < b.head.length; j++) h += '<th>' + inlineHTML(b.head[j]) + '</th>';
        h += '</tr></thead><tbody>';
        for (j = 0; j < b.rows.length; j++) {
          h += '<tr>';
          for (var k = 0; k < b.head.length; k++) {
            h += '<td>' + inlineHTML(b.rows[j][k] || '') + '</td>';
          }
          h += '</tr>';
        }
        out.push(h + '</tbody></table></div>');
      } else {
        out.push('<p>' + inlineHTML(b.t) + '</p>');
      }
    }
    return out.join('');
  }

  /* ── 給耳朵聽的 ──────────────────────────────────────────────────── */

  /* 一張表讀成一段話。
     第一欄當成那一列在講什麼，其餘各欄是它的內容。
     兩欄表最單純：「甲，是乙。」 */
  function w() { return (cfg().words) || W; }

  function tableSpeech(b, i) {
    var head = b.head || [], rows = b.rows || [], out = [], j, k, ww = w();
    out.push(pick('table', i));
    /* 兩欄表不必報欄數——「這張表有二欄」是廢話，而且拖慢節奏。
       三欄以上才值得先說一聲，不然聽的人跟不上後面的對照。 */
    if (head.length >= 3) {
      out.push(fill(ww.cols, { n: num(head.length), list: head.join(ww.listSep) }));
    }
    for (j = 0; j < rows.length; j++) {
      var r = rows[j], label = inlineText(r[0] || '');
      var link = j === 0 ? ww.rowFirst[(i + j) % ww.rowFirst.length]
               : (j === rows.length - 1 && rows.length > 2 ? ww.rowLast[0]
                  : ww.rowMid[(i + j) % ww.rowMid.length]);
      if (head.length === 2) {
        out.push(fill(ww.row2, { link: link, label: label, value: inlineText(r[1] || '') }));
      } else {
        var parts = [];
        for (k = 1; k < head.length; k++) {
          var v = inlineText(r[k] || '');
          if (v) parts.push(fill(ww.pair, { col: inlineText(head[k]), value: v }));
        }
        out.push(fill(ww.rowN, { link: link, label: label, parts: parts.join(ww.pairSep) }));
      }
    }
    return out.join('');
  }

  function listSpeech(b, i) {
    var out = [], j;
    if (b.items.length > 2) out.push(pick('list', i));
    for (j = 0; j < b.items.length; j++) {
      var t = inlineText(b.items[j]);
      if (!t) continue;
      /* 前兩點說「第一」「第二」，後面換成連接詞——
